<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記帳レビュー</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#d9dde3;--text:#1d2530;--muted:#667085;--accent:#1f5fbf;--accent-bg:#e8f0fd;--high:#b42318;--high-bg:#fde8e6;--mid:#b54708;--mid-bg:#fdf0dc;--low:#475467;--low-bg:#eceff3;--ok:#067647;--ok-bg:#dff5e8;--guess:#6941c6;--guess-bg:#f1ebfd}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
#app{display:flex;flex-direction:column;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px;background:#16263d;color:#fff}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.04em}
header h1 small{font-weight:400;opacity:.6;font-size:11px}
header label{font-size:12px;opacity:.95}
header .local{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:99px}
nav{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:11px 14px;font-size:14px;border-bottom:3px solid transparent;border-radius:0;color:var(--muted);white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.cnt{background:var(--high);color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
main{padding:16px 20px 40px;flex:1;min-width:0}
main:not(.tab-review){max-width:1180px}
h2{font-size:18px;margin:4px 0 8px}h3{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}h4{font-size:13px;margin:12px 0 4px;color:#344054}
p{margin:6px 0}ul{margin:4px 0;padding-left:20px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid #b9c0cb;background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{background:#f0f3f7}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.primary:hover{background:#184c9a}
button.danger{color:var(--high);border-color:#e3a6a0}button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
select,input,textarea{border:1px solid #b9c0cb;border-radius:6px;padding:5px 8px;background:#fff;max-width:100%}
header select,header input{color:var(--text)}
textarea{width:100%;resize:vertical}
.muted{color:var(--muted);font-size:12.5px}.pad{padding:16px}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.src{color:var(--muted);font-size:11.5px;word-break:break-all}
.empty{max-width:640px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.rowbtns.center{justify-content:center}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:stretch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;min-width:108px;font-size:12px;color:var(--muted)}
.card .n{font-size:24px;font-weight:700;color:var(--text);line-height:1.2}.card .n small{font-size:13px;font-weight:400;color:var(--muted)}
.card.big{border-color:var(--accent);background:var(--accent-bg)}.card.alert{border-color:var(--high);background:var(--high-bg)}.card.alert .n{color:var(--high)}
.runbox{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center;text-align:right}
.warnbox,.notebox{border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.warnbox{background:var(--mid-bg);border:1px solid #f0c98a}.notebox{background:var(--accent-bg);border:1px solid #bcd0f3}
details.notes{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:8px 0;font-size:13px}
summary{cursor:pointer;color:#344054}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.filters input[type=search]{min-width:220px}.chk{display:flex;gap:4px;align-items:center}
.split{display:grid;grid-template-columns:minmax(340px,38%) 1fr;gap:12px;align-items:start}
.list,.detail{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:calc(100vh - 150px);overflow:auto}
.list{position:sticky;top:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;border-bottom:1px solid #eceff3;border-radius:0;padding:9px 12px;align-items:center}
.row.on{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.row .ttl{font-weight:600;font-size:13.5px}.row .meta{grid-column:2/4;font-size:12px;color:var(--muted)}
.badge{display:inline-block;border-radius:4px;padding:0 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.sev-high{background:var(--high-bg);color:var(--high)}.sev-mid{background:var(--mid-bg);color:var(--mid)}.sev-low{background:var(--low-bg);color:var(--low)}
.st-open{background:#fff;border:1px solid #98a2b3;color:#344054}.st-working{background:var(--accent-bg);color:var(--accent)}.st-waiting{background:var(--mid-bg);color:var(--mid)}.st-fixed,.st-ok{background:var(--ok-bg);color:var(--ok)}
.badge.rc{background:var(--low-bg);color:var(--low)}
.basis{font-size:11.5px;border-left:3px solid;padding-left:5px;margin-right:8px}
.b-data{border-color:#1f5fbf;color:#1f5fbf}.b-rule{border-color:var(--high);color:var(--high)}.b-trend{border-color:var(--mid);color:var(--mid)}.b-evidence{border-color:var(--guess);color:var(--guess)}
.tag{font-size:11.5px;background:var(--low-bg);color:var(--low);border-radius:4px;padding:0 6px}
.detail{padding:14px 18px}.detail h3{border:0;margin:6px 0 2px;font-size:16px}.dhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.detail section{border-top:1px solid #eceff3;padding:6px 0 8px;margin-top:8px}
.fact,.guess{font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;margin-left:4px}
.fact{background:var(--ok-bg);color:var(--ok)}.guess{background:var(--guess-bg);color:var(--guess)}
section.infer{background:#faf8ff;border:1px dashed #cdbdf3;border-radius:8px;padding:6px 12px 8px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:6px;margin:4px 0}.tblwrap.small{max-height:260px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:4px 8px;border-bottom:1px solid #eceff3;text-align:left;vertical-align:top}
th{background:#f3f5f8;font-weight:600;white-space:nowrap;position:sticky;top:0}th.num{text-align:right}
tr.sep td{border-top:2px solid #c9d0da}
table.kv{width:auto;border:1px solid var(--line)}table.kv th{position:static;width:150px}
table td input{width:100%;min-width:70px}
.copyline{background:#f7f8fa;border-radius:6px;padding:6px 10px}code{font-family:inherit}
.stbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.stbtns button.on{font-weight:700;border-width:2px}
.exform{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px;margin:6px 0}.grid label,.exform>label{display:flex;flex-direction:column;font-size:12px;color:#344054;gap:2px}.grid .span2{grid-column:span 2}.wide{width:100%}
.hist{font-size:12.5px}
.drop{border:2px dashed #b9c0cb;border-radius:10px;padding:16px;background:var(--panel);margin:10px 0}
.preview{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:8px 16px 12px;margin:12px 0}
.recon td{font-size:12.5px}.rc-match td{color:var(--muted)}
pre.handoff{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;white-space:pre-wrap;font:13px/1.7 inherit;font-family:inherit}
.filebtn{border:1px solid #b9c0cb;border-radius:6px;padding:5px 12px;background:#fff;cursor:pointer}.filebtn input{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#16263d;color:#fff;padding:9px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.bad{background:var(--high)}
@media(max-width:900px){.split{grid-template-columns:1fr}.list{position:static;max-height:45vh}.detail{max-height:none}.runbox{margin-left:0;align-items:flex-start;text-align:left}header .local{margin-left:0}}
@media print{header,nav,.noprint,.toast{display:none!important}body{background:#fff}main{padding:0}pre.handoff{border:0;padding:0}.list,.detail{max-height:none;overflow:visible}}
header button{color:var(--text)}
.summary{align-items:flex-start}
.row>.badge:first-child{grid-column:1;grid-row:1;justify-self:start}
.row .ttl{grid-column:2;grid-row:1}
.row>.badge:last-child{grid-column:3;grid-row:1;justify-self:end}
.row .meta{grid-row:2}
table.entries td:first-child{white-space:nowrap}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script>
// 記帳レビュー：共通の小さな関数（文字の正規化・日付・金額・ハッシュ）
(function (root) {
  'use strict';
  const KR = root.KR = root.KR || {};

  const nfkc = s => String(s == null ? '' : s).normalize('NFKC');
  // 値の保持用：前後の空白と不可視文字だけ除く（全角・半角は変えない）
  const trim = s => String(s == null ? '' : s).replace(/[\u200b\ufeff]/g, '').trim();
  const clean = s => nfkc(s).replace(/[​﻿]/g, '').replace(/\s+/g, ' ').trim();
  // 取引先名の比較用：法人格・空白・記号を落とす（表示には使わない）
  const normPartner = s => clean(s).toUpperCase()
    .replace(/株式会社|有限会社|合同会社|\(株\)|\(有\)|\(同\)|㈱|㈲/g, '')
    .replace(/[\s\-‐ー・.,、。()（）]/g, '');
  // 摘要の比較用：数字・日付・記号を落として「同じ種類の摘要」をまとめる
  const normDesc = s => clean(s).toUpperCase()
    .replace(/[0-9]+/g, '').replace(/[年月日分号回第\/\-‐ー:：.,、。()（）\[\]#＃*＊\s]/g, '');

  function pad(n) { return String(n).padStart(2, '0'); }
  function validYMD(y, m, d) {
    if (!(y >= 1990 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return y + '-' + pad(m) + '-' + pad(d);
  }
  const ERA = { R: 2018, 令和: 2018, H: 1988, 平成: 1988 };
  // 読める形式：2026/10/1、2026-10-01、2026.10.1、2026年10月1日、20261001、R8.10.1、令和8年10月1日
  function parseDate(v) {
    const s = clean(v);
    if (!s) return null;
    let m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?$/);
    if (m) return validYMD(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return validYMD(+m[1], +m[2], +m[3]);
    m = s.match(/^(R|H|令和|平成)\s?(\d{1,2}|元)[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/i);
    if (m) { const base = ERA[m[1].toUpperCase()] || ERA[m[1]]; return validYMD(base + (m[2] === '元' ? 1 : +m[2]), +m[3], +m[4]); }
    return null;
  }
  // 金額：カンマ・円記号・全角を許す。小数（.00 以外）や文字が混じるものは読めないとして null ではなく NaN を返す
  function parseAmount(v) {
    let s = clean(v);
    if (s === '') return null;
    let neg = false;
    if (/^[△▲]/.test(s) || /^\(.*\)$/.test(s)) { neg = true; s = s.replace(/^[△▲]/, '').replace(/^\((.*)\)$/, '$1'); }
    s = s.replace(/[¥￥,円\s]/g, '');
    if (/^-/.test(s)) { neg = !neg; s = s.slice(1); }
    if (!/^\d+(\.0+)?$/.test(s)) return NaN;
    const n = Math.round(parseFloat(s));
    return neg ? -n : n;
  }
  const yen = n => (n == null || isNaN(n)) ? '' : (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('ja-JP') + '円';
  const monthOf = d => d.slice(0, 7);
  function addMonths(ym, k) {
    const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k;
    return (y + Math.floor(m / 12)) + '-' + pad(((m % 12) + 12) % 12 + 1);
  }
  function monthEnd(ym) { const y = +ym.slice(0, 4), m = +ym.slice(5, 7); return ym + '-' + pad(new Date(Date.UTC(y, m, 0)).getUTCDate()); }
  function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function addDays(d, k) { return new Date(Date.parse(d + 'T00:00:00Z') + k * 86400000).toISOString().slice(0, 10); }
  function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : Math.round((s[h - 1] + s[h]) / 2); }
  // 内容から作る安定した短い識別子（FNV-1a 2本）。同じ内容なら再取込しても同じ値になる
  function hash(str) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
      h2 = Math.imul(h2 + c, 0x85ebca6b) >>> 0; h2 ^= h2 >>> 13;
    }
    return h1.toString(36) + (h2 >>> 0).toString(36);
  }
  function groupBy(list, fn) { const m = new Map(); for (const x of list) { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
  function countBy(list, fn) { const m = new Map(); for (const x of list) { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); } return m; }

  KR.util = { nfkc, trim, clean, normPartner, normDesc, parseDate, parseAmount, yen, monthOf, addMonths, monthEnd, dayDiff, addDays, median, hash, groupBy, countBy, pad };
  if (typeof module !== 'undefined' && module.exports) module.exports = KR;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
// 記帳レビュー：CSVの読み取り（文字コードの判定、仕訳帳・明細の列の対応づけと行ごとの検証）
(function (root) {
  'use strict';
  const KR = root.KR = root.KR || {};
  const U = KR.util;

  // UTF-8 として正しく読めなければ Shift_JIS とみなす（freee の既定は Shift_JIS）
  function decode(bytes) {
    const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    try {
      const text = new TextDecoder('utf-8', { fatal: true }).decode(u8);
      return { text: text.replace(/^﻿/, ''), encoding: 'UTF-8' };
    } catch (e) {
      const text = new TextDecoder('shift_jis').decode(u8);
      const bad = (text.match(/�/g) || []).length;
      return { text, encoding: 'Shift_JIS', badChars: bad };
    }
  }

  // RFC4180 相当（引用符内の改行・カンマ、"" のエスケープ）。区切りはカンマかタブ
  function parse(text) {
    const first = text.slice(0, text.indexOf('\n') < 0 ? text.length : text.indexOf('\n'));
    const sep = (first.split('\t').length > first.split(',').length) ? '\t' : ',';
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"' && cell === '') q = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // 列名の候補。freee の仕訳帳CSV（新・旧）で使われる名前と、よくある別名
  const JOURNAL_FIELDS = {
    date: ['取引日', '日付', '発生日', '仕訳日'],
    slip: ['伝票番号', '仕訳番号', 'No.', 'No', '取引番号', '番号'],
    ref: ['管理番号'],
    dAcc: ['借方勘定科目', '借方科目'], dAmt: ['借方金額'], dTax: ['借方税区分'],
    dTaxAmt: ['借方税金額', '借方税額', '借方消費税額'], dPartner: ['借方取引先', '借方取引先名'],
    dItem: ['借方品目'], dDept: ['借方部門'], dNote: ['借方備考', '借方メモ'],
    cAcc: ['貸方勘定科目', '貸方科目'], cAmt: ['貸方金額'], cTax: ['貸方税区分'],
    cTaxAmt: ['貸方税金額', '貸方税額', '貸方消費税額'], cPartner: ['貸方取引先', '貸方取引先名'],
    cItem: ['貸方品目'], cDept: ['貸方部門'], cNote: ['貸方備考', '貸方メモ'],
    partner: ['取引先', '取引先名'],
    desc: ['摘要', '取引内容', '備考'],
    adj: ['決算整理仕訳'],
  };
  const JOURNAL_LABEL = {
    date: '取引日', slip: '伝票番号', ref: '管理番号', dAcc: '借方勘定科目', dAmt: '借方金額', dTax: '借方税区分', dTaxAmt: '借方税額',
    dPartner: '借方取引先', dItem: '借方品目', dDept: '借方部門', dNote: '借方備考', cAcc: '貸方勘定科目', cAmt: '貸方金額', cTax: '貸方税区分',
    cTaxAmt: '貸方税額', cPartner: '貸方取引先', cItem: '貸方品目', cDept: '貸方部門', cNote: '貸方備考', partner: '取引先', desc: '摘要', adj: '決算整理仕訳',
  };
  const STATEMENT_FIELDS = {
    date: ['日付', '取引日', '年月日', '利用日', 'ご利用日', 'お取引日'],
    desc: ['摘要', '内容', 'お取引内容', '取引内容', '利用店名', 'ご利用先', '備考'],
    out: ['出金', '出金額', 'お支払金額', '支払金額', 'お引出し', 'お引出金額', '利用金額', 'ご利用金額'],
    inn: ['入金', '入金額', 'お預り金額', '預り金額', 'お預入れ', 'お預入金額'],
    amount: ['金額', '取引金額'],
    balance: ['残高', '差引残高'],
  };

  function mapHeader(header, fields) {
    const map = {}, used = new Set();
    const names = header.map(h => U.clean(h));
    for (const [key, aliases] of Object.entries(fields)) {
      for (const a of aliases) {
        const i = names.findIndex((n, idx) => !used.has(idx) && n === a);
        if (i >= 0) { map[key] = i; used.add(i); break; }
      }
    }
    return { map, unmapped: names.filter((n, i) => n && !used.has(i)) };
  }
  // 先頭10行のうち、列名の候補にいちばん多く当たる行を見出しとする
  function findHeader(rows, fields) {
    let best = -1, bestHits = 0;
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      const hits = Object.keys(mapHeader(rows[i], fields).map).length;
      if (hits > bestHits) { best = i; bestHits = hits; }
    }
    return { index: best, hits: bestHits };
  }

  // 仕訳帳CSV → 行データ。読めない行は捨てずに理由を付けて返す
  function readJournal(text, fileName) {
    const rows = parse(text);
    const out = { kind: 'journal', fileName: fileName || '', lines: [], rejected: [], warnings: [], columns: [], unmapped: [], stats: null, fatal: null };
    const h = findHeader(rows, JOURNAL_FIELDS);
    if (h.index < 0 || h.hits < 3) { out.fatal = '見出し行が見つかりません。freee の仕訳帳CSV（取引日・借方勘定科目・借方金額・貸方勘定科目・貸方金額の列）を選んでください。'; return out; }

  function top(map) { let k = null, c = 0, n = 0; for (const [key, v] of map) { n += v; if (v > c) { c = v; k = key; } } return { key: k, count: c, total: n, share: n ? c / n : 0 }; }
  const pct = x => Math.round(x * 100) + '%';
  const distText = map => [...map].sort((a, b) => b[1] - a[1]).map(([k, v]) => (k || '（空欄）') + ' ' + v + '件').join('、');

  function runReview(company, lines, month, files) {
    const t = M.thresholds(company);
    const entries = M.buildEntries(company, lines);
    const all = entries.flatMap(e => e.postings);
    const mStart = month + '-01', mEnd = U.monthEnd(month);
    const cur = all.filter(p => p.entry.month === month);
    const prior = all.filter(p => p.entry.date < mStart);
    const dataMonths = new Set(entries.map(e => e.month));
    const prev3 = [1, 2, 3].map(k => U.addMonths(month, -k));
    const hasPrev3 = prev3.every(m => dataMonths.has(m));
    const view = e => M.entryView(e, files);
    const findings = [], suppressed = [], notes = [];
    const add = f => { f.month = month; f.entries = f.entries || []; f.comparison = f.comparison || null; f.calc = f.calc || []; f.inference = f.inference || []; f.sources = f.sources || []; f.fix = f.fix || null; findings.push(f); };
    const ruleFor = p => (company.partnerRules || []).find(r => r.partner && U.normPartner(r.partner) === p.pkey);
    const recurRules = company.recurring || [];
    const recurMatch = (r, p) => r.account === p.account && (!r.partner || U.normPartner(r.partner) === p.pkey) && (!r.keyword || U.nfkc(p.desc).includes(U.nfkc(r.keyword)));

    if (!cur.length) notes.push('対象月（' + month + '）の仕訳が取り込まれていません。');
    if (!hasPrev3) notes.push('対象月の前3か月（' + prev3.slice().reverse().join('・') + '）のうち、仕訳がない月があります。「定期取引の計上漏れ」の自動検出は行っていません（会社ルールに登録した定期取引だけを確認しています）。');
    if (!prior.length) notes.push('対象月より前の仕訳がないため、「過去傾向との違い」（勘定科目・税区分・金額）は判定していません。');
    if (!all.some(p => p.tax)) notes.push('税区分の列がない、またはすべて空欄のため、税区分のチェックは行っていません。');
    if (!all.some(p => p.pkey)) notes.push('取引先の列がない、またはすべて空欄のため、取引先ごとの比較は摘要を手がかりにした範囲に限られます。');
    notes.push('登録経路（自動登録ルール・明細同期・手入力など）は仕訳帳CSVに含まれないため取得していません。自動登録ルールに関する記述はすべて推測です。');
    notes.push('売掛金・買掛金などの滞留、期首・期末残高の整合性、前月・前年同月比較は、この版では行っていません（未対応事項を参照）。');

    // ---------- 1. 重複候補 ----------
    {
      const w = t.dateWindow;
      const cands = all.filter(p => p.kind !== 'fund' && !p.entry.isTransfer && Math.abs(p.amount) >= t.min && (p.pkey || p.dkey));
      const groups = U.groupBy(cands, p => [p.side, p.account, p.amount, p.pkey || 'D:' + p.dkey].join('|'));
      const seen = new Set();
      for (const [K, ps0] of groups) {
        // 1つの仕訳からは1つだけ
        const ps = [...new Map(ps0.map(p => [p.entry.id, p])).values()].sort((a, b) => a.entry.date < b.entry.date ? -1 : 1);
        if (ps.length < 2) continue;
        const clusters = []; let c = [ps[0]];
        for (let i = 1; i < ps.length; i++) { if (U.dayDiff(ps[i - 1].entry.date, ps[i].entry.date) <= w) c.push(ps[i]); else { clusters.push(c); c = [ps[i]]; } }
        clusters.push(c);
        for (const cl of clusters) {
          if (cl.length < 2 || !cl.some(p => p.entry.month === month)) continue;
          const id = cl.map(p => p.entry.id).sort().join(',');
          if (seen.has(id)) continue; seen.add(id);
          const p0 = cl[0], amount = Math.abs(p0.amount);
          const sameDay = cl.every(p => p.entry.date === p0.entry.date);
          const routes = new Set(cl.map(p => p.route)), sameRoute = routes.size === 1;
          const label = p0.account + ' ' + U.yen(amount) + ' ' + who(p0);
          if (!sameDay && sameRoute && (!p0.pkey || amount < t.mid)) { suppressed.push({ check: 'DUP', text: label + '：日付が違い決済経路が同じ' + (p0.pkey ? '少額の' : '（取引先なしの）') + '取引のため、重複候補にしていません（' + cl.map(p => p.entry.date).join('・') + '）' }); continue; }
          // 過去も同じ形（同じ内容が近い日付に同じ件数）で計上されているなら、その会社の通常の処理とみなす
          const hist = prev3.filter(m => clusters.some(o => o !== cl && o.length >= cl.length && o.every(p => p.entry.month === m)));
          if (hist.length >= 2) { suppressed.push({ check: 'DUP', text: label + '：' + hist.slice().reverse().join('・') + ' にも同じ内容が' + cl.length + '件ずつ計上されているため、通常の処理とみなし重複候補にしていません' }); continue; }
          const months = new Set(cl.map(p => p.entry.month));
          if (!sameDay && sameRoute && months.size === cl.length && prev3.filter(m => ps.filter(p => p.entry.month === m).length === 1).length >= 2) { suppressed.push({ check: 'DUP', text: label + '：毎月1件ずつ計上されている取引が月をまたいで近い日付になったもののため、重複候補にしていません' }); continue; }
          let s = sev(amount, t); if (sameDay && sameRoute) s = bump(s);
          const inference = [];
          if (!sameRoute) inference.push('相手科目が違うため（' + [...routes].join(' と ') + '）、同じ支払いを「明細の同期」と「手入力・請求書からの登録」で二重に計上した可能性があります。');
          else if (sameDay) inference.push('同じ内容を2回登録した、またはCSVを二重に取り込んだ可能性があります。同じ日に同額の取引が実際に複数あった可能性もあります。');
          inference.push('登録経路はCSVに含まれないため、どちらが元の登録かは判定できません。');
          add({
            key: 'DUP|' + U.hash(K + '|' + cl.map(p => p.entry.date).join(',')), check: 'DUP', basis: 'data', severity: s,
            title: '重複候補：' + label + '（' + cl.length + '件）', amount, partner: p0.partner, account: p0.account, date: cl.find(p => p.entry.month === month).entry.date,
            reason: sideName(p0.side) + '「' + p0.account + '」' + U.yen(amount) + '（' + who(p0) + '）が、' + (sameDay ? '同じ日（' + p0.entry.date + '）' : t.dateWindow + '日以内（' + cl.map(p => p.entry.date).join('・') + '）') + 'に' + cl.length + '件あります。',
            entries: cl.map(p => view(p.entry)),
            calc: ['一致の条件：' + sideName(p0.side) + '科目・金額・' + (p0.pkey ? '取引先' : '摘要（数字と記号を除いて比較）') + 'が同じ、日付の差が' + w + '日以内', '相手科目：' + cl.map(p => p.entry.date + ' ' + (p.route || '（なし）')).join(' ／ '), '過去3か月に同じ形の複数計上：' + (hist.length ? hist.join('・') : 'なし')],
            inference,
            documents: ['請求書・領収書（同じ請求が1件か複数件か）', sameRoute ? '通帳・カード明細（同額の引落しが実際に何回あるか）' : '通帳・カード明細と、未払金・現金で登録した取引の元資料'],
            nextAction: '証憑で実際の取引件数を確認してください。1件だけなら、決済の事実と合う側を残し、もう一方の取消を検討します。',
            fix: null, fixNote: 'どちらを残すかはデータだけでは判断できないため、修正案は示していません。',
            question: (p0.partner || 'お取引先') + ' への ' + U.yen(amount) + '（' + p0.account + '）が ' + cl.map(p => p.entry.date).join(' と ') + ' に計上されています。実際のお支払い（ご入金）は何回でしたでしょうか。請求書・領収書があればあわせてご共有ください。',
            match: { partner: p0.partner, account: p0.account, amount, text: p0.desc },
          });
        }
      }
    }

    // ---------- 2. 勘定科目・税区分の不一致 ----------
    {
      const keyOf = p => p.pkey ? 'P:' + p.pkey : (p.dkey.length >= 3 ? 'D:' + p.dkey : null);
      const accStat = new Map(), taxStat = new Map();
      const inc = (map, k, v) => { if (!map.has(k)) map.set(k, new Map()); const m = map.get(k); m.set(v, (m.get(v) || 0) + 1); };
      for (const p of prior) { if (p.kind !== 'pl') continue; const k = keyOf(p); if (!k) continue; inc(accStat, p.side + '|' + k, p.account); inc(taxStat, p.side + '|' + k + '|' + p.account, M.taxBase(p.tax)); }
      const devs = new Map();
      const push = (id, d, p) => { if (!devs.has(id)) devs.set(id, Object.assign(d, { ps: [] })); devs.get(id).ps.push(p); };
      for (const p of cur) {
        if (p.kind !== 'pl') continue; const k = keyOf(p); if (!k) continue;
        const r = p.pkey ? ruleFor(p) : null;
        const ruleAccounts = r && r.account ? r.account.split(/[、,]/).map(s => s.trim()).filter(Boolean) : null;
        if (ruleAccounts) {
          if (!ruleAccounts.includes(p.account)) push('ACCOUNT|R|' + k + '|' + p.account, { type: 'ACCOUNT', basis: 'rule', expected: ruleAccounts.join('、'), actual: p.account, ruleNote: r.note }, p);
        } else {
          const st = accStat.get(p.side + '|' + k);
          if (st) { const tp = top(st); if (tp.total >= 3 && tp.share >= 0.8 && tp.key !== p.account) push('ACCOUNT|T|' + k + '|' + p.account, { type: 'ACCOUNT', basis: 'trend', expected: tp.key, actual: p.account, stat: st, tp }, p); }
        }
        if (r && r.tax && (!ruleAccounts || ruleAccounts.includes(p.account))) {
          if (M.taxBase(r.tax) !== M.taxBase(p.tax)) push('TAX|R|' + k + '|' + p.account + '|' + p.tax, { type: 'TAX', basis: 'rule', expected: r.tax, actual: p.tax, ruleNote: r.note }, p);
        } else {
          const st = taxStat.get(p.side + '|' + k + '|' + p.account);
          if (st) { const tp = top(st); if (tp.total >= 3 && tp.share >= 0.8 && tp.key !== M.taxBase(p.tax)) push('TAX|T|' + k + '|' + p.account + '|' + p.tax, { type: 'TAX', basis: 'trend', expected: tp.key, actual: p.tax, stat: st, tp }, p); }
        }
      }
      for (const [id, d] of devs) {
        const p0 = d.ps[0], amount = d.ps.reduce((s, p) => s + Math.abs(p.amount), 0), isTax = d.type === 'TAX';
        const what = isTax ? '税区分' : '勘定科目', exp = d.expected || '（空欄）', act = d.actual || '（空欄）';
        const k = keyOf(p0), sideKey = p0.side + '|' + k;
        const refs = prior.filter(p => p.kind === 'pl' && p.side === p0.side && keyOf(p) === k && (!isTax || p.account === p0.account)).slice(-5);
        const inference = [];
        const sameDesc = d.ps.length >= 3 && new Set(d.ps.map(p => p.dkey)).size === 1;
        if (sameDesc) inference.push('同じ摘要の取引が' + d.ps.length + '件とも同じ処理になっているため、自動登録ルールの設定によって登録された可能性があります（登録経路はCSVに含まれないため未確認。freee の「自動登録ルール」で該当の条件を確認してください）。');
        if (!isTax) inference.push('過去と取引の内容が違う（別の種類の購入・サービス）ために科目が違う可能性もあります。'); else inference.push('取引の内容や請求書の記載（軽減税率・非課税・国外取引など）が過去と違う可能性もあります。');
        let s = sev(amount, t), impact = null;
        if (isTax) { impact = M.taxImpact(company, p0.side === 'C' ? 'sales' : 'purchase'); if (impact.affects === false) s = 'low'; }
        add({
          key: (isTax ? 'TAX|' : 'ACC|') + month + '|' + U.hash(id), check: d.type, basis: d.basis, severity: s,
          title: what + 'の不一致：' + who(p0) + (isTax ? '（' + p0.account + '）' : '') + ' ' + exp + ' → ' + act + (d.ps.length > 1 ? '（' + d.ps.length + '件）' : ''),
          amount, partner: p0.partner, account: p0.account, date: p0.entry.date,
          reason: d.basis === 'rule'
            ? '会社ルールでは ' + who(p0) + ' の' + what + 'は「' + exp + '」ですが、対象月は「' + act + '」で登録されています。'
            : who(p0) + ' の' + (isTax ? '「' + p0.account + '」の' : '') + what + 'は、過去 ' + d.tp.total + '件中 ' + d.tp.count + '件（' + pct(d.tp.share) + '）が「' + exp + '」ですが、対象月は「' + act + '」で登録されています。',
          entries: d.ps.map(p => view(p.entry)),
          comparison: { label: d.basis === 'rule' ? '会社ルール' + (d.ruleNote ? '（' + d.ruleNote + '）' : '') + '／過去の直近の処理' : '過去の直近の処理（最大5件）', entries: refs.map(p => view(p.entry)) },
          calc: d.basis === 'rule' ? ['会社ルール：' + who(p0) + ' → ' + what + '「' + exp + '」'] : ['過去の内訳（対象月より前、' + (p0.pkey ? '同じ取引先' : '同じ摘要') + '・' + sideName(p0.side) + (isTax ? '・同じ科目' : '') + '）：' + distText(d.stat), '判定の条件：過去3件以上、かつ最も多い' + what + 'が80%以上'].concat(isTax ? ['経過措置の控除割合（控80・控70など）の違いは、比較から除いています'] : []),
          inference, impact: impact ? impact.text : null, sources: impact ? impact.sources : [],
          documents: ['請求書・領収書（取引の内容' + (isTax ? '、税率・登録番号の記載' : '') + '）', '過去の同じ取引先の処理（総勘定元帳）'].concat(sameDesc ? ['freee の自動登録ルールの設定'] : []),
          nextAction: '証憑で取引の内容を確認し、過去と同じ内容か、今回だけ内容が違うのかを判断してください。' + (d.basis === 'trend' ? '今後この処理が正しい場合は、会社ルールに登録すると次回から指摘されません。' : ''),
          fix: { conditional: true, text: '取引の内容が過去と同じであれば、' + what + 'を「' + exp + '」に変更する' + (isTax && impact && impact.affects === false ? '（納付税額への影響はない見込み）' : '') + '。内容が違う場合は修正不要です。' },
          question: (p0.partner || '摘要「' + p0.desc + '」') + ' の ' + d.ps.map(p => p.entry.date + ' ' + U.yen(Math.abs(p.amount))).join('、') + ' について、取引の内容を教えてください（これまでは「' + exp + '」として処理しており、今回は内容が異なるかを確認したいためです）。',
          match: { partner: p0.partner, account: p0.account, amount, text: p0.desc },
        });
      }
    }

    // ---------- 3. 定期取引の計上漏れ・金額（会社ルール） ----------
    for (const r of recurRules) {
      if (!r.account) continue;
      const hits = cur.filter(p => recurMatch(r, p));
      const name = r.name || (r.account + (r.partner ? ' ' + r.partner : ''));
      const refs = prior.filter(p => recurMatch(r, p)).slice(-3);
      if (!hits.length) {
        add({
          key: 'RECR|' + month + '|' + r.id, check: 'RECUR', basis: 'rule', severity: sev(r.amount || t.mid, t),
          title: '定期取引の計上漏れ候補：' + name + (r.amount ? ' ' + U.yen(r.amount) : ''), amount: r.amount || 0, partner: r.partner || '', account: r.account, date: mEnd,
          reason: '会社ルールに登録された定期取引「' + name + '」に当たる仕訳が、対象月（' + month + '）にありません。',
          comparison: { label: '過去の計上（最大3件）', entries: refs.map(p => view(p.entry)) },
          calc: ['条件：科目「' + r.account + '」' + (r.partner ? '・取引先「' + r.partner + '」' : '') + (r.keyword ? '・摘要に「' + r.keyword + '」を含む' : ''), '対象月の該当件数：0件'],
          inference: ['支払日・計上日が翌月にずれている、対象月のデータが月末まで取り込まれていない、取引そのものが終了した、のいずれかの可能性があります。'],
          documents: ['通帳・カード明細（対象月の支払の有無）', '契約書・請求書'], nextAction: '対象月の支払・請求の有無を確認し、未計上なら登録、終了・変更なら会社ルールを更新してください。',
          fixNote: '計上が必要かどうかは資料の確認後に判断するため、修正案は示していません。',
          question: '毎月の「' + name + '」について、' + month.replace('-', '年') + '月分のお支払い（ご請求）は発生していますでしょうか。発生している場合は、日付と金額が分かる資料をご共有ください。',
          match: { partner: r.partner || '', account: r.account, amount: r.amount || 0, text: name },
        });
      } else if (r.amount) {
        const tol = Math.abs(r.amount) * (Number(r.tolerancePct) || 0) / 100;
        for (const p of hits) {
          const diff = Math.abs(p.amount) - r.amount;
          if (Math.abs(diff) <= tol) continue;
          add({
            key: 'AMTR|' + r.id + '|' + p.entry.date + '|' + p.amount, check: 'AMOUNT', basis: 'rule', severity: sev(Math.max(Math.abs(diff), t.mid), t),
            title: '金額が会社ルールの範囲外：' + name + ' ' + U.yen(Math.abs(p.amount)) + '（通常 ' + U.yen(r.amount) + '）', amount: Math.abs(p.amount), partner: p.partner, account: p.account, date: p.entry.date,
            reason: '定期取引「' + name + '」の金額が、会社ルールの許容範囲（' + U.yen(r.amount) + ' ± ' + (Number(r.tolerancePct) || 0) + '%）を外れています。',
            entries: [view(p.entry)], comparison: { label: '過去の計上（最大3件）', entries: refs.map(q => view(q.entry)) },
            calc: [U.yen(Math.abs(p.amount)) + ' − ' + U.yen(r.amount) + ' ＝ ' + (diff > 0 ? '+' : '') + U.yen(diff), '許容範囲：' + U.yen(r.amount - tol) + ' 〜 ' + U.yen(r.amount + tol)],
            inference: /役員報酬|役員給与/.test(r.account) ? ['役員報酬の改定であれば、改定の時期と決議（議事録）の確認が必要になる場合があります。金額の入力誤りの可能性もあります。'] : ['契約の改定、複数月分のまとめ払い、入力誤りのいずれかの可能性があります。'],
            documents: /役員報酬|役員給与|給料|給与/.test(r.account) ? ['給与台帳・賃金台帳', '株主総会・取締役会の議事録（改定の場合）'] : ['請求書・契約書'],
            nextAction: '金額が変わった理由を確認してください。改定の場合は会社ルールの金額を更新します。',
            fixNote: '正しい金額はデータだけでは判断できないため、修正案は示していません。',
            question: '「' + name + '」の ' + p.entry.date + ' の金額が ' + U.yen(Math.abs(p.amount)) + '（これまでは ' + U.yen(r.amount) + '）となっています。変更の理由（改定・まとめ払い等）を教えてください。',
            match: { partner: p.partner, account: p.account, amount: Math.abs(p.amount), text: p.desc },
          });
        }
      }
    }

    // ---------- 4. 定期取引の計上漏れ（過去3か月から自動検出） ----------
    if (hasPrev3) {
      const rk = p => p.side + '|' + p.account + '|' + (p.pkey ? 'P:' + p.pkey : 'D:' + p.dkey);
      const usable = p => (p.kind === 'pl' || (p.kind === 'bs' && p.pkey)) && !p.entry.isTransfer;
      const byKey = U.groupBy(all.filter(p => usable(p) && (p.entry.month === month || prev3.includes(p.entry.month))), rk);
      const missing = [];
      for (const [k, ps] of byKey) {
        if (ps.some(p => p.entry.month === month)) continue;
        const perMonth = prev3.map(m => ps.filter(p => p.entry.month === m));
        if (perMonth.some(x => !x.length)) continue;
        const p0 = perMonth[0][0];
        if (recurRules.some(r => recurMatch(r, p0))) continue;
        const sums = perMonth.map(x => x.reduce((s, p) => s + Math.abs(p.amount), 0)), med = U.median(sums);
        const stable = Math.max(...sums) <= Math.min(...sums) * 1.2;
        if (med < t.min || (!stable && med < t.mid) || (!p0.pkey && !stable)) continue;
        missing.push({ k, ps, p0, sums, med, stable, last: perMonth[0] });
      }
      const plEntryIds = new Set(missing.filter(x => x.p0.kind === 'pl').flatMap(x => x.last.map(p => p.entry.id)));
      for (const x of missing) {
        const p0 = x.p0;
        // 同じ仕訳の相手側（未払金など）で二重に出さない
        if (p0.kind === 'bs' && x.last.every(p => plEntryIds.has(p.entry.id))) continue;
        // 同じ取引先（摘要）が対象月は別の科目で計上されているなら、漏れではなく「勘定科目の不一致」の側で扱う
        const moved = cur.filter(p => p.kind === 'pl' && p.side === p0.side && p.account !== p0.account && (p0.pkey ? p.pkey === p0.pkey : (!p.pkey && p.dkey === p0.dkey)));
        if (moved.length && moved.reduce((s, p) => s + Math.abs(p.amount), 0) >= x.med * 0.5) { suppressed.push({ check: 'RECUR', text: p0.account + ' ' + who(p0) + '：対象月は別の科目（' + [...new Set(moved.map(p => p.account))].join('・') + '）で計上されているため、計上漏れ候補にしていません（勘定科目の不一致を参照）' }); continue; }
        const similar = cur.filter(p => p.side === p0.side && p.account === p0.account && Math.abs(Math.abs(p.amount) - x.med) <= x.med * 0.1);
        const lastMonthCount = x.ps.filter(p => p.entry.month === prev3[0]).length, usual = x.ps.filter(p => p.entry.month === prev3[1]).length;
        const inference = ['支払日・計上日が翌月にずれている、対象月のデータが月末まで取り込まれていない、取引が終了した、のいずれかの可能性があります。'];
        if (lastMonthCount > usual) inference.push('前月（' + prev3[0] + '）は' + lastMonthCount + '件（その前の月は' + usual + '件）計上されています。対象月の分が前月に計上されている可能性があります。');
        if (similar.length) inference.push('対象月に、同じ科目で近い金額の取引があります（取引先・摘要が違うもの）。同じ取引が別の取引先名・摘要で登録された可能性があります。');
        add({
          key: 'REC|' + month + '|' + U.hash(x.k), check: 'RECUR', basis: 'trend', severity: similar.length ? 'low' : sev(x.med, t),
          title: '定期取引の計上漏れ候補：' + p0.account + ' ' + who(p0) + '（月 ' + U.yen(x.med) + ' 前後）', amount: x.med, partner: p0.partner, account: p0.account, date: mEnd,
          reason: sideName(p0.side) + '「' + p0.account + '」（' + who(p0) + '）は、前3か月（' + prev3.slice().reverse().join('・') + '）は毎月計上されていますが、対象月（' + month + '）にはありません。',
          entries: similar.map(p => view(p.entry)), entriesLabel: similar.length ? '対象月の、同じ科目で近い金額の取引（同一取引か要確認）' : null,
          comparison: { label: '前3か月の計上', entries: x.ps.filter(p => p.entry.month !== month).sort((a, b) => a.entry.date < b.entry.date ? -1 : 1).map(p => view(p.entry)) },
          calc: ['前3か月の月合計：' + prev3.slice().reverse().map((m, i) => m + ' ' + U.yen(x.sums[2 - i])).join('、') + '（中央値 ' + U.yen(x.med) + '）', '対象月の該当件数：0件（' + (p0.pkey ? '同じ取引先' : '同じ摘要') + '・同じ科目）'],
          inference, documents: ['通帳・カード明細（対象月の支払・入金の有無）', '請求書・契約書・給与資料など、この取引の元資料'],
          nextAction: '対象月に発生しているかを確認し、未計上なら登録してください。毎月発生する取引なら、会社ルールの「定期取引」に登録すると金額の範囲も確認できます。',
          fixNote: '計上が必要かどうかは資料の確認後に判断するため、修正案は示していません。',
          question: '毎月計上している「' + p0.account + '」（' + who(p0) + '、月 ' + U.yen(x.med) + ' 前後）について、' + month.replace('-', '年') + '月分は発生していますでしょうか。発生している場合は、日付と金額が分かる資料をご共有ください。',
          match: { partner: p0.partner, account: p0.account, amount: x.med, text: p0.desc },

      }
    }

    // ---------- 5. 通常と異なる金額（過去傾向） ----------
    {
      const key = p => p.side + '|' + p.account + '|' + p.pkey;
      const hist = U.groupBy(prior.filter(p => p.kind === 'pl' && p.pkey), key);
      for (const p of cur) {
        if (p.kind !== 'pl' || !p.pkey || recurRules.some(r => recurMatch(r, p))) continue;
        const h = hist.get(key(p)); if (!h || h.length < 4) continue;
        const amts = h.map(q => Math.abs(q.amount)), a = Math.abs(p.amount), med = U.median(amts), max = Math.max(...amts), min = Math.min(...amts);

        add({
          key: 'AMT|' + U.hash(key(p) + '|' + p.entry.date + '|' + p.amount), check: 'AMOUNT', basis: 'trend', severity: sev(Math.abs(a - med), t),
          title: '通常と異なる金額：' + p.account + ' ' + who(p) + ' ' + U.yen(a) + '（過去の中央値 ' + U.yen(med) + '）', amount: a, partner: p.partner, account: p.account, date: p.entry.date,
          reason: who(p) + ' の「' + p.account + '」は、過去 ' + h.length + '件が ' + (fixed ? 'すべて ' + U.yen(med) : U.yen(min) + ' 〜 ' + U.yen(max)) + ' ですが、' + p.entry.date + ' は ' + U.yen(a) + ' です。',
          entries: [view(p.entry)], comparison: { label: '過去の直近の計上（最大5件）', entries: h.slice(-5).map(q => view(q.entry)) },
          calc: ['過去 ' + h.length + '件：最小 ' + U.yen(min) + '、中央値 ' + U.yen(med) + '、最大 ' + U.yen(max), '今回 ÷ 中央値 ＝ ' + ratio.toFixed(2) + '倍', '判定の条件：' + (fixed ? '過去がすべて同額で、今回だけ違う' : '過去の最大の1.5倍を超え、かつ中央値の2倍を超える')],
          inference, documents: ['請求書・領収書（請求金額・対象期間）', '通帳・カード明細（実際の決済額）'],
          nextAction: '請求書と決済額を照合してください。まとめ払いなら、期間按分（前払費用など）が必要かも検討します。',
          fixNote: '正しい金額はデータだけでは判断できないため、修正案は示していません。',

          match: { partner: p.partner, account: p.account, amount: a, text: p.desc },

    }

    // ---------- 6. 摘要・取引先の不足 ----------
    {
      const ps = cur.filter(p => p.kind === 'pl' && !p.pkey && !U.clean(p.desc) && !U.clean(p.note) && Math.abs(p.amount) >= t.mid);
      if (ps.length) {
        const amount = ps.reduce((s, p) => s + Math.abs(p.amount), 0), mx = Math.max(...ps.map(p => Math.abs(p.amount)));
        add({
          key: 'DESC|' + month, check: 'DESC', basis: 'evidence', severity: sev(mx, t) === 'high' ? 'mid' : 'low',
          title: '摘要・取引先のない取引：' + ps.length + '件（合計 ' + U.yen(amount) + '）', amount, partner: '', account: [...new Set(ps.map(p => p.account))].join('・'), date: ps[0].entry.date,
          reason: '取引先・摘要・備考がすべて空欄の損益科目の取引が ' + ps.length + '件あります（' + U.yen(t.mid) + ' 以上）。内容を確認できないため、他のチェック（重複・科目の一貫性）の対象にもなっていません。',
          entries: ps.map(p => view(p.entry)), calc: ['条件：損益科目、取引先・摘要・備考が空欄、金額 ' + U.yen(t.mid) + ' 以上'],
          documents: ['領収書・請求書', '通帳・カード明細の摘要'], nextAction: '証憑で内容を確認し、取引先と摘要を補ってください。',

    {

        add({
          key: 'TXR|' + U.hash([p.entry.date, p.account, p.amount, p.pkey, p.tax].join('|')), check: 'TAXRULE', basis: 'rule', severity: st === 'general' ? sev(a, t) : 'low',

          inference: ['控除割合は「課税仕入れを行った日」（商品の引渡し・役務の完了の日）で決まります。仕訳の日付が支払日・請求日の場合、実際の仕入れの日が切替日より前で、この税区分が正しい可能性があります。', '自動登録ルールや前月の仕訳の複製で、以前の税区分がそのまま使われた可能性があります（登録経路は未確認）。'],
          impact: st === 'general' ? 'この会社は本則課税として登録されているため、控除できる税額が変わります。' : '会社の消費税の処理方針が未登録のため、納付税額への影響は判定していません。',
          sources: [M.SOURCES.invoiceReview, M.SOURCES.ta6498],
          documents: ['請求書・納品書（役務の提供日・納品日）', '取引先の登録番号の有無（適格請求書発行事業者公表サイト）'],
          nextAction: '請求書で「課税仕入れを行った日」を確認し、切替日（2026-10-01 など）以後であれば税区分の変更を検討してください。',
          fix: exp ? { conditional: true, text: '課税仕入れを行った日が ' + M.INVOICE_RATIO.find(r => r.pct === exp).from + ' 以後であれば、税区分を控除割合 ' + exp + '% のものに変更する。それより前の仕入れであれば修正不要です。' } : null,
          question: (p.partner || '') + ' の ' + p.entry.date + ' ' + U.yen(a) + ' について、作業の完了日（納品日）が分かる請求書・納品書をご共有ください。',
          match: { partner: p.partner, account: p.account, amount: a, text: p.desc },
        });
      }
    }

    // ---------- 8. 現金残高のマイナス ----------
    {
      const cash = all.filter(p => /^(現金|小口現金)$/.test(U.nfkc(p.account)));
      if (cash.length) {
        const op = company.cashOpening || {}, hasOpen = !!(op.date && op.amount != null && op.amount !== '');
        const firstData = entries[0].date, start = hasOpen ? op.date : firstData;
        const need = []; for (let m = start.slice(0, 7); m <= month; m = U.addMonths(m, 1)) need.push(m);
        const gaps = need.filter(m => !dataMonths.has(m));
        if (hasOpen && (gaps.length || firstData > U.monthEnd(op.date.slice(0, 7)))) notes.push('現金残高：期首残高の基準日（' + op.date + '）から対象月までの仕訳に、取り込まれていない月があります（' + (gaps.join('・') || op.date.slice(0, 7)) + '）。残高は計算できないため判定していません。');
        else {

            add({
              key: 'CASH|' + month, check: 'CASH', basis: hasOpen ? 'data' : 'evidence', severity: hasOpen ? bump(sev(w, t)) : sev(w, t),
              title: hasOpen ? '現金残高がマイナス：' + worst.date + ' に ' + U.yen(worst.balance) + '（' + neg.length + '日）' : '現金残高の確認：期首残高が ' + U.yen(w) + ' 以上ないとマイナスになります', amount: w, partner: '', account: '現金', date: worst.date,
              reason: hasOpen ? '会社ルールの期首残高（' + op.date + ' 時点 ' + U.yen(Number(op.amount)) + '）から日ごとに計算すると、対象月の ' + neg.length + '日で現金残高がマイナスになります。' : '現金の期首残高が登録されていないため残高は確定できませんが、取込済みの期間（' + firstData + ' 以降）の増減だけで、対象月に最大 ' + U.yen(w) + ' のマイナスになります。',
              entries: worst.ps.map(p => view(p.entry)), entriesLabel: '最もマイナスが大きい日（' + worst.date + '）の現金の取引',
              calc: [(hasOpen ? '期首残高 ' + U.yen(Number(op.amount)) + '（' + op.date + '）' : '期首残高 0円と仮定（未登録）') + ' ＋ ' + start + ' 以降の日ごとの増減'].concat(neg.slice(0, 10).map(n => n.date + '：当日の増減 ' + U.yen(n.net) + ' → 残高 ' + U.yen(n.balance))).concat(neg.length > 10 ? ['（ほか ' + (neg.length - 10) + '日）'] : []),
              inference: ['現金での支払として登録した取引が、実際は個人の立替・カード・口座振替だった、預金からの引出しや売上の入金が未計上、日付の前後、のいずれかの可能性があります。'],
              documents: ['現金出納帳・レジの記録', '通帳（現金の引出し）', '領収書（支払方法）'], nextAction: hasOpen ? 'マイナスになる日の前後の取引について、支払方法と日付を確認してください。' : '現金の期首残高（基準日と金額）を会社ルールに登録すると、残高を確定して判定できます。あわせて、マイナスになる日の前後の取引を確認してください。',
              fixNote: 'どの取引に原因があるかはデータだけでは判断できないため、修正案は示していません。',
              question: worst.date + ' 前後の現金でのお支払いについて、実際の支払方法（現金・個人の立替・カード等）を教えてください。現金出納帳があればあわせてご共有ください。',
              match: { partner: '', account: '現金', amount: w, text: '' },

    const order = { high: 0, mid: 1, low: 2 };
    findings.sort((a, b) => order[a.severity] - order[b.severity] || b.amount - a.amount || (a.key < b.key ? -1 : 1));
    return { month, findings, suppressed, notes, stats: { entries: entries.filter(e => e.month === month).length, lines: lines.filter(l => l.date.slice(0, 7) === month).length, priorMonths: [...dataMonths].filter(m => m < month).sort() } };
  }

  KR.checks = { runReview };
  if (typeof module !== 'undefined' && module.exports) module.exports = KR;

<script>
// 記帳レビュー：明細（銀行・カード・現金出納帳）と帳簿の照合
// 結果は「一致」「差額あり」「片側のみ」「同一取引か要確認」の4つ。組合せの探索も含めすべて決まった手順で行う
(function (root) {
  'use strict';
  const KR = root.KR = root.KR || {};
  const U = KR.util, M = KR.model;
  const CATEGORY = { match: '一致', diff: '差額あり', single: '片側のみ', unsure: '同一取引か要確認' };

  // 帳簿側：指定した口座科目の記入を、明細と同じ向き（口座が増える＝＋）にそろえる
  // kind: 'asset'（預金・現金。借方が＋） | 'card'（カード等の負債。明細の「利用」＝貸方を − とする）
  function bookLines(company, lines, account, from, to, files) {
    const out = [];
    for (const e of M.buildEntries(company, lines)) {
      if (e.date < from || e.date > to) continue;
      for (const p of e.postings) {
        if (p.account !== account) continue;
        out.push({ date: e.date, amount: p.side === 'D' ? p.amount : -p.amount, desc: p.desc, partner: p.partner, counter: p.route, entry: M.entryView(e, files) });
      }
    }
    return out;
  }

  // 合計が target になる組（2〜4件）をすべて探す。候補は最大12件まで
  function subsets(items, target, maxSize) {
    const res = [], n = Math.min(items.length, 12);
    (function rec(start, left, pick) {
      if (pick.length >= 2 && left === 0) { res.push(pick.slice()); return; }
      if (pick.length >= maxSize || res.length > 5) return;
      for (let i = start; i < n; i++) {
        const a = Math.abs(items[i].amount);
        if (a > left) continue;
        pick.push(items[i]); rec(i + 1, left - a, pick); pick.pop();
      }
    })(0, Math.abs(target), []);
    return res;
  }

  function reconcile(statement, book, opts) {
    const o = Object.assign({ window: 3, comboWindow: 5, feeMax: 1000, truth: 'statement' }, opts);
    const S = statement.map((l, i) => Object.assign({ i, used: false }, l)), B = book.map((l, i) => Object.assign({ i, used: false }, l));
    const results = [];
    const near = (a, b, w) => Math.abs(U.dayDiff(a.date, b.date)) <= w;
    const take = (cat, ss, bs, note, extra) => { ss.forEach(x => x.used = true); bs.forEach(x => x.used = true); results.push(Object.assign({ category: cat, statement: ss, book: bs, note, sTotal: ss.reduce((t, x) => t + x.amount, 0), bTotal: bs.reduce((t, x) => t + x.amount, 0) }, extra)); };
    const free = list => list.filter(x => !x.used);

    // 1. 日付・金額とも同じ（同じ日に同額が複数あっても、件数が合う分は順に対応させる）
    for (const s of S) { const b = B.find(x => !x.used && x.date === s.date && x.amount === s.amount); if (b) take('match', [s], [b], '日付・金額が一致'); }
    // 2. 金額が同じで日付が近い。相手が1つに決まるときだけ一致にする
    const pend = new Map();
    for (const s of free(S)) {
      const cs = free(B).filter(b => b.amount === s.amount && near(s, b, o.window));
      if (!cs.length) continue;
      const rivals = free(S).filter(x => x !== s && x.amount === s.amount && cs.some(b => near(x, b, o.window)));
      if (cs.length === 1 && !rivals.length) take('match', [s], [cs[0]], '金額が一致、日付が ' + Math.abs(U.dayDiff(s.date, cs[0].date)) + '日ずれ', { dateShift: U.dayDiff(cs[0].date, s.date) });
      else pend.set(s, cs);
    }
    // 相手が1つに決まらないもの：まとめて「要確認」
    for (const s of free(S)) {
      if (!pend.has(s)) continue;
      const ss = free(S).filter(x => x.amount === s.amount && free(B).some(b => b.amount === x.amount && near(x, b, o.window)));
      const bs = free(B).filter(b => b.amount === s.amount && ss.some(x => near(x, b, o.window)));
      if (ss.length && bs.length) take('unsure', ss, bs, '同じ金額で日付の近い取引が、明細 ' + ss.length + '件・帳簿 ' + bs.length + '件あり、対応を1つに決められません');
    }
    // 3. 合算・分割：明細1件 ＝ 帳簿の複数件、または 帳簿1件 ＝ 明細の複数件
    const combo = (ones, manys, oneIsStatement) => {
      for (const one of free(ones)) {

<script>
// 記帳レビュー：確認事項の状態（対応状況・メモ・履歴）、確認済みルールの適用、翌月への引継ぎ、上席への引継ぎ出力
(function (root) {

  const emptyReview = () => ({ states: {}, runs: {}, recon: {} });

  // レビューの実行結果を保存データに反映する。対応状況・メモ・履歴は key が同じなら引き継ぐ

  function applyRun(review, month, findings, inScope, now) {

    for (const f of findings) {
      seen.add(f.key);

  // 確認済みルール：会社・チェックの種類・期間・条件を限定したものだけを受け付ける
  function validateException(ex) {

    if (!/^\d{4}-\d{2}$/.test(ex.from || '') || !/^\d{4}-\d{2}$/.test(ex.to || '')) errs.push('適用する期間（開始月・終了月）を指定してください');
    else if (ex.from > ex.to) errs.push('終了月は開始月以後にしてください');
    if (!U.clean(ex.partner) && !U.clean(ex.account) && !U.clean(ex.keyword)) errs.push('取引先・勘定科目・摘要の語句のうち、少なくとも1つを条件にしてください（条件のない一括除外はできません）');

  }

    return (company.exceptions || []).find(ex => {
      if (ex.check !== f.check || f.month < ex.from || f.month > ex.to) return false;
      if (U.clean(ex.partner) && U.normPartner(ex.partner) !== U.normPartner(m.partner || '')) return false;
      if (U.clean(ex.account) && U.clean(ex.account) !== U.clean(m.account || '')) return false;
      if (U.clean(ex.keyword) && !U.nfkc((m.text || '') + ' ' + (f.title || '')).includes(U.nfkc(ex.keyword))) return false;

      if (st.month === month) current.push(item);

  }

    const hs = handoffItems(items), L = [];

    L.push('');
    L.push('- 作成：' + (meta.by || '（担当者名 未入力）') + '　' + meta.at.slice(0, 16).replace('T', ' '));

    if (meta.notes && meta.notes.length) { L.push(''); L.push('## 判定していない項目'); meta.notes.forEach(n => L.push('- ' + n)); }

    hs.forEach((it, i) => {
      const f = it.f;

      L.push('- 指摘理由（データから確認できる事実）：' + f.reason);
      (f.entries || []).forEach(e => e.rows.forEach(r => L.push('  - ' + e.date + (e.slip ? ' 伝票' + e.slip : '') + ' ' + rowText(r) + (r.partner ? ' ' + r.partner : '') + (r.desc ? ' 「' + r.desc + '」' : '') + (r.file ? '（' + r.file + ' ' + r.row + '行目）' : ''))));
      (f.statementRows || []).forEach(s => L.push('  - 明細 ' + s.date + ' ' + (s.amount > 0 ? '入金 ' : '出金 ') + U.yen(Math.abs(s.amount)) + ' ' + (s.desc || '') + '（' + (f.statementFile || '') + ' ' + s.row + '行目）'));
      if (f.calc && f.calc.length) L.push('- 計算・比較：' + f.calc.join(' ／ '));
      if (f.inference && f.inference.length) L.push('- 推測（未確定）：' + f.inference.join(' '));
      if (f.impact) L.push('- 消費税への影響：' + f.impact);
      L.push('- 確認する資料：' + (f.documents || []).join('、'));
      L.push('- 次の対応：' + f.nextAction);
      L.push('- 修正案：' + (f.fix ? f.fix.text : (f.fixNote || 'なし')));
      if (it.memo) L.push('- 担当者メモ：' + it.memo.replace(/\n/g, ' '));
      if (it.history.length) L.push('- 履歴：' + it.history.map(h => h.at.slice(0, 10) + ' ' + (h.by || '') + ' ' + M.STATUS[h.from] + '→' + M.STATUS[h.to]).join('、'));

    });

  }

    const rows = [['重要度', '状況', '対象月', 'チェック', '根拠の種類', '件名', '日付', '金額', '取引先', '勘定科目', '指摘理由', '推測（未確定）', '確認する資料', '次の対応', '修正案', '担当者メモ', '確認者', '最終更新']];

  }

// 2026-05〜2026-09 は正常な取引だけ。2026-10 に、問題候補と「指摘してはいけない正常な取引」を混ぜてある

// 記帳レビュー：保存（このブラウザの IndexedDB のみ）。会社ごとに別のレコードに分け、必ず会社IDを指定して読み書きする
(function (root) {
  'use strict';
  const KR = root.KR = root.KR || {};
  const DB_NAME = 'kicho-review', STORES = ['companies', 'data', 'reviews', 'settings'];
  let db = null;
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s); };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  }
  const tx = (store, mode) => db.transaction(store, mode || 'readonly').objectStore(store);
  const get = (store, key) => req(tx(store).get(key));
  const put = (store, key, val) => req(tx(store, 'readwrite').put(val, key));
  const del = (store, key) => req(tx(store, 'readwrite').delete(key));
  const emptyData = () => ({ imports: [], lines: [], seq: 0, statements: {}, runs: {}, changedAt: '' });

  const api = {
    open,
    listCompanies: () => req(tx('companies').getAll()).then(l => l.sort((a, b) => a.name.localeCompare(b.name, 'ja'))),
    getCompany: id => get('companies', id),
    saveCompany: c => put('companies', c.id, c),
    getData: id => get('data', id).then(d => d || emptyData()),
    saveData: (id, d) => put('data', id, d),
    getReview: id => get('reviews', id).then(r => r || KR.review.emptyReview()),
    saveReview: (id, r) => put('reviews', id, r),
    getSetting: k => get('settings', k),
    setSetting: (k, v) => put('settings', k, v),
    // 会社の削除：設定・取込データ・確認結果をまとめて消す
    deleteCompany: id => Promise.all([del('companies', id), del('data', id), del('reviews', id)]),
    deleteAll: () => { if (db) db.close(); db = null; return req(indexedDB.deleteDatabase(DB_NAME)).then(open); },
    exportCompany: async id => ({ format: 'kicho-review-backup', version: 1, exportedAt: new Date().toISOString(), company: await api.getCompany(id), data: await api.getData(id), review: await api.getReview(id) }),
    importBackup: async b => {
      if (!b || b.format !== 'kicho-review-backup' || !b.company || !b.company.id) throw new Error('記帳レビューのバックアップファイルではありません');
      await api.saveCompany(b.company); await api.saveData(b.company.id, b.data || emptyData()); await api.saveReview(b.company.id, b.review || KR.review.emptyReview());
      return b.company.id;
    },
    emptyData,
  };
  KR.store = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  // ---------- 画面：レビュー一覧 ----------

  function filtered(items) {
    const f = st.filter, q = U.nfkc(f.q).toLowerCase();
    const out = items.filter(it => (f.status === 'all' || (f.status === 'unresolved' ? M.UNRESOLVED.includes(it.status) : f.status === 'resolved' ? !M.UNRESOLVED.includes(it.status) : it.status === f.status))
      && (!f.severity || it.f.severity === f.severity) && (!f.basis || it.f.basis === f.basis) && (!f.check || it.f.check === f.check)
      && (!q || U.nfkc([it.f.title, it.f.partner, it.f.account, it.memo, it.f.reason].join(' ')).toLowerCase().includes(q)));
    const so = { high: 0, mid: 1, low: 2 }, sto = { open: 0, working: 1, waiting: 2, fixed: 3, ok: 4 };
    const cmp = { severity: (a, b) => so[a.f.severity] - so[b.f.severity] || b.f.amount - a.f.amount, amount: (a, b) => b.f.amount - a.f.amount, date: (a, b) => (a.f.date < b.f.date ? -1 : a.f.date > b.f.date ? 1 : 0), status: (a, b) => sto[a.status] - sto[b.status] || so[a.f.severity] - so[b.f.severity] }[f.sort];
    return out.sort(cmp);
  }
  function stale() {

  function viewReview() {

      + '<div class="runbox"><button class="primary" data-act="run">レビューを実行</button><div class="muted">' + (run ? '前回：' + esc(run.at.slice(0, 16).replace('T', ' ')) + '　対象月の仕訳 ' + run.stats.entries + '件　比較に使った過去の月：' + (run.stats.priorMonths.length ? esc(run.stats.priorMonths[0] + '〜' + run.stats.priorMonths[run.stats.priorMonths.length - 1]) : 'なし') : '未実行') + '</div></div></div>';

    commitImport: async () => { const p = st.pending; commitJournal(p); st.pending = null; st.month = p.stats.months[p.stats.months.length - 1]; await S.setSetting('month:' + st.company.id, st.month); await saveData(); toast(p.lines.length + '行を取り込みました。対象月を ' + st.month + ' にしました。「レビュー一覧」で実行してください'); },
    cancelImport: () => { st.pending = null; },
    showRejected: el => { st.shown = el.dataset.id; },
    delImport: async el => { const i = st.data.imports.find(x => x.id === el.dataset.id); if (!i || !confirm('「' + i.name + '」から取り込んだ仕訳を削除しますか？（確認結果の記録は残ります）')) return; st.data.lines = st.data.lines.filter(l => l.src !== i.id); st.data.imports = st.data.imports.filter(x => x !== i); st.data.changedAt = now(); await saveData(); },
    status: async el => { const s = R.setState(st.review, st.sel, { status: el.dataset.status, memo: $('#memo').value }, st.user, now()); if (s) { await saveReview(); st.keepDetail = true; toast('「' + M.STATUS[el.dataset.status] + '」で保存しました' + (st.user ? '' : '（担当者名が未入力です）')); } },
    memo: async () => { R.setState(st.review, st.sel, { memo: $('#memo').value }, st.user, now()); await saveReview(); st.keepDetail = true; toast('メモを保存しました'); },
    addException: async () => {
      const f = st.review.states[st.sel].finding, ex = { id: rid(), check: f.check, partner: val('exPartner'), account: val('exAccount'), keyword: val('exKeyword'), amountMin: val('exMin'), amountMax: val('exMax'), from: val('exFrom'), to: val('exTo'), reason: val('exReason'), by: st.user, at: now() };
      const errs = R.validateException(ex); if (errs.length) return toast(errs[0], true);
      st.company.exceptions.push(ex); await saveCompany();
      // 登録のきっかけになった指摘は、利用者が自分で「問題なし」にした記録を残す
      R.setState(st.review, st.sel, { status: 'ok', memo: $('#memo').value }, st.user, now()); await saveReview(); toast('確認済みルールを登録しました（' + ex.from + '〜' + ex.to + '）');
    },
    copy: el => copyText($('#' + el.dataset.from).textContent),
    addPartnerRule: async () => { if (!val('prPartner') || (!val('prAccount') && !val('prTax'))) return toast('取引先と、勘定科目または税区分を入力してください', true); st.company.partnerRules.push({ id: rid(), partner: val('prPartner'), account: val('prAccount'), tax: val('prTax'), note: val('prNote') }); await saveCompany(); },
    addRecurring: async () => { if (!val('rcAccount')) return toast('勘定科目を入力してください', true); st.company.recurring.push({ id: rid(), name: val('rcName') || val('rcAccount'), account: val('rcAccount'), partner: val('rcPartner'), keyword: val('rcKeyword'), amount: Number(val('rcAmount')) || 0, tolerancePct: Number(val('rcTol')) || 0, note: val('rcNote') }); await saveCompany(); },
    delRule: async el => { const l = el.dataset.list; st.company[l] = st.company[l].filter(r => r.id !== el.dataset.id); await saveCompany(); },
    sampleStatement: () => { const s = KR.sample.build().statement; st.recon.account = s.account; const res = KR.csv.readStatement(s.text, s.name); res.encoding = 'UTF-8'; st.reconPending = res; },
    commitStatement: () => commitStatement(st.reconPending),
    cancelStatement: () => { st.reconPending = null; },
    rerunRecon: async () => { const s = st.data.statements[reconKey()]; s.truth = st.recon.truth; s.window = st.recon.window; s.at = now(); await applyRecon(s); },
    delRecon: async () => { const s = st.data.statements[reconKey()]; if (!confirm('この照合を削除しますか？（対応を記録した確認事項は「検出されず」として残ります）')) return; delete st.data.statements[reconKey()]; R.applyRun(st.review, st.month, [], f => f.check === 'RECON' && f.account === s.account, now()); await saveData(); await saveReview(); },
    copyHandoff: () => copyText(handoffText()),
    dlHandoffMd: () => download('記帳レビュー引継ぎ_' + st.company.name + '_' + st.month + '.md', handoffText()),
    dlHandoffCsv: () => download('記帳レビュー引継ぎ_' + st.company.name + '_' + st.month + '.csv', KR.csv.toCSV(R.handoffRows(reviewItems().all)), 'text/csv;charset=utf-8'),
    print: () => window.print(),
    backup: async () => download('記帳レビュー_バックアップ_' + st.company.name + '_' + now().slice(0, 10) + '.json', JSON.stringify(await S.exportCompany(st.company.id)), 'application/json'),
    delCompany: async () => { if (!confirm('「' + st.company.name + '」の会社ルール・取込データ・確認結果をすべて削除します。元に戻せません。よろしいですか？')) return; await S.deleteCompany(st.company.id); await reloadCompanies(); await selectCompany(st.companies[0] && st.companies[0].id); toast('削除しました'); },
    delAll: async () => { if (!confirm('すべての会社のデータを削除します。元に戻せません。よろしいですか？')) return; await S.deleteAll(); await reloadCompanies(); await selectCompany(null); toast('すべて削除しました'); },
  };

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    try { await actions[el.dataset.act](el); } catch (err) { console.error(err); toast('エラー：' + err.message, true); }
    render();
  });
  document.addEventListener('change', async e => {
    const el = e.target;
    try {
      if (el.id === 'company') { await selectCompany(el.value); }
      else if (el.id === 'month') { st.month = el.value; st.sel = null; st.reconPending = null; await S.setSetting('month:' + st.company.id, st.month); }
      else if (el.id === 'user') { st.user = el.value.trim(); await S.setSetting('user', st.user); return; }
      else if (el.id === 'jfile') { if (el.files[0]) await previewJournal(el.files[0]); return; }
      else if (el.id === 'sfile') { if (el.files[0]) { const d = await readFile(el.files[0]); const res = KR.csv.readStatement(d.text, el.files[0].name); res.encoding = d.encoding; st.reconPending = res; } }
      else if (el.id === 'restore') { if (el.files[0]) { const id = await S.importBackup(JSON.parse(await el.files[0].text())); await reloadCompanies(); await selectCompany(id); toast('復元しました'); } }
      else if (el.dataset.f) { st.filter[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.f === 'q') { render(); const q = $('[data-f="q"]'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; } }
      else if (el.dataset.r) { st.recon[el.dataset.r] = el.dataset.r === 'window' ? Number(el.value) : el.value; if (el.dataset.r === 'account') st.reconPending = null; }
      else if (el.dataset.c) { setPath(st.company, el.dataset.c, el.dataset.num ? (el.value === '' ? null : Number(el.value)) : el.value); await saveCompany(); if (el.dataset.c === 'name') await reloadCompanies(); if (el.tagName !== 'SELECT') { toast('保存しました'); return; } }
      else if (el.dataset.kind != null) { if (el.value) st.company.accountKinds[el.dataset.kind] = el.value; else delete st.company.accountKinds[el.dataset.kind]; await saveCompany(); }
      else return;
    } catch (err) { console.error(err); toast('エラー：' + err.message, true); }
    render();
  });
  document.addEventListener('dragover', e => { if (e.target.closest('.drop')) e.preventDefault(); });
  document.addEventListener('drop', async e => { const z = e.target.closest('#drop'); if (!z) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) await previewJournal(f); });

  (async function init() {
    try {
      await S.open(); await reloadCompanies();
      st.user = (await S.getSetting('user')) || '';
      const last = await S.getSetting('lastCompany');
      await selectCompany(st.companies.find(c => c.id === last) ? last : (st.companies[0] && st.companies[0].id));
    } catch (err) { $('#app').innerHTML = '<p class="warnbox">保存領域（IndexedDB）を開けませんでした：' + esc(err.message) + '。プライベートブラウズでは保存できないことがあります。</p>'; return; }
    render();
    window.KRApp = { state: st, render };
  })();
})();
</script>
</body>
</html>
