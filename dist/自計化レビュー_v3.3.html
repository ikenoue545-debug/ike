.monthly-panel {margin-top:22px;overflow:hidden}

/* Ashita office edition — presentation only. Existing actions and themes stay intact. */
:root[data-theme] {
  color-scheme: light;
  --font: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --navy: #242522;
  --navy2: #3a3a34;
  --ink: #252623;
  --muted: #686b65;
  --line: #e5e6e0;
  --paper: #f7f8f5;
  --white: #fff;
  --gold: #a54c00;
  --green: #23745a;
  --red: #b13950;
  --amber: #8e5600;
  --firm-orange: #ff9900;
  --firm-orange-hover: #f5a526;
  --firm-soft: #fff5e6;
  --surface-hover: #fff7eb;
  --surface-glow: #ff990016;
  --focus-ring: #ad5700;
  --shadow-float: 0 12px 32px #3128140d;
}
html[data-theme] { scroll-padding-top: 78px; }
html[data-theme] body {
  background: #fff;
  color: var(--ink);
  background-attachment: initial;
  font-size: 15px;
}
html[data-theme] .shell { display: block; min-height: 100vh; }
html[data-theme] .sidebar {
  position: static;
  inset: auto;
  width: 100%;
  height: auto;
  display: block;
  padding: 0;
  overflow: visible;
  color: var(--ink);
  background: #fff;
  border: 0;
  border-top: 3px solid #292b26;
}
.firmintro {
  max-width: 1368px;
  margin: auto;
  padding: 10px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .06em;
}
html[data-theme] .version { color: #71746c; font-size: 9px; letter-spacing: .09em; }
.firmmasthead {
  max-width: 1368px;
  min-height: 106px;
  padding: 18px 24px 22px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
}
html[data-theme] .brand { padding: 0; gap: 14px; color: var(--ink); flex-shrink: 0; }
html[data-theme] .brand strong {
  font-family: var(--font);
  font-size: 26px;
  font-weight: 800;
  line-height: 1.55;
  letter-spacing: .015em;
}
html[data-theme] .brand span {
  display: block;
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--muted);
  margin-top: 3px;
}
.firmmark { display: block; width: 66px; height: 66px; flex-shrink: 0; overflow: visible; }
.firmmark .mark-outline { fill: none; stroke: var(--firm-orange); stroke-width: 2.2; stroke-linejoin: round; }
.firmmark .mark-inner { fill: none; stroke: #e8c22e; stroke-width: 1.5; stroke-linejoin: round; }
.firmmark text { fill: #735525; font-family: Georgia, serif; font-size: 7px; text-anchor: middle; }
html[data-theme] .sidebarcompany {
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  padding: 2px 0 2px 25px;
  margin: 0 auto 0 5px;
  flex: 1;
  min-width: 0;
  max-width: 380px;
  border-radius: 0;
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 4px 14px;
  align-items: center;
}
html[data-theme] .sidebarcompany .small { font-size: 10px; letter-spacing: .08em; grid-column: 1; }
html[data-theme] .sidebarcompany strong {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.7;
  margin: 0;
  grid-column: 1;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

/* Review reasons — presentation for ReviewInsight (explanations only) */
.ftag{font-size:11px;line-height:1.6;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--white)}
.whytags{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.whytag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--firm-soft,#fff5e6);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent)}
.reasonflow{list-style:none;margin:0;padding:0;counter-reset:flow}
.reasonflow>li{position:relative;padding:0 0 12px 30px;counter-increment:flow}
.reasonflow>li:before{content:counter(flow);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
html[data-theme=future] .reasonflow>li:before{background:var(--firm-orange,#ff9900);color:#241a0c}
.reasonflow>li:after{content:'';position:absolute;left:9.5px;top:24px;bottom:2px;width:1px;background:var(--line)}
.reasonflow>li:last-child{padding-bottom:0}.reasonflow>li:last-child:after{display:none}
.flowlabel{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
.flowbody{font-size:13.5px;line-height:1.75;color:var(--ink)}
.flowbody ul{margin:2px 0 0;padding-left:17px}.flowbody li{margin:1px 0}
.impacts{list-style:none;padding:0!important;margin:2px 0 0!important}
.impacts li{display:flex;gap:7px;align-items:flex-start;margin:4px 0!important}
.impact{flex-shrink:0;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:#edf1f6;color:#4f6886;margin-top:2px}
.impact.profit{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.impact.tax{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.impact.vat{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.impact.balance{background:color-mix(in srgb,#466389 14%,transparent);color:#466389}
html[data-theme=future] .impact.balance{color:#afc9ee}
.comparecard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper)}
.comparecard h3{margin-bottom:10px}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);gap:6px;align-items:stretch}
.cmpcol{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-width:0}
.cmpcol.now{border-color:color-mix(in srgb,var(--firm-orange,#ff9900) 60%,var(--line));box-shadow:inset 0 3px 0 var(--firm-orange,#ff9900)}
.cmpcol.usual{box-shadow:inset 0 3px 0 var(--muted)}
.cmplabel{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px}
.cmplabel span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.cmpacct{font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;line-height:1.4;margin-top:4px}
.cmpnote{font-size:11.5px;color:var(--muted);line-height:1.55;margin:2px 0 6px}
.cmptax{font-size:12px;color:var(--ink);line-height:1.5;border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;overflow-wrap:anywhere}
.cmptax span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cmpmeta{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.cmparrow{display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--firm-orange,#ff9900)}
.cmpdiff,.cmpmean{font-size:13.5px!important;line-height:1.75!important;margin-top:10px}
.cmpdiff strong,.cmpmean strong{display:block;font-size:12px;color:var(--muted);margin-bottom:1px}
.cmpdiff{background:var(--firm-soft,#fff5e6);border-radius:7px;padding:8px 10px;color:var(--ink)}
.cmpexamples{margin:10px 0 6px}.cmpexamples summary{font-size:13px}
.cmptable{font-size:12px;margin-top:8px}.cmptable th,.cmptable td{padding:7px 8px!important}
.glossary{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.glossary summary{font-size:13px}
.glossary dl{margin:8px 0 0;font-size:12.5px;line-height:1.7}
.glossary dt{font-weight:700;color:var(--ink);margin-top:7px}
.glossary dd{margin:0;color:var(--muted)}
@media(max-width:420px){.cmpgrid{grid-template-columns:1fr}.cmparrow{transform:rotate(90deg);height:18px}}
.cmpacct.changed{display:inline;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--firm-orange,#ff9900) 38%,transparent) 58%);padding:0 2px}
.cmpcol.now .cmpacct.changed+.cmpnote{margin-top:6px}
.cmptax b{font-weight:700}
.cmptax.changed b{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--firm-orange,#ff9900) 38%,transparent) 55%);padding:0 2px}

/* 月次推移（帳票形式） — presentation only */
.stmt-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stmt-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stmt-toggle .btn{border:0;border-radius:0;margin:0}
.stmt-toggle .btn[aria-pressed=true]{background:var(--navy);color:#fff}
html[data-theme=future] .stmt-toggle .btn[aria-pressed=true]{background:var(--firm-orange,#ff9900);color:#241a0c}
.stmt{padding:20px 22px 8px;--stmt-rule:color-mix(in srgb,var(--ink) 55%,transparent);--stmt-grid:color-mix(in srgb,var(--ink) 16%,transparent);--stmt-sub:color-mix(in srgb,var(--ink) 7%,var(--white));--stmt-major:color-mix(in srgb,var(--ink) 15%,var(--white))}
.stmt-head{text-align:center;margin-bottom:10px;color:var(--ink)}
.stmt-title{display:inline-block;font-size:20px;font-weight:600;letter-spacing:.9em;text-indent:.9em;padding:0 6px 3px;border-bottom:3px double var(--stmt-rule)}
.stmt-subtitle{font-size:13px;letter-spacing:.6em;text-indent:.6em;margin-top:9px;color:var(--ink)}
.stmt-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;text-align:left;font-size:13px;margin-top:6px;flex-wrap:wrap}
.stmt-meta div{display:flex;flex-direction:column;gap:2px}
.stmt-meta strong{font-size:14px;font-weight:600}
.stmt-wrap{border:1px solid var(--stmt-rule)}
.stmt-table{border-collapse:collapse;width:100%;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:max-content}
.stmt-table th,.stmt-table td{border:1px solid var(--stmt-grid);padding:0;height:27px;white-space:nowrap}
.stmt-table thead th{font-weight:500;font-size:11.5px;text-align:center;padding:4px 10px;background:var(--white);border-bottom:1px solid var(--stmt-rule);min-width:92px;line-height:1.3}
.stmt-table thead th span{font-size:10.5px;color:var(--muted)}
.stmt-table thead th.stmt-acct{letter-spacing:.2em}
.stmt-table th.stmt-acct{position:sticky;left:0;z-index:1;background:var(--white);text-align:left;min-width:168px;max-width:200px;border-right:1px solid var(--stmt-rule)}
.stmt-table tbody th.stmt-acct{font-weight:400;padding:0;border-left:0;border-right:0;box-shadow:inset -1px 0 var(--stmt-rule),inset 12px 0 var(--white),inset 13px 0 var(--stmt-grid)}
.stmt-acctin{display:flex;align-items:center;gap:5px;padding:0 10px 0 22px;min-height:26px}
.stmt-label{flex:1;display:block;text-align:justify;text-align-last:justify;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.stmt-flag{font-size:10px;line-height:1.5;padding:0 5px;border-radius:3px;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber);flex-shrink:0}
.stmt-table td{text-align:right}
.stmt-num{display:block;width:100%;padding:0 9px;text-align:right;font:inherit;color:inherit;line-height:27px}
.stmt-table .monthly-value.stmt-num{background:transparent;border:0;cursor:pointer;border-radius:0}
.stmt-table .monthly-value.stmt-num:hover,.stmt-table .monthly-value.stmt-num:focus-visible{background:color-mix(in srgb,var(--firm-orange,#ff9900) 14%,transparent);outline:none;text-decoration:underline}
.stmt-table td.stmt-open{padding:0 9px}
.stmt-table td.stmt-total{font-weight:600;background:color-mix(in srgb,var(--ink) 3%,var(--white))}
.stmt-table tbody tr:hover td,.stmt-table tbody tr:hover th.stmt-acct{background-color:color-mix(in srgb,var(--firm-orange,#ff9900) 6%,var(--white))}
.stmt-table tr.stmt-sub td,.stmt-table tr.stmt-sub th.stmt-acct{background:var(--stmt-sub)}
.stmt-table tr.stmt-sub th.stmt-acct{box-shadow:inset -1px 0 var(--stmt-rule),inset 12px 0 var(--white),inset 13px 0 var(--stmt-grid)}
.stmt-table tr.stmt-major td,.stmt-table tr.stmt-major th.stmt-acct{background:var(--stmt-major);font-weight:600}
.stmt-table tr.stmt-major th.stmt-acct{box-shadow:inset -1px 0 var(--stmt-rule)}
.stmt-table tr.stmt-major .stmt-acctin{padding-left:10px}
.stmt-table tr.stmt-major td,.stmt-table tr.stmt-major th{border-top:1px solid var(--stmt-rule);border-bottom:1px solid var(--stmt-rule)}
.stmt-table td.monthly-negative{color:var(--red)}
.stmt-table tr.stmt-unknown th.stmt-acct .stmt-label{color:var(--amber)}
.stmt-roles{margin:8px 22px 16px;border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:var(--paper)}
.stmt-roles summary{font-size:13px;display:flex;align-items:center;gap:8px}
.stmt-rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px;margin-top:10px}
.stmt-rolegrid label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;min-width:0}
.stmt-rolegrid label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stmt-rolegrid .monthly-role{margin:0;width:118px;flex-shrink:0}
@media(max-width:720px){.stmt-acctin{padding-right:6px}.stmt{padding:14px 12px 6px}.stmt-roles{margin:8px 12px 14px}.stmt-title{font-size:17px}.stmt-table th.stmt-acct{min-width:132px;max-width:150px}.stmt-actions{justify-content:flex-start}}
#stmtPrint{display:none}
@media print{
 @page{size:A4 landscape;margin:9mm}
 html.printing-stmt body>*:not(#stmtPrint){display:none!important}
 html.printing-stmt,html.printing-stmt body{background:#fff!important;color-scheme:light!important;padding:0!important;margin:0!important}
 html.printing-stmt #stmtPrint tr.stmt-item td,html.printing-stmt #stmtPrint tr.stmt-item th.stmt-acct{background:#fff!important}
 html.printing-stmt #stmtPrint{display:block}
 html.printing-stmt #stmtPrint .stmt{padding:0;background:#fff!important;color:#000!important;--ink:#000;--white:#fff;--muted:#333;--red:#000;--stmt-rule:#000;--stmt-grid:#777;--stmt-sub:#e6e6e6;--stmt-major:#c9c9c9}
 html.printing-stmt #stmtPrint .stmt-wrap{overflow:visible!important;border-color:#000}
 html.printing-stmt #stmtPrint .stmt-table{min-width:0;width:100%;font-size:8pt;line-height:1.25}
 html.printing-stmt #stmtPrint .stmt-table *{line-height:1.25}
 html.printing-stmt #stmtPrint .stmt-table th,html.printing-stmt #stmtPrint .stmt-table td{height:auto;color:#000!important}
 html.printing-stmt #stmtPrint tbody th.stmt-acct{height:auto}
 html.printing-stmt #stmtPrint .stmt-acctin{min-height:0}
 html.printing-stmt #stmtPrint .stmt-num{line-height:1.3;padding:0 4px}
 html.printing-stmt #stmtPrint .stmt-label,html.printing-stmt #stmtPrint .stmt-table td{color:#000!important;background-image:none}
 html.printing-stmt #stmtPrint td.monthly-negative{background:transparent!important}
 html.printing-stmt #stmtPrint tr.stmt-sub td,html.printing-stmt #stmtPrint tr.stmt-sub th.stmt-acct{background:#e6e6e6!important}
 html.printing-stmt #stmtPrint tr.stmt-major td,html.printing-stmt #stmtPrint tr.stmt-major th.stmt-acct{background:#c9c9c9!important}
 html.printing-stmt #stmtPrint .stmt-head{margin-bottom:5px}
 html.printing-stmt #stmtPrint .stmt-title{font-size:15pt}
 html.printing-stmt #stmtPrint .stmt-subtitle{margin-top:4px;font-size:10pt}
 html.printing-stmt #stmtPrint .stmt-meta{font-size:9pt;margin-top:2px}
 html.printing-stmt #stmtPrint .stmt-table thead th{min-width:0;padding:2px 4px}
 html.printing-stmt #stmtPrint .stmt-table th.stmt-acct{position:static;min-width:0}
 html.printing-stmt #stmtPrint .stmt-flag{display:none}
 html.printing-stmt #stmtPrint tr{break-inside:avoid}
 html.printing-stmt #stmtPrint *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.stmt-label.plain{text-align:left;text-align-last:left}
.stmt-label.long{font-size:11.5px;letter-spacing:0}
.stmt-table th.stmt-acct{max-width:220px}

/* 消費税区分（統合）と確認キューの取引日 — presentation only */
.finddates{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.finddates .icon{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.findmain{margin-left:10px;color:var(--muted)}
.toprows{font-size:12.5px}.toprows td:first-child{white-space:nowrap}.toprows td,.toprows th{padding:7px 9px!important}
.kubunbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
.kbcell{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kbcell strong{font-size:13.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.kbcell .btn{align-self:flex-start;margin-top:5px}
.kubunslot{position:relative;min-height:520px;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.kubunloading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:14px}
.kubunhost{position:absolute;z-index:4;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.kubunhost[hidden]{display:none!important}
.kubunhost iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
.kubuncheck{margin-top:10px;padding:9px 11px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;gap:4px}
.kubuncheck strong{font-size:13px;font-weight:600}

 if(f==='revenue'&&t==='revenue'){out.short=`収益の中で、科目が『${A}』→『${B}』に変わっています。`;out.text='利益の合計は同じですが、本業の売上か、それ以外の収入かで、決算書の見え方や消費税の扱い（課税売上かどうか）が変わります。';push('消費税','課税売上の集計が変わることがある');return out;}
 if(f==='expense'&&(t==='temp'||t==='assetbs'||t==='deferred')){out.short='費用だった取引が、今回は費用になっていません。';out.text=`過去は『${A}』として費用にしていましたが、今回は『${B}』（${acctPlain(B)}）に入っています。あとで精算・振替する予定なら問題ありませんが、そのまま残ると費用の計上漏れです。`;push('利益','振替を忘れると、利益が大きく見える');push('残高',`『${B}』に説明できない残高が残る`);return out;}
 if((f==='temp'||f==='assetbs'||f==='deferred')&&t==='expense'){out.short='過去は費用にしていなかった取引を、今回は費用にしています。';out.text=`過去は『${A}』に入れてあとで精算していましたが、今回は直接『${B}』にしています。立替・前払の精算方法が変わったか、二重に費用にしていないかを確認します。`;push('利益','二重計上なら利益が小さくなる');return out;}
 if(t==='equity'||f==='equity'){out.short=`科目が『${A}』→『${B}』に変わっています（事業と個人・会社と役員の区分）。`;out.text=t==='equity'?`今回は『${B}』として、事業（会社）の取引から外しています。私的な支出・役員個人の取引なら正しい処理ですが、事業の経費なら経費の計上漏れです。`:`過去は『${A}』として事業（会社）の取引から外していましたが、今回は『${B}』として事業の取引にしています。私的な支出が経費に入っていないか確認します。`;push('利益',t==='equity'?'事業の費用なら利益が大きく見える':'私的支出なら利益が小さく見える');push('税金','所得税・法人税の計算が変わる');return out;}
 out.short=`科目が『${A}』→『${B}』に変わっています。`;out.text=`『${A}』は${KIND_WORD[f]}、『${B}』は${KIND_WORD[t]}です。科目が変わると、決算書のどこに載るか、利益や残高がどう変わるかが変わります。取引の中身から、どちらがふさわしいかを確認します。`;push(['revenue','expense'].includes(f)||['revenue','expense'].includes(t)?'利益':'残高','科目の種類が変わると、利益または残高が変わる');return out;

function field(r,re){const x=(r?.sourceFields||[]).find(x=>re.test(x.header));return x?clean(x.value):'';}
function regInfo(r){return field(r,/^登録した方法$/)+' '+field(r,/^発行元$/);}
function hasReg(r){return (r?.sourceFields||[]).some(x=>/^(登録した方法|発行元)$/.test(x.header));}
function isManual(r){return /振替伝票|手動|手入力|直接入力/.test(regInfo(r));}
function isTaxExcluded(r){return /税抜/.test(field(r,/消費税経理処理方法/));}
function taxAmount(r,side){const n=Number(field(r,new RegExp('^'+(side==='credit'?'貸方':'借方')+'税金額$')).replace(/[,円]/g,''));return Number.isFinite(n)?n:0;}
function baseAmount(r,side){const a=Number(r[side+'Amount']||r.amount||0);if(isTaxExcluded(r)){const t=taxAmount(r,side);if(t>0&&t<a)return {base:a-t,label:'税抜'};}return {base:a,label:isTaxExcluded(r)?'税抜（税額不明のため総額）':'税込'};}
function text(r,side){return clean(D?D.contextText(r,side):[r.description,r.party,r[side+'Party']].join(' '));}
function partyOf(r,side){return clean((side&&r[side+'Party'])||r.party||r.debitParty||r.creditParty||'');}
function lastDay(ym){const d=new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5),0));return ym+'-'+String(d.getUTCDate()).padStart(2,'0');}
function addDays(d,n){const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function days(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);}
const corpMark=/株式会社|有限会社|合同会社|合資会社|合名会社|\(株\)|\(有\)|\(同\)|㈱|㈲|法人|組合|協会|機構|財団|社団|学校|病院|\bInc\b|\bLLC\b|Co\.|Ltd|Corporation|銀行|信用金庫|公庫|市役所|区役所|税務署|年金事務所/i;

 return {reason:`${e.account} ${yen(gross)}。同じ仕訳に差し引かれた税金（源泉所得税）の記録がありません。入金額だけを利息にしていないか、支払通知と照合します。`,lesson:'法人の預金利息からは15.315%の源泉所得税が差し引かれています。手取り額だけを受取利息にすると、法人税から差し引ける（戻ってくる）税金を記録し忘れることになります。少額の利息で税金が0円の場合もあるので、支払通知（利息計算書）の税額で確認します。配当は上場株式15.315%、非上場20.42%が原則です。'};

function addFindings(session,current,history,add,findings){
 const cfg=session.project,large=cfg.large||100000,corp=cfg.type==='corp',indiv=cfg.type==='individual',endDate=lastDay(cfg.end);
 const groups=E.journalGroups(current),months=E.monthRange(cfg.start,cfg.end);
 const entries=[];for(const r of current)for(const side of ['debit','credit']){const a=r[side],amt=r[side+'Amount'];if(!a||!amt)continue;entries.push({...r,side,account:a,amount:amt,party:partyOf(r,side),sharedParty:r.party});}
 const debitExp=entries.filter(e=>e.side==='debit'&&kind(e.account)==='expense'&&e.amount>0);
 const rowKey=r=>(r.id||'')+'|'+r.line+'|'+r.date,personalRows=new Set(findings.filter(f=>f.check==='personal').flatMap(f=>f.rows.map(rowKey)));

 // 1. インボイス経過措置の割合と取引日
 const rateFor=d=>d<LAW.inv80?null:d<LAW.inv70?80:d<LAW.inv50?70:d<LAW.inv30?50:d<LAW.invEnd?30:0;
 const inv=new Map();for(const e of entries){const m=clean(e[e.side+'Tax']).match(/控\s*(80|70|50|30)/);if(!m)continue;const exp=rateFor(e.date);if(exp===null||+m[1]===exp)continue;const k=m[1]+'>'+exp;if(!inv.has(k))inv.set(k,[]);inv.get(k).push(e);}
 for(const [k,rows] of inv){const [used,exp]=k.split('>').map(Number),span=exp===70?'2026年10月1日〜2028年9月30日':exp===80?'2023年10月1日〜2026年9月30日':exp===50?'2028年10月1日〜2030年9月30日':exp===30?'2030年10月1日〜2031年9月30日':'2031年10月1日以後';
  add('vat','インボイス経過措置の控除割合が取引日と合っていない',`${rows.length}行の税区分が『控${used}（${used/10}割控除）』ですが、取引日（${rows[0].date}${rows.length>1?'ほか':''}）の割合は${exp?`『控${exp}（${exp/10}割控除）』`:'0（経過措置なし）'}です。${span}の仕入は${exp?exp/10+'割':'控除なし'}になります。`,rows.reduce((n,r)=>n+r.amount,0),rows,{
   lesson:'インボイス（登録番号のある請求書）がない相手（免税事業者など）からの仕入は、仕入れた日によって消費税を差し引ける割合が決まっています。2023年10月〜2026年9月は8割、令和8年度改正により2026年10月〜2028年9月は7割、2028年10月〜2030年9月は5割、2030年10月〜2031年9月は3割、その後は0です。自動登録ルールで税区分を「控80」に固定していると、10月以降もそのまま登録されてしまいます。',
   steps:['対象行の取引日が、実際に仕入れた日（請求書・レシートの日付）と合っているか確認する。','freeeの自動登録ルールに「控80」などを固定した設定がないか確認する。','相手が登録事業者になっていないか（国税庁インボイス公表サイト）も確認し、結果をメモする。'],
   basis:'税区分名の控除割合（控80・控70・控50・控30）と取引日の適用期間を照合。令和8年度改正後の期間（2026/10/1〜2028/9/30は70%）を使用。',sources:['invoice','invoicesite'],tags:['改正日またぎ'],
   why:{usual:`取引日に応じた割合：${span}は${exp?exp/10+'割':'控除なし'}`,diff:`使われている割合 ${used/10}割 → 本来 ${exp?exp/10+'割':'0'}`,impact:[{area:'消費税',text:used>exp?'差し引く消費税が多すぎ、納める消費税が少なくなる（追加の納税のおそれ）':'差し引ける消費税が少なすぎ、納めすぎになる'}],causes:['自動登録ルールの税区分が古いまま','取引日を支払日・精算日で登録していて、実際の仕入日とずれている','freeeの税区分の選び間違い'],docs:['対象取引の請求書・レシート（日付と登録番号の有無）','freeeの自動登録ルールの設定画面']}});
 }

 // 2. まとめて買った消耗品（1組判定）
 const cons=debitExp.filter(e=>/消耗品|事務用品|備品/.test(e.account)&&e.amount<100000&&e.party).sort((a,b)=>a.party.localeCompare(b.party)||a.date.localeCompare(b.date));
 for(let i=0;i<cons.length;){let j=i+1;while(j<cons.length&&cons[j].party===cons[i].party&&days(cons[i].date,cons[j].date)<=3)j++;const g=cons.slice(i,j),sum=g.reduce((n,e)=>n+e.amount,0);

  i=j;}

 // 3. 資産になり得る物品が別の費用科目に
 const device=/パソコン|ノートPC|\bPC\b|MacBook|Mac|iPad|タブレット|モニター|ディスプレイ|プリンター|プリンタ|複合機|カメラ|レンズ|エアコン|冷蔵庫|洗濯機|机|デスク|椅子|チェア|キャビネット|棚|ソファ|サーバー|NAS|ルーター|スマートフォン|スマホ|iPhone|内装|工事|看板/i;

 // 4. 会議費の飲食（法人・1人1万円）
 const food=/飲食|食事|ランチ|ディナー|弁当|居酒屋|寿司|鮨|焼肉|焼鳥|酒|バー|BAR|ダイニング|レストラン|カフェ|珈琲|コーヒー|ビストロ|料理|食堂|そば|うどん|ラーメン|中華|割烹|和食|会食|懇親|ホテル/i;
 if(corp)for(const e of debitExp){if(!/会議費/.test(e.account)||e.date<LAW.entertain)continue;const {base,label}=baseAmount(e,'debit'),t=text(e,'debit');if(!(base>=10000&&(food.test(t)||base>=30000)))continue;const people=Math.ceil(base/10000);
  add('context','会議費の飲食は1人あたり1万円以下か確認',`会議費に${yen(e.amount)}（${label}）。1人あたり1万円以下になるのは参加者${people}人以上のときです。参加人数と相手を確認します。`,e.amount,[e],{lesson:'法人の飲食代は、1人あたり1万円以下（2024年4月1日以後の支出。税込経理なら税込、税抜経理なら税抜で判定）で、日付・参加者の氏名と関係・人数・金額・店名を記録しておけば、交際費から外せます。1人1万円を超える接待や、社内の人だけの飲み会は交際費です。交際費は、法人税の計算で経費にできる額に上限があります（中小法人は年800万円までなど）。会議中のお茶や弁当など簡単な飲食は、金額にかかわらず会議費でかまいません。',steps:['領収書で日付・店名・金額を確認する。','参加者（社外の相手と社内の人）と人数の記録を確認する。','1人あたりの金額を計算し、会議費・交際費のどちらかと根拠をメモする。'],basis:'法人・会議費・2024年4月1日以後。判定額1万円以上で飲食の記載があるもの、または3万円以上。',sources:['entertain'],why:{usual:'1人あたり1万円以下なら、記録を残すことで交際費から外せる',diff:`${yen(base)}÷1万円＝${people}人以上いれば基準内`,impact:[{area:'税金',text:'交際費になると、経費にできる上限の計算に入る'}],causes:['参加者が多く、1人あたりは1万円以下','会議中の簡単な飲食','実際は接待で、交際費にするべき'],docs:['領収書','参加者の氏名・会社名・人数のメモ']}});}

 // 5. 報酬の源泉徴収
 const shigyo=/税理士|弁護士|司法書士|社会保険労務士|社労士|行政書士|弁理士|公認会計士|土地家屋調査士|会計事務所|法律事務所|特許事務所|講演|講師|原稿|執筆|デザイン|イラスト|撮影料|翻訳|通訳/;
 for(const g of groups){
  const pays=g.filter(r=>/支払報酬|報酬|外注費|顧問料|講師料|原稿料|デザイン料/.test(r.debit||'')&&r.debitAmount>0);if(!pays.length||g.some(r=>/給料|給与|賃金|役員報酬|賞与/.test(r.debit||'')))continue;
  const wh=g.filter(r=>/預り金|源泉/.test(r.credit||'')).reduce((n,r)=>n+(r.creditAmount||0),0),gross=pays.reduce((n,r)=>n+r.debitAmount,0);
  const t=uniq(pays.flatMap(r=>[partyOf(r,'debit'),text(r,'debit')])).join(' '),party=partyOf(pays[0],'debit');
  const shiho=/司法書士|土地家屋調査士/.test(t);
  if(!wh){if(!shigyo.test(t)||corpMark.test(party+' '+t.replace(/法律事務所|会計事務所|特許事務所/g,'')))continue;
   const g1=gross/0.8979,g2=gross/0.9979,net=[g1,g2].some(x=>x>=10000&&Math.abs(x-Math.round(x/1000)*1000)<2);
   add('outsourcetax','士業・個人への報酬で源泉徴収の記録がない',`${party||'取引先なし'}：${pays[0].debit} ${yen(gross)}。士業・デザイン等の報酬を示す記載があり、同じ仕訳に預り金（源泉所得税）の行がありません。${net?'金額が「報酬額から源泉税を引いた額」の形に見えます。':''}`,gross,g,{lesson:'個人に支払う士業（税理士・弁護士・司法書士など）の報酬や、原稿料・講演料・デザイン料などは、支払う側が所得税を差し引いて（源泉徴収）納める義務があります。税率は100万円以下の部分が10.21%、100万円を超える部分が20.42%、司法書士は（支払額−1万円）×10.21%です。相手が法人なら原則として不要です。取引先名だけでは個人か法人か分からないため、請求書で確認します。',steps:['請求書で、相手が個人か法人か、源泉徴収税額の記載があるかを確認する。','源泉徴収したのに預り金を記録していないのか、そもそも差し引いていないのかを確認する。','差し引いた場合は納付（翌月10日、納期の特例なら7月10日・1月20日）の記録も確認し、メモする。'],basis:'報酬・外注費の仕訳で、取引先・摘要に士業・対象業務の語があり、法人を示す語がなく、同じ仕訳に預り金・源泉の貸方がないもの。',sources:['withhold','withholdTax'],why:{usual:'個人への士業報酬・原稿料等は、支払時に10.21%を差し引くのが原則',diff:'同じ仕訳に源泉所得税（預り金）の行がない',impact:[{area:'税金',text:'源泉徴収漏れは支払う側の納付義務（不納付加算税・延滞税のおそれ）'}],causes:['相手が法人（税理士法人・弁護士法人など）で、源泉徴収が不要','源泉徴収はしたが、別の仕訳で預り金を記録している','相手が源泉徴収の対象外の業務'],docs:['請求書（相手の名称・源泉税額の記載）','源泉所得税の納付書']}});
   continue;}
  const formula=x=>x<=1000000?Math.floor(x*0.1021):Math.floor((x-1000000)*0.2042)+102100;
  const cands=[gross,Math.round(gross/1.1)].flatMap(x=>shiho?[Math.floor(Math.max(0,x-10000)*0.1021),formula(x)]:[formula(x)]);
  if(cands.some(c=>Math.abs(c-wh)<=1))continue;
  add('outsourcetax','源泉徴収税額が報酬額の10.21%と合わない',`${party||'取引先なし'}：報酬 ${yen(gross)}、預り金 ${yen(wh)}。報酬額（税込・税抜どちらでも）から計算した源泉税額（${uniq(cands.map(yen)).join('・')}）と一致しません。`,gross,g,{lesson:'報酬の源泉所得税は、100万円以下の部分が10.21%、100万円を超える部分が20.42%です。請求書で消費税が区分されていれば税抜の報酬額に掛けてもかまいません。司法書士・土地家屋調査士は（支払額−1万円）×10.21%です。住民税や別の支払の預りが同じ仕訳に混ざっている場合もあります。',steps:['請求書の報酬額・消費税・源泉税額を確認する。','預り金の行に別の預り（住民税・社会保険料など）が混ざっていないか確認する。','差額がある場合は理由をメモし、上司に確認する。'],basis:'同じ仕訳の報酬（借方）と預り金・源泉（貸方）を照合。10.21%／20.42%、司法書士の1万円控除、税込・税抜の両方を試算。',sources:['withhold']});
 }

 // 6. 預り金の納付
 const crWh=entries.filter(e=>e.side==='credit'&&/預り金/.test(e.account)),drWh=entries.filter(e=>e.side==='debit'&&/預り金/.test(e.account));
 if(crWh.length&&months.length>=7){const last=drWh.map(e=>e.date).sort().at(-1)||'',after=crWh.filter(e=>!last||e.date>last).sort((a,b)=>a.date.localeCompare(b.date));
  if(after.length&&days(after[0].date,endDate)>=210){const cr=crWh.reduce((n,e)=>n+e.amount,0),dr=drWh.reduce((n,e)=>n+e.amount,0);
   add('paytax','預り金を預かったまま納付の記録がない',`預り金：期間中に預かった額 ${yen(cr)}／減らした（納めた）額 ${yen(dr)}。最後の納付の記録 ${last||'なし'}、その後 ${after[0].date} から7か月以上、預り金を減らす記録がありません。`,after.reduce((n,e)=>n+e.amount,0),after,{lesson:'給与や報酬から差し引いた源泉所得税は、原則として支払った月の翌月10日までに納めます。納期の特例（給与の支給人員が常時10人未満で届出をした場合）なら、1〜6月分を7月10日、7〜12月分を翌年1月20日にまとめて納めます。7か月以上納付の記録がないときは、納付漏れか、納付を別の科目（租税公課など）で記帳している可能性があります。住民税や社会保険料の預りが同じ科目に入っている場合は、内訳（品目・取引先）を分けて確認します。',steps:['預り金を税目（源泉所得税・住民税・社会保険料）ごとに分けて確認する。','納付書・口座の引落で、実際に納めた日と金額を確認する。','納付を租税公課などで記帳していないか確認し、結果をメモする。'],basis:'7か月以上の期間で、最後の預り金の減少（納付）の後に、210日以上前から預り金の増加が続くもの。期首残高は読み込んだ仕訳からは分かりません。',sources:['paydue'],why:{usual:'源泉所得税は翌月10日（特例なら7月10日・1月20日）に納める',diff:`${after[0].date}以後、7か月以上納付の記録なし`,impact:[{area:'残高',text:'預り金の残高が積み上がる'},{area:'税金',text:'納付漏れなら不納付加算税・延滞税のおそれ'}],causes:['納付を租税公課や事業主貸など別の科目で記帳している','納付の仕訳が未登録','対象期間の外で納付している'],docs:['源泉所得税の納付書・領収証書','預り金の元帳']}});}}

 // 7. 役員報酬の定期同額
 if(corp){const by=new Map();for(const e of entries){if(!/役員報酬/.test(e.account))continue;const p=e.party||'（取引先なし）',m=e.date.slice(0,7);if(!by.has(p))by.set(p,{rows:[],v:{}});const x=by.get(p);x.rows.push(e);x.v[m]=(x.v[m]||0)+(e.side==='debit'?e.amount:-e.amount);}
  for(const [p,x] of by){const ms=Object.keys(x.v).sort().filter(m=>x.v[m]>0);const vals=uniq(ms.map(m=>String(x.v[m])));if(ms.length<2||vals.length<2)continue;
   const seq=[];for(const m of ms){const last=seq.at(-1);if(last&&last.v===x.v[m])last.to=m;else seq.push({from:m,to:m,v:x.v[m]});}
   const desc=seq.map(s=>`${s.from===s.to?s.from:s.from+'〜'+s.to.slice(5)} ${yen(s.v)}`).join(' → ');
   add('salary','役員報酬の月額が期中で変わっている',`${p}：${desc}。役員報酬は毎月同じ額（定期同額）でないと、増えた分などが経費にならないことがあります。`,x.rows.reduce((n,e)=>n+(e.side==='debit'?e.amount:0),0),x.rows,{lesson:'法人の役員報酬は、毎月同じ額で支給する「定期同額給与」なら経費（損金）になります。額を変えられるのは原則として事業年度の開始から3か月以内（通常の改定）か、役職の変更・業績の著しい悪化などの特別な事情があるときです。それ以外の時期の増額分や、ある月だけ多い分（賞与のような支給）は、事前確定届出給与の届出がなければ経費になりません。月の途中入社・日割・未払計上の振替で金額が動いている場合もあります。',steps:['株主総会・取締役会の議事録で、報酬額を変えた時期と理由を確認する。','変更月が事業年度の開始から3か月以内か、特別な事情があるかを確認する。','未払計上や振替で金額が動いていないか元帳を見て、メモに残す。'],basis:'法人・役員報酬（借方−貸方）の月別合計が、取引先ごとに2種類以上の金額になっているもの。',sources:['directorpay'],why:{usual:'役員報酬は毎月同じ額（定期同額給与）',diff:desc,impact:[{area:'税金',text:'定期同額でない部分は法人税の計算で経費にならない（損金不算入）'}],causes:['事業年度開始から3か月以内の通常の改定','役職変更・業績悪化などの臨時改定','未払計上・振替・日割による見かけの変動'],docs:['株主総会・取締役会の議事録','給与台帳（役員分）']}});}}

 // 8. 経費にならない税金・罰金
 for(const e of debitExp){if(personalRows.has(rowKey(e)))continue;const t=text(e,'debit');let m=t.match(/延滞税|延滞金|加算税|加算金|過怠税|罰金|科料|過料|反則金|交通違反|駐車違反/),why='';
  if(m)why=`延滞税・加算税・罰金などは、${corp?'法人税の計算で経費（損金）になりません':'所得税の計算で必要経費になりません'}。`;
  else if(/租税公課/.test(e.account)&&(m=t.match(/源泉所得税|源泉税/)))why='給与・報酬から預かった源泉所得税を納めたのなら、預り金を減らす処理です。租税公課（費用）にすると、給与・報酬と二重に費用になります。法人が利息などから差し引かれた源泉所得税なら「法人税等」で、法人税から控除できる税金です。';
  else if(corp&&/租税公課/.test(e.account)&&(m=t.match(/法人税|地方法人税|法人住民税|都民税|道府県民税|市町村民税|県民税|市民税|均等割/)))why='法人税・地方法人税・法人住民税は、法人税の計算で経費（損金）になりません。決算書では「法人税、住民税及び事業税」に表示し、別表で調整します（法人事業税は申告した年度の経費になります）。';
  if(!m)continue;
  add('taxes','損金にならない税金・罰金が経費科目に入っている可能性',`${e.account}に${yen(e.amount)}。内容に「${m[0]}」とあります。${why.split('。')[0]}。`,e.amount,[e],{lesson:why+'科目が正しくても、税金の申告で調整（加算）が必要になります。',steps:['納付書・通知書で税目と本税・延滞税などの内訳を確認する。','預り金の納付なら、預り金の残高と照合する。','申告での調整が必要かどうかを上司に確認し、メモする。'],basis:'費用科目の摘要・品目・メモに延滞税・加算税・罰金等、または租税公課に源泉所得税・法人税等の語がある明細。',sources:['nondeduct'],decisionEvidence:[`内容の記載「${short(t,60)}」`],why:{impact:[{area:'税金',text:corp?'法人税の申告で加算（損金不算入）が必要':'所得税の必要経費から除く必要がある'}]}});}

 // 9. 個人事業の預金利息
 if(indiv)for(const e of entries){if(e.side!=='credit'||!/受取利息/.test(e.account))continue;
  add('personal','個人事業の預金利息が収入に計上されている',`受取利息 ${yen(e.amount)}（${e.date}）。個人の預金利息は事業の収入ではなく「利子所得」で、銀行で税金が差し引かれて課税が終わっています。`,e.amount,[e],{lesson:'個人の預金利息は、利子所得として20.315%（所得税・復興特別所得税15.315%＋住民税5%）が差し引かれ、それで課税が完了します（源泉分離課税）。事業用口座の利息でも事業所得の収入には含めず、一般的には「事業主借」で処理します。受取利息のまま事業の収入にすると、所得税を二重に計算することになります。',steps:['通帳で利息の入金か確認する（貸付金の利息など、事業の収入になるものと区別する）。','事業主借で処理する方針か確認する。','確認結果をメモに残す。'],basis:'個人事業主・受取利息の貸方。事業主借での処理は実務上の一般的な扱い。',sources:['expense'],why:{usual:'個人の預金利息は事業主借で処理するのが一般的',diff:'今回は受取利息（事業の収入）に計上',impact:[{area:'税金',text:'事業所得の収入に入ると、すでに課税済みの利息に二重に所得税がかかる計算になる'}],causes:['事業の貸付金の利息（事業の収入になる）','会計ソフトの自動登録で受取利息になった'],docs:['通帳（利息の入金と税額）']}});}

 // 10. 日付がずれた二重計上
 const dup=new Map();for(const e of debitExp){if(e.amount<1000)continue;const k=e.account+'|'+e.amount;if(!dup.has(k))dup.set(k,[]);dup.get(k).push(e);}
 const seen=new Set(),dkey=s=>clean(s).replace(/[0-9０-９\-\/\s]/g,'').slice(0,12);
 for(const list of dup.values()){if(list.length<2||list.length>12)continue;list.sort((a,b)=>a.date.localeCompare(b.date));
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j],gap=days(a.date,b.date);if(gap<1||gap>7||E.journalKey(a)===E.journalKey(b))continue;
   if(clean(a.credit)===clean(b.credit))continue;const sameParty=a.party&&a.party===b.party,sameDesc=dkey(a.description)&&dkey(a.description)===dkey(b.description);if(!sameParty&&!sameDesc)continue;
   const k=[a.id,a.line,b.id,b.line].join('|');if(seen.has(k))continue;seen.add(k);
   add('duplicate','数日ずれて同額・同じ相手の支出が2回ある',`${a.account} ${yen(a.amount)}：${a.date}（${a.credit}）と ${b.date}（${b.credit}）。${sameParty?'取引先「'+a.party+'」':'摘要'}が同じで、支払方法が違います。`,a.amount,[a,b],{lesson:'カードで払った分を、立替精算や現金でもう一度登録してしまう二重計上は、自計化でとても多い誤りです。カードの利用日と精算日・明細の反映日が違うため、日付が数日ずれます。同じ物を2回買った、人数分を別々に払った、などなら問題ありません。',steps:['2つの仕訳それぞれの領収書・カード明細を確認する。','同じ1回の支払を2つの方法で登録していないか確認する。','別の支払と確認できたら、その根拠をメモに残す。'],basis:'同じ費用科目・同じ金額（1,000円以上）で、7日以内・別の仕訳・貸方（支払方法）が異なり、取引先または摘要が一致する2件。',sources:['freee'],why:{usual:'同じ支払は1回だけ記録する',diff:`同額の支出が${gap}日違いで2回、支払方法は「${a.credit}」と「${b.credit}」`,impact:[{area:'利益',text:'二重計上なら費用が多すぎ、利益が小さくなる'},{area:'消費税',text:'課税仕入なら消費税も二重に差し引いている'}],causes:['同じ物を2回買った・人数分を別々に払った','定期的な少額の支払が偶然近い日に重なった'],docs:['両方の領収書・カード明細','立替精算の申請書']}});}}

 // 11. 期末の手入力・キリ番
 if(current.some(hasReg)){const from=addDays(endDate,-6);
  for(const g of groups){const r0=g[0];if(!g.some(isManual))continue;const endFlag=g.some(r=>field(r,/期末日取引フラグ/)==='1');if(!(endFlag||r0.date>=from&&r0.date<=endDate))continue;
   const pl=g.filter(r=>['expense','revenue'].includes(kind(r.debit))||['expense','revenue'].includes(kind(r.credit)));if(!pl.length)continue;
   const amt=Math.max(...pl.map(r=>Math.max(r.debitAmount||0,r.creditAmount||0)));if(amt<large)continue;
   if(g.some(r=>/減価償却|貸倒引当|法人税|未払消費税|仮払消費税|仮受消費税|棚卸|期首|期末商品|商品|事業主|元入金/.test((r.debit||'')+(r.credit||''))))continue;
   const round=amt%10000===0,noDesc=!g.some(r=>clean(r.description)||partyOf(r));if(!round&&!noDesc)continue;
   add('evidence','期末に手入力されたキリのいい金額の仕訳',`${r0.date}：${g.map(r=>`${r.debit||'―'}／${r.credit||'―'}`).slice(0,2).join('、')} ${yen(amt)}。期末近くに手入力され、${[round?'キリのいい金額':'',noDesc?'摘要・取引先なし':''].filter(Boolean).join('・')}です。`,amt,g,{lesson:'監査では、期末近くに手入力された、キリのいい金額・説明の少ない仕訳を優先して確かめます。売上の前倒しや費用の見積り計上など、利益を動かす処理が入りやすいからです。未払計上・見積りなど正当な理由も多いので、根拠資料（請求書・見積書・計算表）があるかを確認します。',steps:['仕訳を作った人と作った理由を確認する。','根拠資料（請求書・見積書・計算表）と金額を照合する。','翌期に取り消し（戻し）の仕訳が予定されていないか確認し、メモする。'],basis:'登録方法・発行元が振替伝票・手動等で、対象期間末日から7日以内（または期末日取引フラグ）、損益科目を含み、金額が設定額以上で、1万円単位または摘要・取引先なしの仕訳。決算整理の定型科目は除外。',sources:['jicpa240'],tags:['期末近く','手入力',round?'キリ番':'',noDesc?'摘要なし':''].filter(Boolean),why:{usual:'通常の取引は、請求書・明細から登録され、内容が摘要に残る',diff:'期末近くの手入力で、根拠が仕訳から読み取れない',impact:[{area:'利益',text:'見積りや前倒しが根拠なく入ると、今期の利益が動く'}],causes:['未払計上・前払費用の振替など、正当な決算の処理','請求書が後から届く取引の見積り計上'],docs:['根拠資料（請求書・見積書・計算表）','翌期の戻し仕訳']}});}
 }

 // 12. ほとんど使われない科目の組み合わせ
 const pairs=new Map(),pk=r=>clean(r.debit)+'⇄'+clean(r.credit),common=a=>['cash'].includes(kind(a))||/未払|買掛|売掛|未収|立替|預り金/.test(a);
 for(const r of [...(history?.rows||[]),...current])if(r.debit&&r.credit)pairs.set(pk(r),(pairs.get(pk(r))||0)+1);
 if(pairs.size>=20)for(const r of current){if(!r.debit||!r.credit||pairs.get(pk(r))!==1)continue;const amt=Math.max(r.debitAmount||0,r.creditAmount||0);if(amt<large||common(r.debit)||common(r.credit))continue;
  const kd=kind(r.debit),kc=kind(r.credit);if(!(['expense','revenue'].includes(kd)||['expense','revenue'].includes(kc)))continue;if(r.isAdjustment&&/減価償却|引当|法人税|消費税/.test(r.debit+r.credit))continue;
  add('other','ほとんど使われない科目の組み合わせ',`${r.date}：借方『${r.debit}』／貸方『${r.credit}』${yen(amt)}。読み込んだ${current.length+(history?.rows.length||0)}行の中で、この組み合わせはこの1回だけです。`,amt,[r],{lesson:`『${r.debit}』（${KIND_WORD[kd]}）と『${r.credit}』（${KIND_WORD[kc]}）を直接結ぶ仕訳はめったにありません。監査でも、普段使わない科目の組み合わせは誤りや例外的な処理が入りやすいため、優先して確認します。振替・訂正・決算の処理なら、その理由が説明できれば問題ありません。`,steps:['仕訳の作成者と理由を確認する。','根拠資料と金額を照合する。','通常の処理（請求書→未払金→支払など）と比べて、科目の選び方が妥当かメモする。'],basis:'当期と過去資料の全行で、借方科目×貸方科目の組み合わせが1回だけ、損益科目を含み、現金・預金・未払金・売掛金などの決済科目を含まない、設定額以上の行。',sources:['jicpa240'],tags:['初めての組合せ']});}
}

const IMPACT_FALLBACK={asset:[{area:'利益',text:'資産か費用かで、今年の利益と税金が変わる'}],duplicate:[{area:'利益',text:'二重計上なら費用が多すぎる'}],vat:[{area:'消費税',text:'納める消費税の額が変わる'}]};
function explain(f,ctx){
 const w={facts:f.reason,usual:'',diff:'',impact:[],causes:[],docs:[],tags:[...(f.tags||[])]};
 for(const [re,fn] of TPL)if(re.test(f.title)){Object.assign(w,Object.fromEntries(Object.entries(fn(f,ctx)).filter(([,v])=>v&&(!Array.isArray(v)||v.length))));if(f.tags)w.tags=uniq([...f.tags,...(w.tags||[])]);break;}
 if(f.why)for(const [k,v] of Object.entries(f.why))if(v&&(!Array.isArray(v)||v.length))w[k]=k==='tags'?uniq([...w.tags,...v]):v;
 if(f.check==='asset'&&!w.usual)w.usual=f.title.includes('修繕')?'20万円未満・3年以内周期の修理は修繕費。60万円未満か取得価額の10%以下なら形式基準で修繕費にできる':`1つ（1組）10万円未満は費用。10万円以上は資産・一括償却（20万円未満）・特例（${(f.rows[0]?.date||'')>=LAW.smallAsset?'40万円未満':'30万円未満'}）のどれか`;
 if(f.check==='asset'&&!w.causes.length)w.causes=f.title.includes('修繕')?['原状回復・定期的な修理','60万円未満などの形式基準を使っている']:['少額減価償却資産の特例・一括償却資産を使う方針','複数の物をまとめて請求されている（1つあたりは少額）'];
 if(f.check==='asset'&&!w.docs.length)w.docs=f.title.includes('修繕')?['見積書・請求書（工事内容）','固定資産台帳']:['請求書（品名・数量・単価）','固定資産台帳・特例の明細書'];
 if(!w.impact.length&&IMPACT_FALLBACK[f.check])w.impact=IMPACT_FALLBACK[f.check];
 if(f.compare){const c=f.compare.explain||continuity(f.compare),cur=f.compare.current;w.facts=`${f.compare.party||'取引先なし'}${f.compare.purpose?'「'+short(f.compare.purpose,30)+'」':''}の今回の仕訳（${cur.date}・${yen(cur.amount)}）：${linesText(principal(cur.lines))||'支払・入金の記録だけ（'+uniq(cur.lines.map(l=>l.account)).join('・')+'）'}${f.compare.currentCount>1?`。同じ処理が今回${f.compare.currentCount}件`:''}`;w.usual=c.usualText;w.diff=c.diffText;w.impact=c.impact;w.causes=c.causes;w.docs=c.docs;w.tags=uniq([...w.tags,'過去と相違',...(c.tags||[])]);}
 // 共通タグ（監査で優先する特徴）
 const rows=(f.rows||[]).filter(r=>r.debit!==undefined),endDate=ctx.endDate;
 if(rows.length){
   if(endDate&&rows.some(r=>r.date>=addDays(endDate,-6)&&r.date<=endDate||field(r,/期末日取引フラグ/)==='1'))w.tags.push('期末近く');
   if(rows.some(isManual))w.tags.push('手入力');
   if(rows.some(r=>r.isAdjustment))w.tags.push('決算整理');
   if(rows.some(r=>!clean(r.description)&&!partyOf(r)))w.tags.push('摘要なし');
   if(rows.length<=3&&!/中央値|前月|推移|変動|計上のない月/.test(f.title+f.reason)&&rows.some(r=>{const a=Math.max(r.debitAmount||0,r.creditAmount||0);return a>=100000&&a%100000===0;}))w.tags.push('キリ番');
 }
 if(Math.abs(f.amount)>=(ctx.large||100000)&&!f.dataReview)w.tags.push('高額');
 w.tags=uniq(w.tags);
 if(!w.docs.length)w.docs=['該当取引の請求書・領収書','freeeの取引詳細（添付ファイル・備考）'];
 return w;
}
function enrich(findings,ctx){for(const f of findings){try{f.why=explain(f,ctx);f.tags=f.why.tags;}catch(err){f.why=null;}}}

// ---------- 過去との比較（ReviewHistory から呼ぶ） ----------
const SETTLE='資金・債権債務の決済';
const brief=t=>String(t||'').replace(/。.*$/,'').replace(/（[^）]*）/g,'');
function principal(lines){return lines.filter(l=>l.principal);}
function linesText(lines){return lines.map(l=>`${l.side==='借'?'借方':'貸方'}『${l.account}』${yen(l.amount)}${l.tax?'（'+l.tax+'）':''}`).join('、');}
function accountNames(lines){const p=principal(lines);return uniq(p.map(l=>l.account));}
function continuity(cmp){
 const party=cmp.party||'取引先なし',what=cmp.purpose?`「${short(cmp.purpose,24)}」`:'',head=`${party}${what}`;
 const cur=cmp.current,usual=cmp.usual,curAcc=accountNames(cur.lines),usAcc=accountNames(usual.lines);
 const curName=curAcc.join('・')||'支払・入金の記録だけ',usName=usAcc.join('・')||'支払・入金の記録だけ';
 const count=`似た過去の仕訳${cmp.total}件中${usual.count}件`;
 let reason,ch,usualText,diffText,lessonHead;
 const ex=usual.examples[0];
 if(cmp.type==='tax'){
   const acc=cmp.taxAccount||curName;ch=taxChange(cmp.usualTax,cmp.currentTax);
   reason=`${head}：同じ『${acc}』でも、税区分がいつもは『${cmp.usualTax}』（${cmp.taxTotal}件中${cmp.taxCount}件）→ 今回は『${cmp.currentTax}』。${ch.short}`;
   usualText=`同じ取引先・似た内容で『${acc}』を使った過去${cmp.taxTotal}件のうち${cmp.taxCount}件が『${cmp.usualTax}』（${brief(taxInfo(cmp.usualTax).plain)}）`;
   diffText=`税区分が『${cmp.usualTax}』→『${cmp.currentTax}』（${brief(taxInfo(cmp.currentTax).plain)}）に変わっている`;
   lessonHead=ch.text;
 }else if(cmp.type==='mixed'){
   const list=cmp.patterns.slice(0,3).map(p=>`『${p.names.join('・')||'支払の記録だけ'}』${p.count}件`).join('・');
   ch={short:'',text:'',impact:[{area:'利益',text:'どの処理が正しいかで、費用・資産の区分や税区分が変わる'}]};
   reason=`${head}：過去は${list}と処理が分かれていて、今回は『${curName}』。過去の処理だけでは、どれが正しいか決められません。`;
   usualText=`過去の処理が分かれている：${list}（合計${cmp.total}件）`;diffText=`今回は『${curName}』で、過去の主な処理（80%以上）がない`;
   lessonHead='同じ相手でも、買った物・契約・計上の段階（請求時か支払時か）によって処理が分かれることがあります。過去の多数派を正解として扱わず、今回の取引の中身で判断します。';
 }else{
   ch=acctChange(usName==='支払・入金の記録だけ'?'':usAcc[0],curName==='支払・入金の記録だけ'?'':curAcc[0]);
   reason=`${head}：いつもは『${usName}』で記帳（${count}）→ 今回は『${curName}』。${ch.short}`;
   usualText=`同じ取引先・似た内容の過去${cmp.total}件のうち${usual.count}件が『${usName}』${usAcc[0]&&acctPlain(usAcc[0])?`（${brief(acctPlain(usAcc[0]))}）`:''}`;
   diffText=`科目が『${usName}』→『${curName}』に変わっている`;
   lessonHead=ch.text;
 }
 const causes=[],tags=[];

function looksPerson(label){
 const s=clean(label),t=s.replace(/[\s・　]/g,'');

 if(/^[ァ-ヶー]+$/.test(t))return t.length>=4&&t.length<=12;

// ---- 読込データの索引（結果オブジェクトごとに1回）
const ctxCache=new WeakMap();
function context(session,result){
 if(!session||!result?.financial||!result.financial.months?.length)return null;
 const hit=ctxCache.get(result);if(hit&&hit.session===session)return hit;
 const model=result.financial,months=model.months,groups=new Map(),byAccount=new Map(),loaded=new Set(),prior=new Map();
 const index=(rows,target,withGroups)=>{
  for(const r of rows){if(!r||typeof r.date!=='string'||r.date.length<7)continue;const jk=E.journalKey(r),month=r.date.slice(0,7);
   if(withGroups){let g=groups.get(jk);if(!g)groups.set(jk,g=[]);g.push(r);loaded.add(month);}
   for(const side of ['debit','credit']){const account=r[side],raw=r[side+'Amount'];if(!account||!Number.isFinite(raw)||raw===0)continue;let l=target.get(account);if(!l)target.set(account,l=[]);l.push({row:r,side,raw,month,account,jk,counter:null});}}
 };
 index(session.datasets?.current||[],byAccount,true);
 index(session.datasets?.prior||[],prior,false);
 // 相手科目：同じ行の反対側。空欄なら同じ仕訳（複合仕訳）の反対側の科目。
 for(const list of byAccount.values())for(const e of list){
  const other=e.side==='debit'?'credit':'debit',direct=e.row[other];
  if(direct)e.counter=[direct===e.account?'（同じ科目内の振替）':direct];
  else e.counter=[...new Set((groups.get(e.jk)||[]).map(r=>r[other]).filter(a=>a&&a!==e.account))];
 }
 const loadedList=[...loaded].sort();
 const c={session,result,model,months,inPeriod:new Set(months),loaded,loadedList,firstLoaded:loadedList[0]||'',groups,byAccount,prior,series:new Map(),tags:new Map(),memo:new Map(),ledgerBS:null,cfg:session.project||{}};
 ctxCache.set(result,c);return c;
}
function threshold(c){return Math.max(10000,Math.round((c.cfg.large||100000)*0.3));}

// 月次BSが未読込のとき：仕訳から科目ごとの「当月の増減」だけを作る（残高ではない）。
const BS_ORDER={cash:0,receivable:1,prepaid:2,asset:3,fixedAsset:4,accumulated:5,vat:6,ownerDraw:7,card:8,payable:9,taxPayable:10,withholding:11,advanceReceived:12,loan:13,ownerContribution:14,capital:15};
function ledgerBS(c){
 if(c.ledgerBS)return c.ledgerBS;const out=[];
 if(!c.model.bs.length)for(const [account,list] of c.byAccount){
  if(isPLAccount(c.model,account)||!list.some(e=>c.inPeriod.has(e.month)))continue;
  const role=roleOf(c.model,'monthlyBS',account),sign=creditNormal(role)?-1:1,values=Object.fromEntries(c.months.map(m=>[m,0]));
  for(const e of list)if(Object.hasOwn(values,e.month))values[e.month]+=sign*(e.side==='debit'?1:-1)*e.raw;
  out.push({account,role,category:'',values,rows:[],flowOnly:true,fam:family('monthlyBS',account,role)});
 }
 out.sort((a,b)=>(BS_ORDER[a.fam]??20)-(BS_ORDER[b.fam]??20)||a.account.localeCompare(b.account,'ja'));
 c.ledgerBS=out;return out;
}
function openingOf(g,months){
 const p=prevMonth(months[0]);if(Number.isFinite(g.values?.[p]))return g.values[p];
 const r=(g.rows||[]).find(r=>r.openingRaw!==undefined&&String(r.openingRaw).trim()!=='');if(!r)return null;
 const n=E.number(r.openingRaw);return Number.isFinite(n)?n*(r.unit||1):null;
}
function groupOf(c,type,account){return (type==='monthlyPL'?c.model.pl:c.model.bs).find(x=>x.account===account)||(type==='monthlyBS'?ledgerBS(c).find(x=>x.account===account):null);}
function series(c,type,account){
 const id=type+'\u0001'+account;if(c.series.has(id))return c.series.get(id);
 const g=groupOf(c,type,account),role=roleOf(c.model,type,account),sign=creditNormal(role)?-1:1;
 const entries=(c.byAccount.get(account)||[]).map(e=>({...e,amount:sign*(e.side==='debit'?1:-1)*e.raw}));
 const ledger={};for(const e of entries)ledger[e.month]=(ledger[e.month]||0)+e.amount;
 const flowOnly=type==='monthlyBS'&&(!g||!!g.flowOnly);
 const s={type,account,role,sign,g,entries,ledger,flowOnly,fam:family(type,account,role),
  opening:type==='monthlyBS'&&g&&!flowOnly?openingOf(g,c.months):null,
  reported:type==='monthlyPL'?c.model.plReference.some(x=>x.account===account):!!g&&!flowOnly};
 c.series.set(id,s);return s;
}
function ledgerAt(c,s,m){return Object.hasOwn(s.ledger,m)?s.ledger[m]:c.loaded.has(m)?0:null;}
function valueAt(c,s,m){
 if(s.type==='monthlyPL'){const v=s.g?.values?.[m];if(Number.isFinite(v))return v;if(s.reported&&c.inPeriod.has(m))return null;return ledgerAt(c,s,m);}
 if(s.flowOnly)return ledgerAt(c,s,m);
 const v=s.g?.values?.[m];if(Number.isFinite(v))return v;
 return m===prevMonth(c.months[0])&&Number.isFinite(s.opening)?s.opening:null;
}
function deltaAt(c,s,m){if(s.flowOnly)return ledgerAt(c,s,m);const a=valueAt(c,s,m),b=valueAt(c,s,prevMonth(m));return Number.isFinite(a)&&Number.isFinite(b)?a-b:null;}
function ledgerDeltaAt(c,s,m){if(s.type==='monthlyBS')return ledgerAt(c,s,m);const a=ledgerAt(c,s,m),b=ledgerAt(c,s,prevMonth(m));return Number.isFinite(a)&&Number.isFinite(b)?a-b:null;}

// ---- 内訳（取引先別・品目別・部門別・相手科目別・摘要別）：月ごとの仕訳を索引しておく
const keyFnOf=dim=>dim==='counter'?e=>(e.counter||[]).join('・'):dim==='desc'?descKey:e=>tag(e.row,e.side,dim);
const labelOf=(dim,k)=>dim==='counter'?(k||'（相手科目なし）'):dim==='desc'?(k?'「'+k+'」':'（摘要なし）'):(k||'未選択');
function indexGroups(entries,dim){
 const keyFn=keyFnOf(dim),map=new Map();
 for(const e of entries){const k=keyFn(e);let g=map.get(k);if(!g)map.set(k,g={key:k,label:labelOf(dim,k),missing:Object.hasOwn(DIMS,dim)&&!k,dim,flow:{},count:{},byMonth:new Map(),entries:[],first:e.month});
  g.entries.push(e);g.flow[e.month]=(g.flow[e.month]||0)+e.amount;g.count[e.month]=(g.count[e.month]||0)+1;let l=g.byMonth.get(e.month);if(!l)g.byMonth.set(e.month,l=[]);l.push(e);if(e.month<g.first)g.first=e.month;}
 return map;
}
function tags(c,type,account,dim){
 const id=type+'\u0001'+account+'\u0001'+dim;if(c.tags.has(id))return c.tags.get(id);
 const s=series(c,type,account),map=indexGroups(s.entries,dim);
 for(const t of map.values()){let n=0,any=false;for(const [m,l] of t.byMonth)if(c.inPeriod.has(m)){any=true;for(const e of l)n+=Math.abs(e.amount);}t.activity=any?n+1e-9:0;}
 const list=[...map.values()].filter(t=>t.activity>0).sort((a,b)=>(b.missing-a.missing)||b.activity-a.activity||a.label.localeCompare(b.label,'ja'));
 const out={list,map,named:list.some(t=>!t.missing)};c.tags.set(id,out);return out;
}

// ---- 1つの内訳（ドライバー）の当月・前月。通常月・周期などの統計は推測に使う上位の内訳だけ計算する。
function driver(c,s,m,g){
 const p=prevMonth(m),cur=g.byMonth.get(m)||[],prev=g.byMonth.get(p)||[],curV=g.flow[m]||0,prevV=g.flow[p]||0;
 let plus=0,minus=0;for(const e of cur){if(e.amount>0)plus+=e.amount;else minus-=e.amount;}
 return {dim:g.dim,key:g.key,label:g.label,missing:g.missing,cur:curV,prev:prevV,diff:s.type==='monthlyPL'?curV-prevV:curV,plus,minus,curEntries:cur,prevEntries:prev,curCount:jcount(cur),prevCount:jcount(prev),
  isNew:cur.length>0&&g.first===m&&c.firstLoaded<m,byMonth:g.flow,entries:g.entries,month:m};
}
function stats(c,d){
 if(d.statsDone)return d;const m=d.month,n=nextMonth(m),others=c.loadedList.filter(x=>x!==m),present=others.filter(x=>Math.abs(d.byMonth[x]||0)>EPS);
 return Object.assign(d,{typical:median(present.map(x=>d.byMonth[x])),presentMonths:present.length,recurring:present.length>=3&&present.length>=others.length*0.6,cycle:cycleOf([...present,...(d.curEntries.length?[m]:[])]),next:d.byMonth[n]||0,nextLoaded:c.loaded.has(n),prevLoaded:c.loaded.has(prevMonth(m)),statsDone:true});
}
function driversOf(c,s,m,groups){const p=prevMonth(m),out=[];for(const g of groups)if(g.byMonth.has(m)||g.byMonth.has(p))out.push(driver(c,s,m,g));return rank(out,s.type);}
function monthIndex(m){return (+m.slice(0,4))*12+(+m.slice(5))-1;}
// 計上のある月の間隔がすべて同じ（2〜3か月ごと）なら、その周期を返す
function cycleOf(ms){const xs=[...new Set(ms)].map(monthIndex).sort((a,b)=>a-b);if(xs.length<3)return 0;const gaps=xs.slice(1).map((x,i)=>x-xs[i]);return gaps.every(g=>g===gaps[0])&&gaps[0]>=2&&gaps[0]<=3?gaps[0]:0;}
function rank(list,type){return list.filter(d=>d.curCount||(type==='monthlyPL'&&d.prevCount)).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)||Math.abs(b.cur)-Math.abs(a.cur));}
function pickDim(dims){
 let best=null,score=0;
 for(const d of Object.keys(DIMS)){const list=dims[d]||[],total=sum(list,x=>Math.abs(x.diff)),named=sum(list,x=>x.missing?0:Math.abs(x.diff));const v=total?named/total:0;if(v>score+1e-9){score=v;best=d;}}
 return best;
}
function counterSummary(list){const m=new Map();for(const e of list){const names=e.counter?.length?e.counter:['（相手科目なし）'];for(const a of names){const x=m.get(a)||{account:a,amount:0,count:new Set()};x.amount+=e.amount/names.length;x.count.add(e.jk);m.set(a,x);}}return [...m.values()].map(x=>({account:x.account,amount:x.amount,count:x.count.size})).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));}
function largest(list){return list.reduce((b,e)=>!b||Math.abs(e.amount)>Math.abs(b.amount)?e:b,null);}
function entryText(e){if(!e)return '';const party=tag(e.row,e.side,'party'),item=tag(e.row,e.side,'item'),desc=clean(e.row.description);return `${md(e.row.date)} ${party?party+' ':''}${yen(Math.abs(e.amount))}（相手科目：${(e.counter||[]).join('・')||'なし'}${item?'・品目：'+item:''}）${desc?'「'+desc.slice(0,40)+'」':''}`;}

function inferDriver(c,s,ex,d,push0){

   if(payV>EPS){const via=[...new Set(cashOut.flatMap(e=>e.counter||[]).filter(a=>isCash(c,a)))].join('・')||'口座等',what=/消費税/.test(s.account)?'消費税':/法人税/.test(s.account)?'法人税等':/事業税/.test(s.account)?'事業税':/住民税/.test(s.account)?'住民税':'';push('高',s.fam==='withholding'?'源泉所得税等の納付':`${what||'税金'}の納付`,`${ml(ex.month)}に${s.account} ${yen(payV)} を${via}から納付しています${s.fam==='withholding'?'（給与・報酬から預かった源泉所得税・住民税の納付。納期の特例なら1月・7月に半年分をまとめて納付）':''}。そのため残高が減っています。`,'tax');}
   if(incV>EPS)push('中',s.fam==='withholding'?'給与等からの預り':'税額の計上',s.fam==='withholding'?`給与・報酬の支払時に源泉所得税などを ${yen(incV)} 預かっています。`:`決算・申告に伴う税額 ${yen(incV)} を計上しています。`,'tax');
  }else if(s.fam==='loan'){
   if(payV>EPS)push('高','借入金の返済',`借入金を ${yen(payV)} 返済しています（${jcount(cashOut)}件）。`,'loan');
   if(cashIn.length)push('高','新規の借入',`新たに ${yen(sum(cashIn,e=>e.amount))} を借り入れています。`,'loan');
  }else if(s.fam==='fixedAsset'){
   if(incV>EPS)push('中','資産の取得',`当月 ${yen(incV)} の資産を取得しています（${entryText(largest(inc))}）。`,'asset');
   if(dec.some(e=>(e.counter||[]).some(a=>/減価償却/.test(a))))push('中','減価償却','減価償却費の計上で帳簿価額が減っています。','asset');
  }else if(s.fam==='ownerDraw'||s.fam==='ownerContribution'){
   if(incV>EPS){const T2=median([...c.loaded].filter(m=>m!==ex.month).map(m=>sum(s.entries.filter(e=>e.month===m&&e.amount>0),e=>e.amount)).filter(v=>v>EPS));if(T2&&incV>T2*1.5&&incV-T2>=th)push('中','通常月より多い',`当月の${s.account}の増加 ${yen(incV)} は、通常月（約${yen(T2)}）の約${(incV/T2).toFixed(1)}倍です。`,'level');}

}

// ---- 変動の説明
function explain(session,result,type,account,month,opt={}){

 const s=series(c,type,account),p=prevMonth(month);
 const scopeEntries=scoped?(tags(c,type,account,scopeDim).map.get(opt.tag)?.entries||[]):s.entries;

 const bestDim=pickDim(dims),useDesc=!bestDim&&descs.length&&descs.some(d=>d.key)&&descs.length<=Math.max(3,scopeEntries.filter(e=>e.month===month).length*0.8);
 const dir=Math.sign(Number.isFinite(ledgerDelta)&&Math.abs(ledgerDelta)>EPS?ledgerDelta:delta||0),aligned=d=>dir!==0&&Math.sign(d.diff)===dir?0:1;
 const drivers=(bestDim?dims[bestDim]:useDesc?descs:counters).slice().sort((a,b)=>aligned(a)-aligned(b)||Math.abs(b.diff)-Math.abs(a.diff)).slice(0,5);
 const curEntries=scopeEntries.filter(e=>e.month===month),prevEntries=scopeEntries.filter(e=>e.month===p);
 const ex={type,account,month,prevMonth:p,scoped,dim:scopeDim,tag:scoped?opt.tag:null,tagLabel:scoped?(opt.tag||'未選択'):null,
  cur,prev,delta,ledgerDelta,unexplained,reported:s.reported,flowOnly:s.flowOnly,role:s.role,family:s.fam,
  dims,counters,bestDim,drivers,curEntries,prevEntries,facts:[],inferences:[]};
 const seen=new Set(),push=(level,short,text,kind,about)=>{const k=kind+'|'+short;if(seen.has(k)||!text)return;seen.add(k);ex.inferences.push({level,short,text,kind,...(about?{about}:{})});};
 // 事実
 const unit=s.type==='monthlyPL'?'':'末';
 if(scoped)ex.facts.push(type==='monthlyPL'?`${NOUN[scopeDim]}「${ex.tagLabel}」：${ml(p)} ${yen(prev)} → ${ml(month)} ${yen(cur)}（${signed(delta)}）`:`${NOUN[scopeDim]}「${ex.tagLabel}」の当月の増減：${signed(cur)}（前月の増減 ${signed(prev)}）`);
 else if(s.flowOnly)ex.facts.push(`${ml(month)}の増減 ${signed(delta)}（月次BSが未読込のため、仕訳から集計した増減です）`);
 else ex.facts.push(`${ml(p)}${unit} ${yen(prev)} → ${ml(month)}${unit} ${yen(cur)}（${signed(delta)}）${s.reported||type==='monthlyBS'?'':'　※仕訳からの参考集計'}`);
 if(type==='monthlyBS'){const inc=sum(curEntries,e=>e.amount>0?e.amount:0),dec=-sum(curEntries,e=>e.amount<0?e.amount:0);ex.facts.push(`当月の増加 ${yen(inc)}（${jcount(curEntries.filter(e=>e.amount>0))}件）／減少 ${yen(dec)}（${jcount(curEntries.filter(e=>e.amount<0))}件）`);}
 const share=d=>Number.isFinite(ledgerDelta)&&Math.abs(ledgerDelta)>EPS&&Math.sign(d.diff)===Math.sign(ledgerDelta)&&Math.abs(d.diff)<=Math.abs(ledgerDelta)+EPS?`、変動の${Math.min(999,Math.round(Math.abs(d.diff/ledgerDelta)*100))}%`:'';

 if(Number.isFinite(unexplained))ex.facts.push(`帳票の増減と仕訳の集計の差：${signed(unexplained)}`);
 // 推測：主な内訳ごと → 科目全体。確からしさ（高・中・低）→ 科目固有の説明 → 一般的なパターンの順に並べる。

 if(bestDim&&bestDim!=='party'&&dims.party?.length)for(const d of dims.party.slice(0,1))if(!d.missing&&Math.abs(d.diff)>=th*0.3)inferDriver(c,s,ex,d,push);
 if(!scoped)inferAccount(c,s,ex,push);
 if(!ex.inferences.length&&lead.length){const d=lead[0];push('低',`${d.label}の${d.diff>=0?'増加':'減少'}`,`${d.dim==='counter'?'相手科目「'+d.label+'」の取引':d.label}の${type==='monthlyPL'?'計上額':'増減'}が${signed(d.diff)}で、変動の主な要因です。仕訳の摘要・証憑で内容を確認してください。`,'driver');}
 if(!curEntries.length&&!prevEntries.length&&!ex.inferences.length)push('低','当月・前月とも仕訳なし','当月・前月ともこの範囲の仕訳はありません。','data');
 const order={'高':0,'中':1,'低':2},generic=new Set(['level','new','count','price','big','rebound','data','note','driver','advance','campaign']);

 const top=drivers.find(d=>Math.abs(d.diff)>EPS);
 const payOnly=top&&top.missing&&top.curEntries.length&&top.curEntries.every(e=>e.amount<0&&(e.counter||[]).some(a=>isCash(c,a)));

 const acctFirst=['cash','card','payable','receivable','taxPayable','withholding','loan'].includes(s.fam);
 const pick=(acctFirst&&ex.inferences.find(x=>!x.about&&x.level!=='低'&&!['flow','data','note'].includes(x.kind)))||(top&&ex.inferences.find(x=>x.about===top.label))||(acctFirst&&ex.inferences.find(x=>x.kind==='flow'))||ex.inferences.find(x=>!x.about&&x.level!=='低')||(top?{level:'低',short:`${top.dim==='counter'?'相手科目「'+top.label+'」':top.label}の${top.diff>=0?'増加':'減少'}`,kind:'driver'}:ex.inferences[0]||null);
 ex.reasonItem=pick;ex.reason=pick?.short||'';
 ex.summary=[Number.isFinite(delta)?signed(delta):'',ex.headline?'主因：'+ex.headline:'',ex.reason].filter(Boolean).join('　');

}

// ---- 全科目から大きな変動を拾う
// 前月から「いつもと違う」動きか：PLは金額の変化率、BSは残高の増減がふだんの月の増減と違うか（毎月同じように増える科目は除く）
function notableAt(c,s,m){
 const th=threshold(c),d=deltaAt(c,s,m);if(!Number.isFinite(d)||Math.abs(d)<th)return null;

 else{
  if(!s.usualMove){const ds=c.months.map(x=>deltaAt(c,s,x)).filter(Number.isFinite);s.usualMove=new Map(c.months.map(x=>[x,median(c.months.filter(y=>y!==x).map(y=>deltaAt(c,s,y)).filter(Number.isFinite))]));s.usualMove.set('*',median(ds));}
  const usual=s.usualMove.get(m)??0,gap=Math.abs(d-(usual||0));if(gap<th)return null;
  const base=Math.abs(s.flowOnly?median(c.months.map(x=>Math.abs(ledgerAt(c,s,x)||0))):valueAt(c,s,prevMonth(m))||0);rel=base>EPS?gap/base:3;

function isHot(session,result,type,account,month){const c=context(session,result);if(!c)return false;return !!notableAt(c,series(c,type,account),month);}
function notable(session,result,opt={}){

 const out=[];

  const groups=type==='monthlyPL'?c.model.pl:(c.model.bs.length?c.model.bs:ledgerBS(c));
  for(const g of groups){
   if(g.computed||['summary','unknown'].includes(g.role))continue;
   const s=series(c,type,g.account);
   for(const m of c.months){if(opt.month&&m!==opt.month)continue;const n=notableAt(c,s,m);if(n)out.push({type,account:g.account,month:m,...n});}
  }

}
function monthReasons(session,result,type,account){

}
// 表示用：内訳行の月別の値。BSは「月末残高（期首の内訳は別行）」または「当月の増減」。
function tagRows(session,result,type,account,dim,mode='balance'){

 const s=series(c,type,account),t=tags(c,type,account,dim),months=c.months;
 const vals=tg=>{let run=0;return Object.fromEntries(months.map(m=>{const v=tg.flow[m]||0;run+=v;return [m,type==='monthlyBS'&&mode==='balance'&&!s.flowOnly?run:v];}));};
 const rows=t.list.map(tg=>({key:tg.key,label:tg.label,missing:tg.missing,values:vals(tg),count:sum(months,m=>tg.count[m]||0)}));
 const total=Object.fromEntries(months.map(m=>[m,sum(rows,r=>r.values[m])]));
 const report=Object.fromEntries(months.map(m=>[m,valueAt(c,s,m)]));
 const opening=type==='monthlyBS'&&mode==='balance'&&!s.flowOnly?s.opening:null;
 const diff=Object.fromEntries(months.map(m=>{const r=report[m];if(!Number.isFinite(r))return [m,null];const v=r-total[m]-(type==='monthlyBS'&&mode==='balance'&&!s.flowOnly?(opening||0):0);return [m,type==='monthlyBS'&&mode==='flow'&&!s.flowOnly?(Number.isFinite(deltaAt(c,s,m))?deltaAt(c,s,m)-total[m]:null):v];}));
 return {rows,total,opening,diff,hasDiff:Object.values(diff).some(v=>Number.isFinite(v)&&Math.abs(v)>=1),named:t.named,flowOnly:s.flowOnly,mode:type==='monthlyBS'&&!s.flowOnly?mode:'flow'};
}

// ---- 表示（説明パネル・確認キュー）
const LEVEL={'高':'ok','中':'warn','低':''};
function html(ex,opt={}){
 if(!ex)return '';
 const head=opt.compact?'':`<div class="vx-numbers">${ex.scoped?'':`<div><span>${ml(ex.prevMonth)}${ex.type==='monthlyPL'?'':'末'}</span><strong>${ex.flowOnly?signed(ex.prev):yen(ex.prev)}</strong></div><div><span>${ml(ex.month)}${ex.type==='monthlyPL'?'':'末'}</span><strong>${ex.flowOnly?signed(ex.cur):yen(ex.cur)}</strong></div>`}<div class="vx-delta ${ex.delta>0?'up':ex.delta<0?'down':''}"><span>${ex.type==='monthlyPL'||ex.scoped&&ex.type==='monthlyPL'?'前月差':'当月の増減'}</span><strong>${signed(ex.delta)}</strong></div></div>`;
 const facts=`<h4>取引から分かること</h4><ul class="vx-facts">${ex.facts.map(f=>`<li${/^・/.test(f)?' class="vx-sub"':''}>${esc(f.replace(/^・/,''))}</li>`).join('')}</ul>`;
 const inf=`<h4>理由の推測</h4>${ex.inferences.length?`<ul class="vx-infer">${ex.inferences.slice(0,opt.compact?3:8).map(x=>`<li><span class="badge ${LEVEL[x.level]}" title="推測の確からしさ">${x.level}</span><div><strong>${esc(x.short)}</strong><p>${esc(x.text)}</p></div></li>`).join('')}</ul>`:'<p class="small">取引から理由を推測できる手がかりがありません。</p>'}`;

}
function text(ex){

function forFinding(f,session,result){

function promptText(ex,session){

 const rows=ex.curEntries.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)).slice(0,40).map(e=>`${e.row.date}\t${e.side==='debit'?'借方':'貸方'}\t${fmt(e.raw)}\t相手:${(e.counter||[]).join('・')}\t取引先:${tag(e.row,e.side,'party')||'未選択'}\t品目:${tag(e.row,e.side,'item')||'未選択'}\t部門:${tag(e.row,e.side,'department')||'未選択'}\t摘要:${clean(e.row.description)}`);
 const prevRows=ex.prevEntries.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)).slice(0,20).map(e=>`${e.row.date}\t${fmt(e.amount)}\t取引先:${tag(e.row,e.side,'party')||'未選択'}\t品目:${tag(e.row,e.side,'item')||'未選択'}\t摘要:${clean(e.row.description)}`);
 return `あなたは会計事務所の記帳チェック担当です。次の科目が${ml(ex.month)}にこれだけ変動した理由を、仕訳を根拠に説明してください。断定できない点は「推測」と明記し、お客様に確認すべき質問も挙げてください。\n\n会社：${session?.project?.name||''}（${session?.project?.type==='corp'?'法人':'個人事業'}）\n科目：${ex.account}${ex.scoped?'／'+NOUN[ex.dim]+'「'+ex.tagLabel+'」':''}\n${ex.facts.join('\n')}\n\nこのツールの推測：\n${ex.inferences.map(x=>`・${x.short}：${x.text}`).join('\n')||'なし'}\n\n当月の仕訳（金額の大きい順・最大40件）：\n日付\t借貸\t金額\t相手科目\t取引先\t品目\t部門\t摘要\n${rows.join('\n')||'なし'}\n\n前月の仕訳（比較用・最大20件）：\n${prevRows.join('\n')||'なし'}\n`;

const V={DIMS,NOUN,isHot,tag,looksPerson,family,context,series,valueAt,deltaAt,tags,tagRows,explain,notable,monthReasons,ledgerBS,threshold,html,text,findingHTML,findingText,promptText,signed,yen,fmt,ml,yml};

<script>
(function(root){
'use strict';
// 月次PL・BS画面。v3.0の帳票形式・推移グラフ・売掛金・照合はそのまま残し、
// 帳票形式を freee の月次推移と同じ階層（▶科目 → 取引先別・品目別・部門別 → 未選択・各タグ）にした。
// 金額を押すと、右側のパネルで「なぜこの月にこれだけ変動したか」を仕訳から説明する（ReviewVariance）。
const F=root.ReviewFinancial,E=root.ReviewEngine,D=root.ReviewDetails,V=root.ReviewVariance;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP').format(n):'—';

}

const PL_ORDER=['売上','雑収入','受取利息','仕入','租税公課','荷造運賃','水道光熱','旅費交通','通信','広告宣伝','交際','保険','修繕','消耗品','減価償却','福利厚生','給料','給与','賃金','賞与','法定福利','外注','支払利息','利子割引','地代家賃','家賃','貸倒'];

 out.push(...inc.map(g=>({g,level:'item'})),sum(inc,'収益計（参考）','sub'),...exp.map(g=>({g,level:'item'})),sum(exp,'経費計（参考）','sub'));
 const diff=sum([],'差引損益（参考）','major');for(const m of months){const a=out.find(x=>x.g.account==='収益計（参考）').g.values[m],b=out.find(x=>x.g.account==='経費計（参考）').g.values[m];diff.g.values[m]=Number.isFinite(a)&&Number.isFinite(b)?a-b:null;}

function breakdownTable(ex,tab){

function renderDrawer(focus){

 const tab=tabs.includes(d.tab)?d.tab:(ex.bestDim&&tabs.includes(ex.bestDim)?ex.bestDim:tabs.includes('party')?'party':'counter');
 const sorted=ex.curEntries.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)),prevSorted=ex.prevEntries.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));
 const scope=ex.scoped?`${DIM_HELP[ex.dim]}「${esc(ex.tagLabel)}」`:'科目全体';
 el.innerHTML=`<div class="vt-dhead"><div><div class="eyebrow">WHY IT CHANGED</div><h2 id="vtDrawerTitle">${esc(d.account)}<small>${esc(V.yml(d.month))}</small></h2><p class="small">${d.type==='monthlyPL'?'損益計算書':'貸借対照表'} ／ ${scope}${ex.scoped?` <button class="linkbtn" data-vt-scope-all="1">科目全体を見る</button>`:''}</p></div><div class="vt-dnav"><button class="btn small" data-vt-step="-1" ${i<=0?'disabled':''} aria-label="前の月">◀ ${i>0?esc(V.ml(months[i-1])):''}</button><button class="btn small" data-vt-step="1" ${i>=months.length-1?'disabled':''} aria-label="次の月">${i<months.length-1?esc(V.ml(months[i+1])):''} ▶</button><button class="btn small vt-close" data-vt-close="1" aria-label="閉じる">×</button></div></div>
 <div class="vt-dbody">${V.html(ex)}
 <div class="vt-actions"><button class="btn small" data-vt-copy="memo">分析をコピー（メモ用）</button><button class="btn small" data-vt-copy="prompt" title="Claudeなどに貼り付けて、さらに詳しく聞くための文章">AIに相談する文章をコピー</button></div>
 <h3>内訳</h3><div class="vt-tabs" role="tablist">${tabs.map(t=>`<button class="btn small" role="tab" data-vt-tab="${t}" aria-selected="${t===tab}">${t==='counter'?'相手科目別':V.DIMS[t]}</button>`).join('')}</div>${breakdownTable(ex,tab)}

 <details class="vt-prev"><summary>${esc(V.ml(ex.prevMonth))}の仕訳（比較用・${ex.prevEntries.length}行）</summary>${prevSorted.length?`<div class="tablewrap"><table class="datatable vt-evidence"><thead><tr><th>日付</th><th class="num">増減</th><th>相手科目</th><th>取引先・品目・部門・摘要</th></tr></thead><tbody>${evidenceRows(prevSorted,50)}</tbody></table></div>`:'<p class="small">前月の仕訳はありません（未読込の場合もあります）。</p>'}</details>

 el.hidden=false;document.documentElement.classList.add('vt-drawer-open');

function copyText(text){
 const done=()=>{const t=document.getElementById('toast');if(t){t.textContent='コピーしました';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}};
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallback());else fallback();
 function fallback(){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
}
function rerender(type){
 if(!lastRender)return;const sec=document.querySelector(`.monthly-panel[data-stmt="${type}"]`);if(!sec)return;
 const wrap=sec.querySelector('.stmt-wrap'),x=wrap?wrap.scrollLeft:0,t=document.createElement('div');
 t.innerHTML=matrixTable(lastRender.model,type,lastRender.cfg,lastRender.session,lastRender.result);sec.replaceWith(t.firstElementChild);
 const w2=document.querySelector(`.monthly-panel[data-stmt="${type}"] .stmt-wrap`);if(w2)w2.scrollLeft=x;
}
if(typeof document!=='undefined'){
 document.addEventListener('click',e=>{
  const v=e.target.closest?.('[data-stmt-view]');
  if(v&&lastRender){const [type,mode]=v.dataset.stmtView.split(':');if(!stmtView[type]||!['statement','grid'].includes(mode))return;stmtView[type]=mode;rerender(type);return;}
  const p=e.target.closest?.('[data-stmt-print]');
  if(p){const st=p.closest('.monthly-panel')?.querySelector('.stmt');if(!st)return;document.getElementById('stmtPrint')?.remove();const box=document.createElement('div');box.id='stmtPrint';box.innerHTML=st.outerHTML;document.body.appendChild(box);document.documentElement.classList.add('printing-stmt');const done=()=>{document.documentElement.classList.remove('printing-stmt');box.remove();window.removeEventListener('afterprint',done);};window.addEventListener('afterprint',done);window.print();return;}
  if(!lastRender)return;
  const b=e.target.closest?.('button');if(!b)return;const ds=b.dataset,st=uiState(lastRender.session);
  if(ds.vtAcct){const r=getRef(ds.vtAcct);if(!r)return;const id=r.type+'|'+r.account;if(st.open.has(id))st.open.delete(id);else{st.open.add(id);if(![...st.dims].some(x=>x.startsWith(id+'|')))st.dims.add(id+'|party');}rerender(r.type);return;}
  if(ds.vtDim){const r=getRef(ds.vtDim);if(!r)return;const id=r.type+'|'+r.account+'|'+r.dim;if(st.dims.has(id))st.dims.delete(id);else st.dims.add(id);rerender(r.type);return;}
  if(ds.vtReasons){const r=getRef(ds.vtReasons);if(!r)return;const id=r.type+'|'+r.account+'|reasons|closed';if(st.reasons.has(id))st.reasons.delete(id);else st.reasons.add(id);rerender(r.type);return;}
  if(ds.vtMore){const r=getRef(ds.vtMore);if(!r)return;st.more.add(r.type+'|'+r.account+'|'+r.dim);rerender(r.type);return;}
  if(ds.vtBsmode){if(!['balance','flow'].includes(ds.vtBsmode))return;st.bsMode=ds.vtBsmode;rerender('monthlyBS');return;}
  if(ds.vtExpand){const [type,how]=ds.vtExpand.split(':');const groups=type==='monthlyPL'?lastRender.model.pl:(lastRender.model.bs.length?lastRender.model.bs:V.ledgerBS(V.context(lastRender.session,lastRender.result)));for(const g of groups){if(g.computed||g.role==='summary')continue;const id=type+'|'+g.account;if(how==='open'){st.open.add(id);if(![...st.dims].some(x=>x.startsWith(id+'|')))st.dims.add(id+'|party');}else st.open.delete(id);}rerender(type);return;}
  if(Object.hasOwn(ds,'vtFocusMonth')){const m=ds.vtFocusMonth;st.focusMonth=lastRender.result.financial.months.includes(m)?m:null;const sec=document.getElementById('vtChanges');if(sec){const t=document.createElement('div');t.innerHTML=changesPanel(lastRender.session,lastRender.result);sec.replaceWith(t.firstElementChild);}return;}
  if(ds.vtCardsAll){st.cardsAll=!st.cardsAll;const sec=document.getElementById('vtChanges');if(sec){const t=document.createElement('div');t.innerHTML=changesPanel(lastRender.session,lastRender.result);sec.replaceWith(t.firstElementChild);}return;}
  if(ds.vtRef){const r=getRef(ds.vtRef);if(r){drawer=null;openDrawer(r);if(drawer)drawer.returnFocus=b;}return;}
  if(!drawer)return;
  if(ds.vtClose){closeDrawer();return;}
  if(ds.vtStep){const ms=drawer.result.financial.months,i=ms.indexOf(drawer.month)+(+ds.vtStep);if(i>=0&&i<ms.length){drawer.month=ms[i];drawer.limit=50;renderDrawer(false);}return;}
  if(ds.vtTab){drawer.tab=ds.vtTab;renderDrawer(false);return;}
  if(ds.vtScopeAll){drawer.dim=null;drawer.tag=null;drawer.tab=null;renderDrawer(false);return;}
  if(ds.vtMoreEvidence){drawer.limit+=50;renderDrawer(false);return;}
  if(ds.vtCopy){const ex=V.explain(drawer.session,drawer.result,drawer.type,drawer.account,drawer.month,{dim:drawer.dim,tag:drawer.tag});copyText(ds.vtCopy==='prompt'?V.promptText(ex,drawer.session):V.text(ex));return;}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){closeDrawer();}});
 // 大きく動いた月の金額：マウスを乗せたときに理由の要約を作って表示する（描画を軽くするため）
 const tip=e=>{const b=e.target.closest?.('td.vt-hot>button[data-vt-ref]');if(!b||b.dataset.vtTip||!lastRender)return;const r=getRef(b.dataset.vtRef);if(!r)return;b.dataset.vtTip='1';const ex=V.explain(lastRender.session,lastRender.result,r.type,r.account,r.month);if(ex?.summary)b.title=ex.summary;};
 document.addEventListener('mouseover',tip);document.addEventListener('focusin',tip);
}

,0 6px 0 var(--slab),0 9px 0 var(--slab2),0 10px 0 var(--slab2),0 32px 44px -18px var(--halo)}\n.hero-emb .tile .face svg{width:78px;height:78px;overflow:visible;filter:drop-shadow(0 0 6px var(--glyph-glow))}\n.hero-emb .tile .g1{fill:none;stroke:var(--accent2);stroke-width:3.4}\n.hero-emb .tile .g2{fill:none;stroke:var(--accent2);stroke-width:2.2;opacity:.85}\n.hero-emb .tile .gloss{position:absolute;top:-30%;bottom:-30%;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}\n.hero-emb .floor{left:30%;right:30%;bottom:6%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,80,20,.22),transparent);filter:blur(3px);transform:translateZ(-40px)}\n.emb-cap{position:absolute;left:0;bottom:-18px;font-size:11px;letter-spacing:.22em;color:var(--ink2)}\n@media (prefers-reduced-motion:no-preference){\n  .hero-emb .tile{animation:tile9 9s ease-in-out infinite}\n  .hero-emb .tile .gloss{animation:gloss9 6.5s var(--ease) infinite}\n  .hero-emb .ring.r1{animation:ring9a 18s linear infinite}\n  .hero-emb .ring.r2{animation:ring9b 26s linear infinite}\n}\n@keyframes tile9{0%,100%{transform:translateY(0) rotateX(14deg) rotateY(-24deg)}50%{transform:translateY(-8px) rotateX(8deg) rotateY(16deg)}}\n@keyframes gloss9{0%,60%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(560%)}}\n@keyframes ring9a{from{transform:rotateX(70deg) rotateY(-8deg) rotateZ(0)}to{transform:rotateX(70deg) rotateY(-8deg) rotateZ(360deg)}}\n@keyframes ring9b{from{transform:rotateZ(28deg) rotateY(72deg) rotateX(0)}to{transform:rotateZ(28deg) rotateY(72deg) rotateX(360deg)}}\n.hero-emb,.hero-copy{grid-area:auto}\n.hero-copy{margin:0;padding:0;max-width:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;justify-self:stretch;align-self:center}\n.hero-k{margin:0;font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--accent)}\n.hero h1{margin:20
