e:12px;line-height:1.6;color:var(--ink2)}\n.sib.none{border-left-color:var(--slate)}\n.sib-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-weight:700;color:var(--head)}\n.sib-bad{font-weight:500;color:var(--shu)}\n.sib-sum{display:flex;flex-wrap:wrap;gap:2px 14px;margin:2px 0 4px}\n.sib-sum b{font-weight:700;color:var(--head)}\n.sibt{border-collapse:collapse;width:100%}\n.sibt td{padding:2px 8px 2px 0;border-top:1px dashed var(--rule);vertical-align:top;white-space:nowrap}\n.sibt td:last-child{white-space:normal}\n.sibt .fx{margin:0 0 0 6px;padding:0 6px;font-size:10px}\n.jwarn{margin-top:6px;font-size:11.5px;line-height:1.55;color:var(--shu)}\n.tx .sibt td,.dwtbl .sibt td{box-shadow:none!important;opacity:1!important;background:none!important;padding:2px 8px 2px 0;border-bottom:0}\n\n\n/* 自計化レビューに組み込んだとき：親アプリと重なる見出し・テーマ切替を隠す（機能はそのまま） */\nhtml[data-embed] .util,html[data-embed] .masthead,html[data-embed] .newsband{display:none!important}\nhtml[data-embed] #home>.hero,html[data-embed] #home>ol.steps{display:none!important}\nhtml[data-embed] body{min-height:100%}\nhtml[data-embed] .embednote{margin:18px 0 0;padding:11px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--card);font-size:13px;color:var(--ink2);line-height:1.7}\nhtml[data-embed] .embednote b{color:var(--ink)}\n<\/style>\n\n<div class=\"util\"><div class=\"in\"><p class=\"util-l\">消費税区分別チェッカー<span class=\"sep\">｜<\/span>自計化チェックの作業スペース<\/p><p class=\"util-r2\">MULTI-COMPANY ・ TAX CHECK<\/p><\/div><\/div>\n<header class=\"masthead\"><div class=\"in\">\n  <a class=\"brand\" href=\"#/\" aria-label=\"消費税区分別チェッカー 会社一覧へ\"><span class=\"mini\" aria-hidden=\"true\"><svg class=\"mark\" viewBox=\"0 0 64 64\"><rect x=\"4\" y=\"4\" width=\"56\" height=\"56\" rx=\"17\" style=\"fill:var(--card);stroke:var(--accent2)\" stroke-width=\"3\"/><rect x=\"11.5\" y=\"11.5\" width=\"41\" height=\"41\" rx=\"11\" fill=\"none\" style=\"stroke:var(--accent2)\" stroke-width=\"1.4\" opacity=\".5\"/><path d=\"M20.5 32.5l7.8 7.8 15.6-16.6\" fill=\"none\" style=\"stroke:var(--accent2)\" stroke-width=\"4.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span><span class=\"bt\"><span class=\"t\">消費税区分別チェッカー<\/span><span class=\"bsub\">自計化チェック<\/span><\/span><\/a>\n  <div class=\"mh-co\"><span class=\"k\">選択中の会社<\/span><b id=\"mhCo\">会社を選んで開始<\/b><\/div>\n  <a class=\"btn line mh-sw\" href=\"#/\" data-cosw>会社を切り替える<\/a>\n  <div class=\"mh-r\"><div class=\"themeseg\" id=\"theme\" role=\"group\" aria-label=\"表示テーマ\"><span class=\"knob\" aria-hidden=\"true\"><\/span><button type=\"button\" data-t=\"light\" aria-pressed=\"true\" title=\"明るめの表示\">明るめ<\/button><button type=\"button\" data-t=\"dark\" aria-pressed=\"false\" title=\"近未来の表示\">近未来<\/button><\/div><p class=\"mh-note\"><b>端末内で完結<\/b><br>読込データの外部送信なし<\/p><\/div>\n<\/div><\/header>\n<div class=\"topbar\"><div class=\"in\">\n  <nav class=\"hnav\" aria-label=\"ページ内の移動\"><a href=\"#h1\" data-jump=\"h1\" class=\"on\">会社一覧<\/a><a href=\"#coKpi\" data-jump=\"coKpi\">進み具合<\/a><a href=\"#bkBox\" data-jump=\"bkBox\">バックアップ<\/a><a href=\"#cfgBox\" data-jump=\"cfgBox\">判定ルールの設定<\/a><\/nav>\n  <nav class=\"nav\" id=\"nav\" aria-label=\"手順\">\n      <a href=\"#s1\" data-s=\"s1\"><span class=\"n\">01<\/span>取込<span class=\"s\" id=\"st1\">―<\/span><\/a>\n      <a href=\"#s2\" data-s=\"s2\"><span class=\"n\">02<\/span>区分マトリクス<span class=\"s\" id=\"st2\">―<\/span><\/a>\n      <a href=\"#s3\" data-s=\"s3\"><span class=\"n\">03<\/span>取引精査<span class=\"s\" id=\"st3\">―<\/span><\/a>\n      <a href=\"#sI\" data-s=\"sI\"><span class=\"n\">04<\/span>インボイス<span class=\"s\" id=\"stI\">―<\/span><\/a>\n      <a href=\"#s4\" data-s=\"s4\"><span class=\"n\">05<\/span>学習<span class=\"s\" id=\"st4\">―<\/span><\/a>\n      <a href=\"#s5\" data-s=\"s5\"><span class=\"n\">06<\/span>出力<span class=\"s\" id=\"st5\">―<\/span><\/a>\n    <\/nav>\n  <button class=\"selpill\" id=\"selpill\" type=\"button\" hidden><span class=\"k\">表示中<\/span><span class=\"acc\" id=\"spAcc\"><\/span><span class=\"tx\" id=\"spTax\"><\/span><span class=\"prog\" id=\"spProg\"><\/span><\/button>\n<\/div><\/div>\n<div class=\"newsband\"><div class=\"in\"><span class=\"nb-tag\">作業スペース<\/span><b class=\"nb-page\" id=\"nbPage\">会社一覧<\/b><span class=\"nb-st\"><i aria-hidden=\"true\"><\/i>データはこのブラウザの中だけ<\/span><span class=\"nb-chip\">LOCAL ・ 追加費用 0円<\/span><\/div><\/div>\n\n<div class=\"wrap\" id=\"top\">\n <div id=\"home\">\n  <header class=\"hero\">\n    <div class=\"hero-emb\" aria-hidden=\"true\"><div class=\"orb\" id=\"orb\"><i class=\"ring r1\"><b><\/b><\/i><i class=\"ring r2\"><b><\/b><\/i><div class=\"tile\"><i class=\"face\"><svg viewBox=\"0 0 46 46\"><rect class=\"g1\" x=\"9\" y=\"9\" width=\"28\" height=\"28\" rx=\"9\"/><rect class=\"g2\" x=\"14.5\" y=\"14.5\" width=\"17\" height=\"17\" rx=\"5.5\"/><\/svg><i class=\"gloss\"><\/i><\/i><\/div><i class=\"floor\"><\/i><\/div><span class=\"emb-cap\">TAX CHECK ／ PRIVATE REVIEW SPACE<\/span><\/div>\n    <div class=\"hero-copy\">\n      <p class=\"hero-k\">TAX CLASSIFICATION ／ 消費税区分<\/p>\n      <h1><span class=\"l1\">担当会社の​消費税区分を、<\/span><span class=\"l2\">ここから。<\/span><\/h1>\n      <p class=\"sub\">会社を選ぶと、その会社の仕訳帳・前期の修正仕訳・チェックの記録が開きます。違和感のある科目と取引に印が付き、判断を記録できます。<\/p>\n      <div class=\"btns hero-btns\"><button class=\"btn\" type=\"button\" data-act=\"add\">＋ 会社を追加<\/button><button class=\"btn line\" type=\"button\" data-act=\"paste\">一覧をまとめて追加<\/button><\/div>\n    <\/div>\n  <\/header>\n  <ol class=\"steps\" aria-label=\"使い方\">\n      <li><b>1<\/b>会社を登録（Excelから貼り付けOK）<\/li>\n      <li><b>2<\/b>会社を開いて仕訳帳CSVを入れる<\/li>\n      <li><b>3<\/b>印の付いた取引にOK・修正・保留<\/li>\n      <li><b>4<\/b>メモ欄の下書きをコピーして完了<\/li>\n    <\/ol>\n  <p class=\"embednote\" id=\"embedNote\" hidden><b>区分チェックの全社一覧と設定<\/b>　会社の選択は自計化レビューと共通です。ここで会社を開くと、自計化レビュー側もその会社に切り替わります。<\/p>\n  <div class=\"tally\" id=\"coKpi\"><\/div>\n  <section class=\"stage\" id=\"h1\">\n    <div class=\"sh\"><span class=\"no\">LIST<\/span><h2>会社一覧<\/h2><p>会社名を押すと、その会社の区分チェックを開きます。進み具合は自動で記録されます。<\/p><\/div>\n    <div class=\"toolbar\">\n      <input type=\"search\" id=\"coSearch\" placeholder=\"会社名・担当・メモで検索\" aria-label=\"会社を検索\" style=\"min-width:220px;flex:1;max-width:340px\">\n      <div class=\"seg\" id=\"coFilter\" role=\"group\" aria-label=\"状態で絞り込み\"><\/div>\n      <select id=\"coStaffF\" aria-label=\"担当で絞り込み\" hidden><\/select>\n      <select id=\"coSortSel\" aria-label=\"並び順\"><option value=\"updated\">更新が新しい順<\/option><option value=\"name\">名前順<\/option><option value=\"fy\">決算月順<\/option><option value=\"hi\">違和感が多い順<\/option><\/select>\n      <div class=\"btns\" style=\"margin-left:auto\"><button class=\"btn\" type=\"button\" data-act=\"add\">＋ 会社を追加<\/button><button class=\"btn line\" type=\"button\" data-act=\"paste\">まとめて貼り付け<\/button><\/div>\n    <\/div>\n    <form class=\"sheet coform\" id=\"coForm\" hidden autocomplete=\"off\">\n      <h3 id=\"coFormTitle\">会社を追加<\/h3>\n      <div class=\"cfrow\">\n        <label class=\"w2\">会社名<input type=\"text\" id=\"cfName\" required placeholder=\"例：株式会社〇〇運輸\"><\/label>\n        <label>決算月<select id=\"cfFy\"><option value=\"\">選ぶ<\/option><option value=\"1\">1月<\/option><option value=\"2\">2月<\/option><option value=\"3\">3月<\/option><option value=\"4\">4月<\/option><option value=\"5\">5月<\/option><option value=\"6\">6月<\/option><option value=\"7\">7月<\/option><option value=\"8\">8月<\/option><option value=\"9\">9月<\/option><option value=\"10\">10月<\/option><option value=\"11\">11月<\/option><option value=\"12\">12月<\/option><\/select><\/label>\n        <label>担当<input type=\"text\" id=\"cfStaff\" placeholder=\"例：池上\"><\/label>\n        <label class=\"w2\">メモ<input type=\"text\" id=\"cfMemo\" placeholder=\"例：freee・個人事業主\"><\/label>\n      <\/div>\n      <div class=\"small faint\">決算月を入れると、対象期間の開始月（期首）を自動で合わせます。<\/div>\n      <div class=\"btns\"><button class=\"btn\" type=\"submit\" id=\"cfSave\">追加して開く<\/button><button class=\"btn line\" type=\"button\" id=\"cfCancel\">やめる<\/button><button class=\"btn line danger\" type=\"button\" id=\"cfDel\" hidden>この会社を削除<\/button><\/div>\n    <\/form>\n    <div class=\"sheet coform\" id=\"coPaste\" hidden>\n      <h3>まとめて貼り付け<\/h3>\n      <div class=\"small muted\">Excelやスプレッドシートの会社一覧から、<b>会社名・決算月・担当・メモ<\/b>の列を選んでコピーし、下に貼り付けてください（見出し行があってもなくても大丈夫。決算月と担当とメモは空でもOK）。<\/div>\n      <textarea id=\"cpText\" placeholder=\"株式会社〇〇運輸&#9;3月&#9;池上&#10;有限会社△△建材&#9;12月&#9;池上\" aria-label=\"会社一覧の貼り付け\"><\/textarea>\n      <div id=\"cpPrev\"><\/div>\n      <div class=\"btns\"><button class=\"btn\" type=\"button\" id=\"cpAdd\" disabled>追加する<\/button><button class=\"btn line\" type=\"button\" id=\"cpCancel\">やめる<\/button><\/div>\n    <\/div>\n    <div class=\"undo\" id=\"coUndo\" hidden><\/div>\n    <div class=\"colist\" id=\"coList\"><\/div>\n    <details class=\"sheet cfg\" id=\"bkBox\">\n      <summary>一覧のコピー・バックアップ（別のパソコンへの移し替え、同僚との共有）<\/summary>\n      <div class=\"lcard\" style=\"padding-top:0\">\n        <div class=\"small muted\">「一覧をコピー」は会社一覧をExcelに貼れる形でコピーします。「バックアップを書き出す」は会社一覧・判断・学習・取引先の登録・設定をまとめた文字列です（取り込んだCSVは含みません）。別のパソコンで「読み込む」と移せます。<\/div>\n        <div class=\"btns\"><button class=\"btn line sm\" type=\"button\" id=\"coCopy\">一覧をコピー<\/button><button class=\"btn line sm\" type=\"button\" id=\"bkExport\">バックアップを書き出す<\/button><button class=\"btn line sm\" type=\"button\" id=\"bkImport\">読み込む<\/button><span class=\"toast\" id=\"toastB\" aria-live=\"polite\"><\/span><\/div>\n        <textarea id=\"bkText\" style=\"min-height:110px\" aria-label=\"一覧・バックアップの文字列\" placeholder=\"ここに書き出されます。読み込むときは、ここに貼ってから「読み込む」。\"><\/textarea>\n      <\/div>\n    <\/details>\n  <\/section>\n <\/div>\n\n <div id=\"ws\" hidden>\n  <header class=\"cohead\">\n    <button class=\"pill back\" type=\"button\" id=\"coBack\">← 会社一覧<\/button>\n    <div class=\"coinfo\">\n      <p class=\"eyebrow\">担当会社<\/p>\n      <h1 id=\"coName\"><\/h1>\n      <div class=\"cometa\" id=\"coMeta\"><\/div>\n    <\/div>\n    <div class=\"coact\">\n      <span class=\"stb\" id=\"coStatus\"><\/span>\n      <span class=\"savest\" id=\"saveState\"><\/span>\n      <div class=\"btns\">\n        <select id=\"coSwitch\" aria-label=\"会社を切り替え\"><\/select>\n        <button class=\"pill\" type=\"button\" id=\"coEdit\">会社情報<\/button>\n        <button class=\"btn line sm\" type=\"button\" id=\"coDone\">チェック完了にする<\/button>\n        <button class=\"btn sm\" type=\"button\" id=\"coNext\">次の会社 →<\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"tally needs\" id=\"tally\"><\/div>\n  <div id=\"notices\"><\/div>\n\n  <section class=\"stage\" id=\"s1\">\n    <div class=\"sh\"><span class=\"no\">01<\/span><h2>取込<\/h2><p>freeeの仕訳帳CSVを当期・前期1回ずつ。区分別表CSVや総勘定元帳CSVも読めます。入れたファイルは「取り消す」で外せます。<\/p><\/div>\n    <div class=\"intake\">\n      <div class=\"sheet\">\n        <label class=\"drop\" id=\"drop\" for=\"file\" tabindex=\"0\">\n          <span class=\"ic\" aria-hidden=\"true\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V4\"/><path d=\"m7 9 5-5 5 5\"/><path d=\"M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3\"/><\/svg><\/span>\n          <span><strong>CSVをドラッグ、またはクリックして選択<\/strong>\n          <span class=\"small muted\">当期と前期をまとめて入れてください。日付で当期・前期を振り分け、文字コード（Shift-JIS／UTF-8）も自動で判定します。<\/span><\/span>\n        <\/label>\n        <input type=\"file\" id=\"file\" accept=\".csv,text/csv\" multiple hidden>\n        <ul class=\"files\" id=\"files\"><\/ul>\n        <div class=\"undo\" id=\"undo\" hidden><\/div>\n      <\/div>\n      <div class=\"sheet ctl\">\n        <div class=\"lbl\">対象期間<\/div>\n        <div class=\"row\">\n          <select id=\"fy\" aria-label=\"開始年\"><\/select><select id=\"fm\" aria-label=\"開始月\"><\/select>\n          <span>〜<\/span>\n          <select id=\"ty\" aria-label=\"終了年\"><\/select><select id=\"tm\" aria-label=\"終了月\"><\/select>\n        <\/div>\n        <div class=\"small muted\" id=\"prevnote\"><\/div>\n        <div class=\"lbl\">金額のしきい値（仮）<\/div>\n        <div class=\"row\"><input type=\"number\" id=\"thr\" min=\"0\" step=\"10000\" style=\"width:9em\"><span class=\"small\">円以上は優先度を1段上げる<\/span><\/div>\n        <div class=\"btns\"><button class=\"btn line\" id=\"clear\" type=\"button\">すべて取り消す<\/button><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"sheet guide\">\n      <h3>CSVの出し方（freee会計）<\/h3>\n      <ol>\n        <li>freeeでこの会社の事業所を開き、<b>仕訳帳<\/b>の画面へ。<\/li>\n        <li>期間を<b>前期の期首〜当期の確認したい月末<\/b>にして、CSVで出力（当期と前期を別々に出しても大丈夫）。<\/li>\n        <li>出てきたCSVを上の枠にドラッグ。消費税区分別表のCSVも入れると、金額の突き合わせもします。<\/li>\n      <\/ol>\n      <div class=\"small faint\">入れたCSVはこの会社に保存されるので、次に開いたときに入れ直す必要はありません。画面の名前やボタンの位置はfreeeの更新で変わることがあります。<\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"stage needs\" id=\"s2\">\n    <div class=\"sh\"><span class=\"no\">02<\/span><h2>区分マトリクス<\/h2><p>税区分×勘定科目の貸借。マスを押すとその場で取引の明細が開きます。列の見出し（例：対象外）を押すと、その税区分の全科目をまとめて見られます。勘定科目名を押すと03へ移動します。<\/p><\/div>\n    <div class=\"toolbar\">\n      <div class=\"seg\" id=\"mxf\" role=\"group\" aria-label=\"表示する科目\"><\/div>\n      <div class=\"legend\">\n        <span><i class=\"stamp\" style=\"font-style:normal\">要<\/i>優先度 高<\/span>\n        <span><i class=\"stamp l2\" style=\"font-style:normal\">要<\/i>中<\/span>\n        <span><i class=\"stamp l1\" style=\"font-style:normal\">参<\/i>低<\/span>\n        <span>色の濃さ＝金額<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"board\">\n      <div class=\"sheet\"><div class=\"mx-wrap\"><table class=\"mx\" id=\"mx\"><\/table><\/div><\/div>\n      <div class=\"sheet suspects\" id=\"suspects\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"stage needs\" id=\"s3\">\n    <div class=\"sh\"><span class=\"no\">03<\/span><h2>取引精査<\/h2><p>取引ごとに理由と仮修正の案を見て、自分の判断（OK・修正・保留）を付けます。判断はこのブラウザに残り、次からの判定にも使われます。<\/p><\/div>\n    <div class=\"sheet\" id=\"drill\"><\/div>\n  <\/section>\n\n  <section class=\"stage needs\" id=\"sI\">\n    <div class=\"sh\"><span class=\"no\">04<\/span><h2>インボイス<\/h2><p>取引先ごとに、全額控除（課対仕入）と経過措置（控80／控70）の使い分けを確かめます。会社の課税方式と少額特例もここで設定します。<\/p><\/div>\n    <div class=\"learnI\" id=\"inv\"><\/div>\n  <\/section>\n\n  <section class=\"stage needs\" id=\"s4\">\n    <div class=\"sh\"><span class=\"no\">05<\/span><h2>学習<\/h2><p>前期（と当期）の「消費税区分修正」の仕訳から、元のどの取引を直したのかを推定し、今期の同じような取引に当てはめます。あなたの判断も覚えます。<\/p><\/div>\n    <div class=\"learn\" id=\"learn\"><\/div>\n  <\/section>\n\n  <section class=\"stage needs\" id=\"s5\">\n    <div class=\"sh\"><span class=\"no\">06<\/span><h2>出力<\/h2><p>Claudeへの依頼文、メモ欄の下書き、仮修正案の一覧。どれも案で、修正仕訳は作りません。<\/p><\/div>\n    <div class=\"sheet\">\n      <div class=\"tabs\" role=\"tablist\">\n        <button class=\"tab\" role=\"tab\" aria-selected=\"true\" data-p=\"p-memo\">メモ欄の下書き<\/button>\n        <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-p=\"p-claude\">Claudeへの依頼文<\/button>\n        <button class=\"tab\" role=\"tab\" aria-selected=\"false\" data-p=\"p-fix\">仮修正案の一覧<\/button>\n      <\/div>\n      <div class=\"panel\" id=\"p-memo\" role=\"tabpanel\">\n        <div class=\"opts\"><label><input type=\"checkbox\" id=\"mLow\"> 優先度 低の科目も書く<\/label><span class=\"small faint\">03で付けた判断が「確認結果」に入ります（先輩確認前）。<\/span><\/div>\n        <div class=\"btns\"><button class=\"btn\" id=\"copyM\" type=\"button\">コピーする<\/button><span class=\"toast\" id=\"toastM\" aria-live=\"polite\"><\/span><\/div>\n        <textarea id=\"outM\" aria-label=\"メモ欄の下書き\"><\/textarea>\n      <\/div>\n      <div class=\"panel\" id=\"p-claude\" role=\"tabpanel\" hidden>\n        <div class=\"opts\"><label><input type=\"checkbox\" id=\"cLow\"> 優先度 低の科目も入れる<\/label><\/div>\n        <div class=\"btns\"><button class=\"btn\" id=\"copyC\" type=\"button\">コピーする<\/button><span class=\"toast\" id=\"toastC\" aria-live=\"polite\"><\/span><\/div>\n        <textarea id=\"outC\" readonly aria-label=\"Claudeへの依頼文\"><\/textarea>\n      <\/div>\n      <div class=\"panel\" id=\"p-fix\" role=\"tabpanel\" hidden>\n        <div class=\"opts\"><label><input type=\"checkbox\" id=\"fLow\"> 優先度 低の取引も入れる<\/label><span class=\"small faint\">すべてAIの案です。直すかは資料と先輩の確認のあとで決めてください。<\/span><\/div>\n        <div class=\"btns\"><button class=\"btn\" id=\"copyF\" type=\"button\">コピーする<\/button><span class=\"toast\" id=\"toastF\" aria-live=\"polite\"><\/span><\/div>\n        <textarea id=\"outF\" readonly aria-label=\"仮修正案の一覧\"><\/textarea>\n      <\/div>\n    <\/div>\n  <\/section>\n\n <\/div>\n\n  <aside class=\"drawer\" id=\"drawer\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dwTitle\">\n    <div class=\"dw-bg\" id=\"dwBg\"><\/div>\n    <div class=\"dw-panel\">\n      <div class=\"dw-head\">\n        <h3 id=\"dwTitle\"><\/h3>\n        <div class=\"dw-acts\"><button class=\"btn sm\" type=\"button\" id=\"dwTo3\">03で判断する →<\/button><button class=\"iconbtn\" type=\"button\" id=\"dwClose\" aria-label=\"閉じる\" title=\"閉じる（Esc）\">✕<\/button><\/div>\n        <div class=\"dw-sub\" id=\"dwSub\"><\/div>\n      <\/div>\n      <div class=\"dw-body\" id=\"dwBody\"><\/div>\n    <\/div>\n  <\/aside>\n\n  <details class=\"sheet cfg\" id=\"cfgBox\">\n    <summary>判定ルールの設定（事務所の運用に合わせて編集。設定はこのブラウザに保存）<\/summary>\n    <div class=\"cfggrid\">\n      <label class=\"wide\"><span class=\"lbl\">勘定科目ごとの想定税区分（勘定科目 | 課税売上・課税仕入・対象外非課税・BS）<\/span><textarea id=\"cfg-master\" style=\"min-height:170px\"><\/textarea><\/label>\n      <label><span class=\"lbl\">摘要：割引・値引<\/span><textarea id=\"cfg-discount\"><\/textarea><\/label>\n      <label><span class=\"lbl\">摘要：送料・実費<\/span><textarea id=\"cfg-shipping\"><\/textarea><\/label>\n      <label><span class=\"lbl\">摘要：報酬・役務<\/span><textarea id=\"cfg-service\"><\/textarea><\/label>\n      <label><span class=\"lbl\">摘要：立替・公的手数料<\/span><textarea id=\"cfg-passthru\"><\/textarea><\/label>\n      <label><span class=\"lbl\">適格の取引先が多い科目（経過措置が多いと要確認）<\/span><textarea id=\"cfg-qualified\"><\/textarea><\/label>\n      <label><span class=\"lbl\">個人への支払いが多い科目（課対仕入10%が多いと参考表示）<\/span><textarea id=\"cfg-individual\"><\/textarea><\/label>\n    <\/div>\n    <div class=\"btns\" style=\"padding:0 20px 18px\"><button class=\"btn\" id=\"applyCfg\" type=\"button\">設定を反映する<\/button><button class=\"btn line\" id=\"resetCfg\" type=\"button\">初期設定に戻す<\/button><button class=\"btn line\" id=\"resetJudge\" type=\"button\">03の判断をすべて消す<\/button><span class=\"toast\" id=\"toastS\" aria-live=\"polite\"><\/span><\/div>\n  <\/details>\n  <p class=\"foot\"><b>消費税区分別チェッカー<\/b><br>判定と学習はルールによる目安です。最終判断は資料と担当者の確認で行ってください。<\/p>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nconst STORE='kubun-kenin-v1';\nconst DEF={\n  threshold:100000,\n  kw:{\n    discount:['割引','値引','返品','返金','返還'],\n    shipping:['送料','郵送','レターパック','切手','ヤマト','ゆうパック','速達','宅急便','高速','交通費','ガソリン','実費'],\n    service:['報酬','顧問料','作成','代行','提出手数料','加算','着手金','中間金','精算金','外注','訪問','指導','業務委託','制作','設計','工事'],\n    passthru:['印紙','証紙','立替','ナンバー代','登録免許税','重量税','自動車税','取得手数料','発行手数料','取得費','証明書','住民票','謄本','登記','納税証明','戸籍','為替','法定費用']\n  },\n  qualified:['通信費','水道光熱費','新聞図書費','消耗品費','支払手数料','旅費交通費','車両費','事務用品費'],\n  individual:['販売促進費','外注費','支払報酬','支払報酬料','紹介料','地代家賃'],\n  master:['# 勘定科目 | 想定する税区分',\n    '売上高 | 課税売上','売上 | 課税売上','役務収益 | 課税売上',\n    '仕入高 | 課税仕入','外注費 | 課税仕入','広告宣伝費 | 課税仕入','通信費 | 課税仕入','消耗品費 | 課税仕入','事務用品費 | 課税仕入',\n    '支払手数料 | 課税仕入','車両費 | 課税仕入','旅費交通費 | 課税仕入','会議費 | 課税仕入','接待交際費 | 課税仕入','交際費 | 課税仕入',\n    '水道光熱費 | 課税仕入','修繕費 | 課税仕入','荷造運賃 | 課税仕入','新聞図書費 | 課税仕入','研修費 | 課税仕入','支払報酬 | 課税仕入',\n    '支払報酬料 | 課税仕入','販売促進費 | 課税仕入','賃借料 | 課税仕入','リース料 | 課税仕入','燃料費 | 課税仕入','雑費 | 課税仕入',\n    '給料手当 | 対象外非課税','給与手当 | 対象外非課税','役員報酬 | 対象外非課税','賞与 | 対象外非課税','法定福利費 | 対象外非課税',\n    '租税公課 | 対象外非課税','減価償却費 | 対象外非課税','支払利息 | 対象外非課税','保険料 | 対象外非課税','寄付金 | 対象外非課税',\n    '受取利息 | 対象外非課税','受取配当金 | 対象外非課税'].join('\\n')\n};\nconst LV={3:'高',2:'中',1:'低'};\nconst CATN={discount:'割引・値引',shipping:'送料・実費',service:'報酬・役務',passthru:'立替・公的手数料',none:'摘要から判別できず'};\nconst ASK={discount:'割引の対象になった売上（仕入）の税区分を請求書で確認',shipping:'実費精算の立替か、報酬に含めた請求かを請求書で確認',service:'報酬（役務の対価）か立替金かを請求書・契約書で確認',passthru:'立替金（印紙・証紙・公的手数料など）であることを領収書で確認',none:'取引内容を請求書・領収書で確認'};\nconst CORR=/税区分.{0,3}(修正|変更|訂正|振替)|区分修正/;\nconst RE_SUSPENSE=/立替|仮払|仮受|預り|未決済|未確定|仮勘定/;\nconst RE_BS=/現金|預金|売掛|未収|前払|仮払|立替|貸付|棚卸資産|^商品$|^製品$|原材料|貯蔵品|車両運搬具|工具器具|器具備品|建物|構築物|機械装置|土地|借地権|ソフトウェア|一括償却資産|敷金|保証金|差入|出資金|有価証券|買掛|未払|前受|預り|仮受|借入|元入|事業主|資本金|繰越|引当金|累計額|カード|口座|銀行|信金|信用金庫|ペイ|未決済|仮勘定|消費税|^損益$/;\nconst RE_PL=/費|料|売上|収入|収益|利息|配当|手当|報酬|賞与|仕入|損$|益$|会費|賃|公課|寄付|雑|割引|値引|棚卸高/;\nconst RE_DEPOSIT=/敷金|保証金|差入|前払/;\nconst RE_OWNER=/事業主貸|事業主借/;\nconst RE_NONTAX=/土地|有価証券|借地権/;\nconst JSTORE='kubun-kenin-judge-v1';\nconst RE_FIXED=/車両運搬具|工具器具備品|建物|機械装置|ソフトウェア|構築物|一括償却資産|器具備品/;\n\nlet cfg=loadCfg(), files=[], isSample=false, R=null, sel=null, pressed=false, mxFilter='all', curCo=null, judge={};\nfunction loadJudge(){ try{ return JSON.parse(localStorage.getItem(JSTORE+':'+(curCo||'_'))||'{}')||{}; }catch(e){ return {}; } }\nfunction saveJudge(){ try{ localStorage.setItem(JSTORE+':'+(curCo||'_'),JSON.stringify(judge)); }catch(e){} }\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst yen=n=>Math.round(n).toLocaleString('ja-JP');\n\nfunction loadCfg(){\n  let s=null; try{ s=JSON.parse(localStorage.getItem(STORE)||'null'); }catch(e){}\n  const d=JSON.parse(JSON.stringify(DEF)); d.fromM=null; d.toM=null;\n  if(!s) return d;\n  return Object.assign(d,{threshold:typeof s.threshold==='number'?s.threshold:d.threshold,kw:Object.assign(d.kw,s.kw||{}),\n    qualified:s.qualified||d.qualified,individual:s.individual||d.individual,master:s.master||d.master,fromM:s.fromM||null,toM:s.toM||null});\n}\nfunction saveCfg(){ try{ localStorage.setItem(STORE,JSON.stringify(cfg)); }catch(e){} }\n\n/* ---------- parsing ---------- */\nfunction decode(buf){ try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^﻿/,''); }catch(e){ return new TextDecoder('shift_jis').decode(buf); } }\nfunction parseCSV(t){ const rows=[]; let row=[],f='',q=false;\n  for(let i=0;i<t.length;i++){ const c=t[i];\n    if(q){ if(c==='\"'){ if(t[i+1]==='\"'){f+='\"';i++;} else q=false; } else f+=c; }\n    else if(c==='\"') q=true; else if(c===','){row.push(f);f='';} else if(c==='\\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\\r') f+=c; }\n  if(f!==''||row.length){row.push(f);rows.push(row);} return rows; }\nconst num=s=>{ const n=Number(String(s==null?'':s).replace(/[,，¥\\\\円\\s]/g,'')); return isFinite(n)?n:0; };\nfunction normDate(s){ const m=String(s||'').trim().match(/^(\\d{4})[-\\/.年](\\d{1,2})[-\\/.月](\\d{1,2})/); return m? m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0') : null; }\nconst DATEK=['取引日','日付','発生日','取引日付','伝票日付'];\nfunction filePeriod(name){ const m=name.match(/(\\d{4})年(\\d{2})月(\\d{2})日[_~〜～-](\\d{4})年(\\d{2})月(\\d{2})日/); return m? {from:m[1]+'-'+m[2],to:m[4]+'-'+m[5]} : null; }\nfunction parseFile(name,text){\n  const rows=parseCSV(text); let h=null,kind=null,titleAcc=null; const lines=[],kubun=[]; let curTax='';\n  for(const r of rows){\n    if(r.length<=2 && /総勘定元帳/.test(r[0]||'')){ const a=(r[0]||'').match(/総勘定元帳\\s*[:：]\\s*(.+?)\\s*[（(]/); titleAcc=a?a[1].trim():null; continue; }\n    const hasDate=DATEK.some(k=>r.includes(k));\n    if(!hasDate && r.includes('税区分') && (r.includes('勘定科目名')||r.includes('勘定科目')) && r.includes('借方金額')){ h=idx(r); kind='kubun'; continue; }\n    if(hasDate && (r.includes('税区分')||r.includes('借方税区分'))){ h=idx(r); kind=('借方勘定科目' in h)?'journal':'ledger'; continue; }\n    if(!h) continue;\n    const g=k=>(k in h)?(r[h[k]]||'').trim():'';\n    if(kind==='kubun'){\n      const acc=g('勘定科目名')||g('勘定科目'); if(g('税区分')) curTax=g('税区分');\n      if(!acc||!curTax) continue; kubun.push({tax:curTax,account:acc,dr:num(g('借方金額')),cr:num(g('貸方金額'))}); continue;\n    }\n    const date=normDate(DATEK.map(g).find(Boolean)); if(!date) continue;\n    if(kind==='ledger'){\n      lines.push({date,account:g('勘定科目')||titleAcc||'(不明)',tax:g('税区分')||'(税区分なし)',counter:g('相手勘定科目'),partner:g('取引先'),\n        memo:[...new Set([g('摘要'),g('備考'),g('品目'),g('メモタグ'),g('取引内容'),g('発行元')].map(v=>String(v||'').replace(/[\\s\\u3000]+/g,' ').trim()).filter(Boolean))].join('｜'),cmemo:g('相手備考'),dr:num(g('借方金額')),cr:num(g('貸方金額')),ref:g('管理番号'),file:name});\n    }else{\n      for(const sd of ['借方','貸方']){\n        const acc=g(sd+'勘定科目'); if(!acc) continue; const ot=sd==='借方'?'貸方':'借方'; const amt=num(g(sd+'金額'));\n        // freeeの仕訳帳には「摘要」列がないことが多いので、備考・品目・メモ・取引内容（明細の文言）・発行元をつないで取引の内容とする\n        const cl=v=>String(v||'').replace(/[\\s\\u3000]+/g,' ').trim();\n        const main=[g('摘要'),g(sd+'備考'),g(ot+'備考'),g(sd+'品目'),g(ot+'品目'),g(sd+'メモ'),g(sd+'メモタグ')].map(cl).filter(Boolean);\n        const sub=[g('取引内容'),g('発行元')].map(cl).filter(Boolean);\n        const parts=[...new Set([...main,...sub])];\n        // 同じ行に並んだ相手側の備考は別の明細のことがあるので、「課税」「割引」などの判定には自分の側の文言を使う（自分の側に何も無いときだけ相手側の文言で判定）\n        const ownMain=[g('摘要'),g(sd+'備考'),g(sd+'品目'),g(sd+'メモ'),g(sd+'メモタグ')].map(cl).filter(Boolean);\n        lines.push({date,account:acc,tax:g(sd+'税区分')||'(税区分なし)',counter:g(ot+'勘定科目'),partner:g(sd+'取引先')||g(sd+'取引先名')||g(ot+'取引先名')||cl(g('発行元')),\n          memo:parts.join('｜'),own:ownMain.length?[...new Set([...ownMain,...sub])].join('｜'):'',cmemo:'',dr:sd==='借方'?amt:0,cr:sd==='貸方'?amt:0,ref:g('伝票番号')||g('仕訳ID')||g('取引ID')||g('管理番号'),file:name});\n      }\n    }\n  }\n  return {name,kind,lines,kubun,period:filePeriod(name)};\n  function idx(r){ const o={}; r.forEach((c,i)=>{ c=c.trim(); if(!(c in o)) o[c]=i; }); return o; }\n}\n\n/* ---------- classification ---------- */\nfunction taxClass(t){ t=t||''; if(/対象外|不課税|税区分なし/.test(t)) return '対象外'; if(/非課/.test(t)) return '非課税'; if(/輸出|免税/.test(t)) return '免税';\n  if(/課税売上|課売|課税売/.test(t)) return '課税売上'; if(/仕入|課仕/.test(t)) return '課税仕入'; return 'その他'; }\nconst isKeika=t=>/控\\s*[3-8]0|控除\\s*[3-8]0|経過措置/.test(t||'');\nfunction taxRank(t){ const c=taxClass(t); return ({'課税売上':1,'免税':2,'非課税':3,'課税仕入':4,'対象外':6,'その他':7}[c]||9)+(isKeika(t)?.5:0)+(c==='非課税'&&/仕入/.test(t)?2:0); }\nfunction normKey(s){ const k=(s||'').replace(/[（(][^）)]*[）)]/g,'').replace(/[【\\[][^】\\]]*[】\\]]/g,'').replace(/[0-9０-９,，.@＠×円台枚通件分%％~〜～:：\\/／・、\\s　]/g,'').replace(/(非課税|不課税|課税)$/,''); return k||'（摘要なし）'; }\nfunction kwCat(t){ t=t||''; for(const c of ['discount','shipping','service','passthru']) if(cfg.kw[c].some(w=>w&&t.includes(w))) return c; return 'none'; }\nlet _mk=null,_mv=null;\nfunction master(){ if(_mk===cfg.master) return _mv; const m=new Map(); for(const raw of cfg.master.split('\\n')){ const l=raw.trim(); if(!l||l[0]==='#') continue; const [a,e]=l.split('|').map(s=>(s||'').trim()); if(!a||!e) continue;\n  m.set(a, /^BS$|資産|負債/i.test(e)?'BS':/売上/.test(e)?'課税売上':/仕入/.test(e)?'課税仕入':/対象外|非課税/.test(e)?'対象外非課税':null); } _mk=cfg.master; _mv=m; return m; }\nfunction isBS(acc){ const e=master().get(acc); if(e==='BS') return true; if(e) return false; if(/棚卸高|仕入高/.test(acc)) return false; if(RE_BS.test(acc)) return true; if(RE_PL.test(acc)) return false; return true; }\n// 対象外が普通で、課税かどうかは同じ仕訳の相手側（売上・費用の各行）で決まるBS科目（立替・仮払・売掛・買掛・預金・カードなど）。\n// 固定資産・土地や有価証券・敷金や前払・事業主貸借は、科目そのものに消費税の論点があるので除く。\nconst isClearing=acc=>isBS(acc)&&!RE_FIXED.test(acc)&&!RE_NONTAX.test(acc)&&!RE_DEPOSIT.test(acc)&&!RE_OWNER.test(acc);\nconst ym=d=>d.slice(0,7);\nfunction addM(s,n){ let [y,m]=s.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }\nconst jpYM=s=>{ const [y,m]=s.split('-'); return `${y}年${+m}月`; };\nconst mdJP=d=>{ const [,m,dd]=d.split('-'); return `${+m}/${+dd}`; };\n\n/* ---------- 同じ仕訳の行（相手側の内訳） ----------\n   売掛金・預金などBSの科目は代金の受け皿なので、課税かどうかは同じ仕訳の相手側（売上・費用の各行）に付く。\n   仕訳帳は仕訳IDで、元帳は管理番号＋日付で同じ仕訳の行を集める。見つからなければ「判断できない」とする。 */\nfunction buildRefIndex(fs){ const idx=new Map();\n  for(const f of fs){ if(f.kind!=='journal'&&f.kind!=='ledger') continue;\n    for(const x of f.lines){ if(!x.ref) continue; const k=x.ref+'\\u241E'+x.date; let e=idx.get(k); if(!e){ e=new Map(); idx.set(k,e); } let a=e.get(f); if(!a){ a=[]; e.set(f,a); } a.push(x); } }\n  return idx; }\nfunction refGroup(idx,l){ const e=idx.get(l.ref+'\\u241E'+l.date); if(!e) return null;\n  let best=null; for(const [f,a] of e) if(f.kind==='journal'&&a.includes(l)) best=a;           // 仕訳帳：その行があるファイルの仕訳をそのまま使う\n  if(!best) for(const [f,a] of e) if(f.kind==='journal'&&(!best||a.length>best.length)) best=a;\n  if(best) return best;\n  const byAcc=new Map(); for(const [,a] of e){ const m=new Map(); a.forEach(x=>{ const g=m.get(x.account)||[]; g.push(x); m.set(x.account,g); });   // 元帳：科目ごとに1ファイル分を合わせる\n    for(const [acc,g] of m){ const c=byAcc.get(acc); if(!c||g.length>c.length||(g.includes(l)&&g.length===c.length)) byAcc.set(acc,g); } }\n  return [...byAcc.values()].flat(); }\nconst shortMemo=x=>{ const t=(x.own||x.memo||x.cmemo||'').split('｜')[0].replace(/[\\s\\u3000]+/g,' ').trim(); return t.length>22?t.slice(0,21)+'…':t; };\nfunction sibInfo(idx,l){\n  if(!l.ref) return {state:'noref'};\n  const g=refGroup(idx,l); if(!g) return {state:'none'};\n  const others=g.filter(x=>x!==l);\n  if(others.length===g.length){ const sg=x=>[x.account,x.tax,x.dr,x.cr,x.memo].join('|'); const i=others.findIndex(x=>sg(x)===sg(l)); if(i>=0) others.splice(i,1); }\n  if(!others.length) return {state:'none'};\n  const sd=sideOf(l), amt=Math.round(l.dr||l.cr);\n  const items=others.map(o=>({o,sign:sideOf(o)===sd?-1:1,v:Math.round(o.dr||o.cr),cls:/仮受消費税|仮払消費税/.test(o.account)?'消費税':taxClass(o.tax)}));\n  const by=new Map(); items.forEach(it=>{ const k=it.cls==='消費税'?it.o.account:it.o.tax; const a=by.get(k)||{tax:k,cls:it.cls,v:0,n:0,items:[]}; a.v+=it.sign*it.v; a.n++; a.items.push(it); by.set(k,a); });\n  const net=items.reduce((t,it)=>t+it.sign*it.v,0);\n  const groups=[...by.values()].sort((a,b)=>taxRank(a.tax)-taxRank(b.tax)||b.v-a.v);\n  return {state:'ok',items,groups,net,amt,complete:Math.abs(net-amt)<=1,hasTax:groups.some(gp=>gp.cls==='課税売上'||gp.cls==='課税仕入'),\n    accs:[...new Set(items.filter(it=>!isBS(it.o.account)).map(it=>it.o.account))]}; }\nconst sgn=v=>(v<0?'▲':'')+yen(Math.abs(v));\nfunction sibText(si){ return si.groups.map(gp=>`${gp.tax} ${sgn(gp.v)}円（${gp.n}行${gp.n<=3?'：'+gp.items.map(it=>`${shortMemo(it.o)||it.o.account} ${sgn(it.sign*it.v)}円`).join('、'):''}）`).join('・'); }\n\n/* ---------- 仮修正案 ---------- */\nfunction mkDom(arr){ return (cls,acc,fb)=>{ let best=null,bv=-1; for(const c of arr){ if(taxClass(c.tax)!==cls||isKeika(c.tax)) continue; const v=Math.max(c.dr,c.cr)*(c.account===acc?1000:1); if(v>bv){bv=v;best=c.tax;} }\n  return best||fb||({'課税売上':'課税売上10%','課税仕入':'課対仕入10%','対象外':'対象外','非課税':'非課税売上'}[cls]); }; }\nfunction suggestFix(l,cls,exp,cat,text,pmTop,dom,x){\n  const acc=l.account, want=exp==='課税売上'?'課税売上':exp==='課税仕入'?'課税仕入':null, out={kind:'check',to:null,note:'',basis:''};\n  const set=(kind,to,note,basis)=>{ out.kind=kind; out.to=to; out.note=note; out.basis=basis||''; };\n  const m=text.match(/(非課税|不課税)/);\n  const matches=(want&&cls===want)||(exp==='対象外非課税'&&(cls==='対象外'||cls==='非課税'));\n  if(x.sibFix){ set(x.sibFix.kind,null,x.sibFix.note,x.sibFix.basis); out.label=x.sibFix.label; out.settle=true; return out; }\n  if(x.learn){ if(x.learn.to&&x.learn.to!==l.tax) set(x.learn.kind,x.learn.to,x.learn.note,x.learn.basis); else if(!x.learn.to) set('check',null,x.learn.note,x.learn.basis); }\n  if(!out.basis&&x.inv) set(x.inv.kind,x.inv.to,x.inv.note,x.inv.basis);\n  if(!out.basis&&x.bs){\n    if(RE_FIXED.test(acc)){\n      if(l.cr>0&&/売却|下取|譲渡/.test(text)&&cls!=='課税売上') set('check',dom('課税売上',acc),'売却額そのものが課税売上（帳簿価額との差額ではない）。freeeの固定資産の売却の処理に合わせて直す。','資産の売却');\n      else if(l.dr>0&&/購入|取得|納車|買/.test(text)&&cls==='対象外') set('check',dom('課税仕入',acc),`取得なら課税仕入（相手が登録なしなら${keikaFor(l.date)?'控'+keikaFor(l.date):'経過措置の対象外'}）。`,'資産の取得');\n      else if(cls==='課税売上') set('keep',null,'売却額を課税売上にしているなら正しい。金額が売却額か確認。','資産の売却');\n    } else if(RE_NONTAX.test(acc)&&(cls==='課税売上'||cls==='課税仕入')) set('change',dom('非課税',acc,l.cr>0?'非課売上':'非課仕入'),'土地・有価証券の譲渡や取得は非課税。','非課税の資産');\n    else if(RE_DEPOSIT.test(acc)&&l.dr>0&&/礼金|更新料/.test(text)&&cls==='対象外') set('check',dom('課税仕入',acc),'礼金・更新料など返ってこない部分は課税仕入。科目も支払手数料・地代家賃などに分ける案。','礼金・更新料');\n    else if(RE_DEPOSIT.test(acc)&&l.dr>0&&/礼金|更新料/.test(text)&&cls==='課税仕入') { set('check',null,'礼金・更新料は課税仕入で正しい。ただ返ってこないお金なので、敷金ではなく支払手数料など（金額によっては長期前払費用）に振り替える案。税区分は変えない。','礼金・更新料'); out.label='税区分はそのまま／科目を振り替える案'; }\n    else if(RE_OWNER.test(acc)&&/家事消費|自家消費/.test(text)&&cls==='対象外') set('check',dom('課税売上',acc),'家事消費は課税売上として計上する案（仕入価額以上の金額で）。','家事消費');\n    else if(cls==='課税売上'&&/売却|譲渡|下取/.test(text)) set('keep',null,'事業用の資産を売った代金なら課税売上で正しい（簡易課税なら第四種）。売った資産の帳簿上の減少（固定資産の貸方）と金額・日付が合っているか確認。','資産の売却');\n    else if(cls==='課税売上'||cls==='課税仕入'||cls==='非課税') set('check',dom('対象外',acc),'BS科目は通常対象外。課税・非課税の取引なら、費用・収益の科目に分けて処理する案。','BS科目に課税区分');\n  }\n  if(out.basis){} else if(m&&(cls==='課税売上'||cls==='課税仕入')) set('change',m[1]==='不課税'?dom('対象外',acc):dom('非課税',acc,cls==='課税売上'?'非課税売上':'非課税仕入'),`摘要に「${m[1]}」とあるため、その区分に合わせる案。請求書で課税・非課税・不課税を確認してから決める。`,'摘要の語句');\n  else if(/(^|[^非不])課税/.test(text)&&(cls==='対象外'||cls==='非課税')&&x.bs&&!RE_FIXED.test(acc)) set('unknown',null,`${acc}はBSの科目なので、ここで課税に直す案は出しません。課税かどうかは同じ仕訳の相手側の行で確認してください。`,'判断できません');\n  else if(/(^|[^非不])課税/.test(text)&&(cls==='対象外'||cls==='非課税')) set('check',want?dom(want,acc):(l.cr>0?dom('課税売上',acc):dom('課税仕入',acc)),'摘要に「課税」とあるため、課税に直す案。請求書で確認。','摘要の語句');\n  else if(want&&!matches&&['対象外','非課税','課税売上','課税仕入'].includes(cls)){\n    if(cat==='passthru'&&cls==='対象外') set('keep',null,'立替金の精算なら対象外のままで正しい。報酬や手数料を含む請求なら、分けて課税売上にする。','摘要が立替・公的手数料');\n    else if(cat==='shipping'&&cls==='対象外') set('check',dom(want,acc),'お客様名義の領収書がある実費の立替精算なら対象外のまま。自社が請求する送料なら課税売上10%に直す。','摘要が送料・実費');\n    else if(cat==='discount') set('change',dom(want,acc),'値引・割引は、元の売上（仕入）と同じ税区分に揃える案。元が課税なら課税の借方（貸方）で処理する。','摘要が割引・値引');\n    else if(cat==='service') set('change',dom(want,acc),'報酬・役務の対価は課税。源泉所得税が引かれていても、税込の報酬額で課税売上にする。','摘要が報酬・役務');\n    else set('check',dom(want,acc),'資料で取引内容を確かめたうえで、この科目の想定どおりに直す案。','科目の想定税区分');\n  }\n  else if(exp==='対象外非課税'&&(cls==='課税売上'||cls==='課税仕入')) set('check',dom('対象外',acc),'本当に課税取引か確認。保険料・租税公課・給与などは対象外が原則。','科目の想定税区分');\n  else if(want==='課税売上'&&cls==='課税売上'&&l.dr>0){\n    if(cat==='discount') set('keep',null,'売上値引・返品・返金の借方。課税売上10%のままで正しい。元の売上と税率が同じか確認。','借方の課税売上');\n    else set('check',null,'売上の取消・返金か、区分の誤りかを確認。元の売上と同じ税区分に揃える。','借方の課税売上'); }\n  else if(cls==='課税仕入'&&(x.mix||isKeika(l.tax)||x.stdPrev)){\n    if(isKeika(l.tax)&&(x.mix||x.stdPrev)) set('check',dom('課税仕入',acc),`請求書に登録番号（T＋13桁）があれば通常の課対仕入に直す案。なければ経過措置（この取引日は${keikaFor(l.date)?'控'+keikaFor(l.date):'経過措置の期間外'}）のまま。`,'経過措置と通常の混在');\n    else if(isKeika(l.tax)) set('keep',null,`登録のない事業者からの仕入なら経過措置（この取引日は${keikaFor(l.date)?'控'+keikaFor(l.date):'経過措置の期間外'}）で正しい。登録番号の有無を請求書で確認。`,'経過措置');\n    else set('check',null,'同じ取引先に経過措置（控80・控70）の取引もある。登録番号の有無で区分を揃える。','経過措置と通常の混在'); }\n  if(pmTop&&pmTop!==l.tax){\n    if(out.kind==='keep'||matches||(out.to&&out.to!==pmTop)) out.note+=` 前期の同じ摘要は「${pmTop}」。`+(matches?'当期は科目の想定どおりなので、前期が誤りで後から直した可能性がある。':'');\n    else if(!out.to) set('check',pmTop,'前期の同じ摘要の税区分に合わせる案。前期が正しかったか資料で確認。','前期の同じ摘要'); }\n  else if(matches&&!out.to&&out.kind==='check'&&!out.note) set('keep',null,'科目の想定どおり。取引内容だけ確認。','');\n  if(!out.note) out.note='資料で取引内容を確認。';\n  if(out.to&&out.to!==l.tax){ const side=l.dr>0?'dr':'cr', amt=l.dr||l.cr;\n    out.j=side==='cr'?{dr:[acc,l.tax,amt],cr:[acc,out.to,amt]}:{dr:[acc,out.to,amt],cr:[acc,l.tax,amt]}; }\n  else if(out.to===l.tax) out.to=null;\n  return out;\n}\nconst FXN={change:'変更案',check:'要確認',keep:'変更なし見込み',unknown:'判断できません'};\n\n/* ---------- analysis ---------- */\nfunction analyze(){\n  const lines=files.flatMap(f=>f.lines); const kfiles=files.filter(f=>f.kind==='kubun');\n  if(!lines.length && !kfiles.length) return null;\n  const from=$('fy').value+'-'+$('fm').value, to=$('ty').value+'-'+$('tm').value, pFrom=addM(from,-12), pTo=addM(from,-1);\n  const cur=[],prev=[]; let outside=0;\n  for(const l of lines){ const m=ym(l.date); if(m>=from&&m<=to) cur.push(l); else if(m>=pFrom&&m<=pTo) prev.push(l); else outside++; }\n  const M=master(), thr=cfg.threshold, notes=[];\n  const hasLines=cur.length>0;\n\n  // cells\n  const cells=new Map(), pcells=new Map();\n  const put=(map,tax,acc,dr,cr,n)=>{ const k=tax+'\\u241E'+acc; if(!map.has(k)) map.set(k,{tax,account:acc,dr:0,cr:0,n:0}); const o=map.get(k); o.dr+=dr; o.cr+=cr; o.n+=n; };\n  let source='lines';\n  const sFrom=addM(from,-12), sTo=addM(to,-12);\n  if(hasLines||!kfiles.length){ cur.forEach(l=>put(cells,l.tax,l.account,l.dr,l.cr,1)); prev.filter(l=>{const m=ym(l.date); return m>=sFrom&&m<=sTo;}).forEach(l=>put(pcells,l.tax,l.account,l.dr,l.cr,1));\n    if(!hasLines) notes.push({lv:'hi',t:'対象期間に仕訳がありません',b:`対象期間（${from}〜${to}）に入る仕訳がありません。「01 取込」の対象期間と、読み込んだCSVの期間を確認してください。`}); }\n  else {\n    source='kubun';\n    const sorted=kfiles.slice().sort((a,b)=>((b.period&&b.period.from)||'').localeCompare((a.period&&a.period.from)||''));\n    sorted[0].kubun.forEach(k=>put(cells,k.tax,k.account,k.dr,k.cr,0));\n    if(sorted[1]) sorted[1].kubun.forEach(k=>put(pcells,k.tax,k.account,k.dr,k.cr,0));\n    const p=sorted[0].period;\n    notes.push({lv:'info',t:'区分別表だけで判定しています',b:`取引ごとの確認には仕訳帳CSVが必要です。${p?`区分別表の期間は ${p.from}〜${p.to} です。`:''}`});\n  }\n  // tie-out with kubun file\n  if(hasLines && kfiles.length){\n    for(const kf of kfiles){\n      const km=new Map(); kf.kubun.forEach(k=>put(km,k.tax,k.account,k.dr,k.cr,0));\n      let bad=0,checked=0; const badList=[];\n      for(const [k,o] of km){ const c=cells.get(k)||{dr:0,cr:0}; checked++; if(Math.abs(c.dr-o.dr)>0.5||Math.abs(c.cr-o.cr)>0.5){ bad++; if(badList.length<4) badList.push(`${o.tax}×${o.account}`); } }\n      const pp=kf.period?`（区分別表の期間 ${kf.period.from}〜${kf.period. 減価償却だけか、売却・除却を含むか。売却なら課税売上');\n      if(c.dr>=thr&&cls==='対象外') up(2,'資産の増加が対象外。取得なら課税仕入の可能性');\n    }\n    if(isKeika(c.tax)&&c.dr>=thr/2){ const tot=(std.get(c.account)||0)+(kei.get(c.account)||0); const share=tot?c.dr/tot:1;\n      if(cfg.qualified.includes(c.account)||share>=0.5) up(2,`経過措置（控80・控70）が${Math.round(share*100)}%。適格請求書発行事業者の取引が混ざっていないか`); else up(1,`経過措置（控80・控70）が${Math.round(share*100)}%`); }\n    if(cls==='課税仕入'&&!isKeika(c.tax)&&cfg.individual.includes(c.account)&&c.dr>=thr) up(1,'個人への支払いが多い科目。取引先が適格か確認');\n    if(INV.method==='simple'&&cls==='課税売上'&&!RE_KIND.test(c.tax)&&big>0) up(2,'簡易課税なのに事業区分（第一〜六種）のない課税売上の税区分');\n    if(isKeika(c.tax)&&keikaRate(c.tax)&&hasLines&&(txByCell.get(k)||[]).some(t=>keikaFor(t.l.date)&&keikaRate(c.tax)!==keikaFor(t.l.date))){ const bad=(txByCell.get(k)||[]).find(t=>keikaFor(t.l.date)&&keikaRate(c.tax)!==keikaFor(t.l.date)); up(2,`取引日と経過措置の割合が合わない取引がある（${bad.l.date}は控${keikaFor(bad.l.date)}）`); }\n    if(pcells.size){ const p=pcells.get(k);\n      if(!p&&big>=thr/10&&(exp||cls!=='対象外')) up(1,'前期同期間にない組み合わせ');\n      else if(p){ const pb=Math.max(p.dr,p.cr); if(Math.abs(big-pb)>=thr&&(big>=pb*2||big<=pb*0.5)) up(1,`前期同期間から大きく増減（前期 ${yen(pb)}円）`); } }\n    const ts=(txByCell.get(k)||[]).filter(t=>t.lv>0); const tmax=ts.reduce((m,t)=>Math.max(m,t.lv),0);\n    if(ts.length){ rs.push(`取引の候補 ${ts.length}件（最大 ${LV[tmax]}）`); if(lv>0||tmax>=2) lv=Math.max(lv,tmax); }\n    if(lv>0&&lv<3&&big>=thr*10&&rs.length>1){ lv++; }\n    if(INV.purchaseLight&&lv>1&&cls==='課税仕入'){ lv=1; rs.push(`${METHODN[INV.method]}のため仕入側の区分は納税額に影響しない（参考）`); }\n    if(lv>0) sus.push({k,cell:c,lv,reasons:rs,txFlag:ts.length});\n  }\n  sus.sort((a,b)=>b.lv-a.lv||Math.max(b.cell.dr,b.cell.cr)-Math.max(a.cell.dr,a.cell.cr));\n  if(skew.length) notes.push({lv:'info',t:`仮勘定・立替の残高が片側に偏っています：${skew.slice(0,4).join('、')}${skew.length>4?` ほか${skew.length-4}件`:''}`,b:'消費税区分とは別の論点なので、違和感の組み合わせには入れていません。精算漏れや期末の振替（個人事業主なら元入金への振替）を確認してください。'});\n  const mPrev=evPrev.filter(e=>e.status==='matched'&&e.conf!=='low').length;\n  if(evPrev.length) notes.unshift({lv:'lrn',t:`前期の「消費税区分修正」${evPrev.length}件のうち${mPrev}件で、元の取引を推定しました`,b:mPrev?`今期の同じ摘要・同じ種類の取引 ${nLearn}件に【学習】の印を付けています。05 学習で推定の中身を確認してください（推定なので要確認）。`:'元の取引を特定できませんでした。仕訳帳（全税区分）を入れると推定しやすくなります。05 学習で中身を確認できます。'});\n  if(fixedCur.size) notes.push({lv:'ok',t:`当期の消費税区分修正で直し済みと推定した取引が${fixedCur.size}件あります`,b:'これらは候補から外しています。04 学習で確認できます。'});\n  if(INV.methodSrc==='データから推定') notes.push({lv:'info',t:'簡易課税の会社として判定しています',b:'税区分に事業区分（課売上四など）があるためです。違う場合は「04 インボイス」で課税方式を設定してください。簡易課税では仕入側の区分は納税額に影響しないので、仕入側の指摘は参考に下げています。'});\n  if(hasLines&&INV.small==='unknown'&&!INV.purchaseLight&&cur.some(l=>isKeika(l.tax)&&l.dr>0&&INV.gamt(l)<10000)) notes.push({lv:'info',t:'少額特例が使えるかが未設定です',b:'税込1万円未満の経過措置（控80・控70）の仕入があります。この会社が少額特例を使えるか（基準期間の課税売上高1億円以下など）を「04 インボイス」で設定すると、判定がはっきりします。'});\n  return {inv:INV,from,to,pFrom,pTo,sFrom,sTo,cur,prev,cells,pcells,sus,tx,txByCell,notes,source,hasLines,learn:{evPrev,evCur,pats,nLearn,fixed:fixedCur.size}};\n}\n\n\n/* ---------- 学習①：消費税区分修正の仕訳から、元の取引を推定する ---------- */\nconst sideOf=l=>l.dr>0?'dr':'cr';\nconst amtOf=l=>Math.round(l.dr||l.cr);\nconst isCorr=l=>CORR.test(l.memo||'')||CORR.test(l.cmemo||'');\nconst CATP={service:5,none:4,shipping:3,discount:2,passthru:1};\nfunction subsetPick(items,X){\n  const n=items.length, W=(X>>5)+1; const R=new Array(n+1); R[n]=new Uint32Array(W); R[n][0]=1;\n  for(let i=n-1;i>=0;i--){ const a=items[i].v, src=R[i+1], dst=src.slice();\n    if(a<=X){ const ws=a>>5, bs=a&31; for(let w=W-1;w>=ws;w--){ let v=src[w-ws]<<bs; if(bs&&w-ws-1>=0) v|=src[w-ws-1]>>>(32-bs); dst[w]|=v; } }\n    R[i]=dst; }\n  const has=(r,s)=>(r[s>>5]>>>(s&31))&1;\n  if(!has(R[0],X)) return null;\n  const pick=[]; let s=X;\n  for(let i=0;i<n&&s>0;i++){ const a=items[i].v; if(a<=s&&has(R[i+1],s-a)){ pick.push(items[i]); s-=a; } }\n  return pick;\n}\nfunction countWays(items,X){ const w=new Uint8Array(X+1); w[0]=1; for(const it of items){ const a=it.v; for(let s=X;s>=a;s--){ const t=w[s]+w[s-a]; w[s]=t>2?2:t; } } return w[X]; }\nfunction matchSet(cands,X,toCls){\n  if(!cands.length||X<=0) return null;\n  const pr=c=>toCls==='対象外'||toCls==='非課税'?({passthru:5,shipping:4,none:3,discount:2,service:1}[c]):CATP[c];\n  // 立替・公的手数料が課税に、報酬・役務が対象外に直ることは考えにくいので、候補から外す\n  const bad=/課税/.test(toCls)?'passthru':(toCls==='対象外'||toCls==='非課税')?'service':null;\n  const it=cands.map(l=>({l,v:amtOf(l),c:kwCat(l.own||l.memo||l.cmemo)})).filter(x=>x.v>0&&x.c!==bad);\n  // 1. 同じ金額の取引\n  const ex=it.filter(x=>x.v===X);\n  if(ex.length===1) return {lines:[ex[0].l],method:'同じ金額の取引',conf:'high'};\n  if(ex.length>1){ ex.sort((a,b)=>pr(b.c)-pr(a.c)); return {lines:[ex[0].l],method:`同じ金額の取引（${ex.length}件のうち1件）`,conf:'mid'}; }\n  // 2. 同じ取引先の合計\n  const byP=new Map(); it.forEach(x=>{ if(!x.l.partner) return; const a=byP.get(x.l.partner)||[]; a.push(x); byP.set(x.l.partner,a); });\n  const pm=[...byP.values()].filter(g=>g.length>1&&g.reduce((s,x)=>s+x.v,0)===X);\n  if(pm.length===1) return {lines:pm[0].map(x=>x.l),method:'同じ取引先の合計',conf:'high'};\n  // 3. 同じ摘要の合計\n  const byK=new Map(); it.forEach(x=>{ const k=normKey(x.l.memo||x.l.cmemo); const a=byK.get(k)||[]; a.push(x); byK.set(k,a); });\n  const km=[...byK.values()].filter(g=>g.length>1&&g.reduce((s,x)=>s+x.v,0)===X);\n  if(km.length===1) return {lines:km[0].map(x=>x.l),method:'同じ摘要の合計',conf:'high'};\n  // 4. 摘要の種類ごとの合計（組み合わせ）\n  const byC=new Map(); it.forEach(x=>{ const a=byC.get(x.c)||[]; a.push(x); byC.set(x.c,a); });\n  const cs=[...byC.keys()], hits=[];\n  for(let m=1;m<(1<<cs.length);m++){ let s=0; const g=[]; cs.forEach((c,i)=>{ if(m&(1<<i)){ s+=byC.get(c).reduce((t,x)=>t+x.v,0); g.push(c); } }); if(s===X) hits.push(g); }\n  if(hits.length===1&&hits[0].length<cs.length) return {lines:hits[0].flatMap(c=>byC.get(c).map(x=>x.l)),method:`摘要の種類の合計（${hits[0].map(c=>CATN[c]).join('＋')}）`,conf:'high'};\n  // 5. 金額の組み合わせ（部分和）\n  if(it.length<=70&&X<=1500000){\n    const ord=it.slice().sort((a,b)=>pr(b.c)-pr(a.c)||b.v-a.v);\n    const pick=subsetPick(ord,X);\n    if(pick&&pick.length){ const ways=X<=300000&&it.length<=60?countWays(ord,X):2;\n      const conf=ways===1&&pick.length<=6?'mid':'low';\n      return {lines:pick.map(x=>x.l),method:ways===1?`金額の組み合わせ（1通りだけ・${pick.length}件）`:`金額の組み合わせ（ほかの組み合わせもあり・${pick.length}件）`,conf}; }\n  }\n  return null;\n}\nfunction learnCorrections(lines,label){\n  const corr=lines.filter(isCorr), base=lines.filter(l=>!isCorr(l)), used=new Set(), evs=[];\n  const sorted=corr.slice().sort((a,b)=>a.date.localeCompare(b.date));\n  for(const a of sorted){ if(used.has(a)) continue; used.add(a);\n    const X=amtOf(a), sa=sideOf(a);\n    const b=sorted.find(x=>!used.has(x)&&x.account===a.account&&x.date===a.date&&amtOf(x)===X&&sideOf(x)!==sa&&x.tax!==a.tax&&(!a.ref||!x.ref||x.ref===a.ref));\n    if(b) used.add(b);\n    const ev={period:label,date:a.date,account:a.account,amt:X,a,b,memo:a.memo||a.cmemo,status:'none'};\n    // 仮説：元の取引は「反対側の行」の税区分で、その行と逆の側にある\n    const hyp=[];\n    if(b){ hyp.push({from:a.tax,to:b.tax,side:sideOf(b)}); hyp.push({from:b.tax,to:a.tax,side:sa}); }\n    else hyp.push({from:a.tax,to:null,side:sa==='dr'?'cr':'dr'});\n    const M=ym(a.date);\n    let best=null;\n    for(const h of hyp){\n      const pool=base.filter(l=>l.account===a.account&&l.tax===h.from&&sideOf(l)===h.side&&l.date<=a.date);\n      const toCls=h.to?taxClass(h.to):(/対象外|非課税/.test(taxClass(h.from))?'課税':'対象外');\n      const windows=[pool.filter(l=>ym(l.date)===M), pool.filter(l=>ym(l.date)>=addM(M,-2))];\n      for(const w of windows){ const r=matchSet(w,X,toCls); if(r){ const sc={high:3,mid:2,low:1}[r.conf]; if(!best||sc>best.sc) best={...r,...h,sc}; break; } }\n      if(best&&best.sc===3) break;\n    }\n    if(best){ Object.assign(ev,{status:'matched',from:best.from,to:best.to,side:best.side,lines:best.lines,method:best.method,conf:best.conf}); }\n    else { Object.assign(ev,{from:hyp[0].from,to:hyp[0].to,side:hyp[0].side,lines:[],conf:'none',method:b?'金額の合う元の取引が見つかりませんでした':'このファイルには反対側の税区分の行がなく、元の取引を特定できません（仕訳帳＝全税区分を入れると推定しやすくなります）'}); }\n    evs.push(ev);\n  }\n  return evs;\n}\nfunction guessTo(from,acc,exp,dom){ const fc=taxClass(from);\n  if(fc==='対象外'||fc==='非課税'){ if(exp==='課税売上') return dom('課税売上',acc); if(exp==='課税仕入') return dom('課税仕入',acc); return null; }\n  return dom('対象外',acc); }\nfunction buildPatterns(evs){\n  const key=new Map(), cat=new Map();\n  for(const ev of evs){ if(ev.status!=='matched') continue;\n    const eff=ev.b?ev.conf:(ev.conf==='high'?'mid':ev.conf); // 反対側の行が見えない修正は確度を1段下げる\n    if(eff==='low') continue;\n    for(const l of ev.lines){ const side=sideOf(l), base=l.account+'|'+l.tax+'|'+side;\n      const add=(m,k,label)=>{ const o=m.get(k)||{account:l.account,from:l.tax,side,label,to:ev.to,n:0,evs:new Set(),samples:[],conf:'mid'}; o.n++; o.evs.add(ev); if(o.samples.length<3) o.samples.push(l); if(!o.to&&ev.to) o.to=ev.to; if(eff==='high') o.conf='high'; m.set(k,o); };\n      add(key,base+'|'+normKey(l.memo||l.cmemo),normKey(l.memo||l.cmemo));\n      const c=kwCat(l.own||l.memo||l.cmemo); if(c!=='none') add(cat,base+'|'+c,CATN[c]); } }\n  for(const [k,o] of cat) if(!(o.conf==='high'||o.evs.size>=2)) cat.delete(k); // 種類での当てはめは慎重に\n  return {key,cat};\n}\n\n/* ---------- 学習②：あなたの判断（このブラウザに保存。書き出して共有もできる） ---------- */\nconst LSTORE='kubun-kenin-learn-v1';\nlet memo=loadMemo();\nfunction loadMemo(){ try{ const m=JSON.parse(localStorage.getItem(LSTORE)||'null'); if(m&&m.rules) return m; }catch(e){} return {v:1,rules:{}}; }\nfunction saveMemo(){ try{ localStorage.setItem(LSTORE,JSON.stringify(memo)); }catch(e){} }\nconst rkOf=l=>l.account+'|'+l.tax+'|'+normKey(l.memo||l.cmemo);\nconst coRules=()=>Object.entries(memo.rules).filter(([,r])=>!r.cid||r.cid===curCo);\nfunction memoIndex(){ const m=new Map(); for(const [id,r] of coRules()){ const a=m.get(r.rk)||[]; a.push(Object.assign({id},r)); m.set(r.rk,a); } return m; }\nfunction memoUpdate(l,j){ const k=jkOf(l), rk=rkOf(l);\n  for(const [id,r] of coRules()) if(r.rk===rk){ r.tx=r.tx.filter(x=>x!==k); if(!r.tx.length) delete memo.rules[id]; }\n  if(j&&(j.v==='fix'||j.v==='ok')){ const id=(curCo||'_')+'|'+rk+'|'+j.v+'|'+(j.v==='fix'?(j.to||''):''); const r=memo.rules[id]||{cid:curCo,rk,account:l.account,tax:l.tax,key:normKey(l.memo||l.cmemo),act:j.v,to:j.v==='fix'?(j.to||''):'',tx:[]};\n    if(!r.tx.includes(k)) r.tx.push(k); r.last=new Date().toISOString().slice(0,10); memo.rules[id]=r; }\n  saveMemo(); }\nconst jkOf=l=>[l.account,l.tax,l.date,l.dr,l.cr,l.partner,(l.memo||l.cmemo)].join('|');\n\n/* ---------- 会社一覧（このブラウザに保存） ---------- */\nconst CSTORE='kubun-kenin-companies-v1';\nlet cos=loadCos(), coQ='', coF='all', coStaff='', coSort='updated', coEditId=null, coDelUndo=null;\nfunction loadCos(){ try{ const a=JSON.parse(localStorage.getItem(CSTORE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }\nfunction saveCos(){ try{ localStorage.setItem(CSTORE,JSON.stringify(cos)); }catch(e){} }\nconst coGet=id=>cos.find(c=>c.id===id);\nconst today=()=>new Date().toISOString().slice(0,10);\nconst newId=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nfunction coAdd(o){ const c={id:newId(),name:o.name.trim(),fyEnd:o.fyEnd||null,staff:(o.staff||'').trim(),memo:(o.memo||'').trim(),created:today(),updated:today(),stats:null,done:null}; cos.push(c); saveCos(); return c; }\nfunction ensureSample(){ let c=coGet('sample'); if(!c){ c={id:'sample',name:'サンプル商事（架空）',fyEnd:12,staff:'',memo:'操作を試すための架空の会社です',created:today(),updated:today(),stats:null,done:null,period:{fy:'2026',fm:'01',ty:'2026',tm:'06'}}; cos.unshift(c); saveCos(); } return c; }\nfunction coStatus(c){ if(c.done) return 'done'; const s=c.stats; if(!s||!s.nFiles) return 'todo'; if(s.cand&&s.judged>=s.cand) return 'judged'; return 'doing'; }\nconst STN={todo:'未着手',doing:'確認中',judged:'判断済み',done:'完了'};\n\n/* IndexedDB：会社ごとの取り込みCSV（原文）を保存。使えない環境ではこの画面を開いている間だけ保持 */\nconst MEMF=new Map();\nconst IDB={ db:null,\n  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open('kubun-kenin',1); r.onupgradeneeded=()=>r.result.createObjectStore('files'); r.onsuccess=()=>{ this.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },\n  async get(k){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const q=db.transaction('files').objectStore('files').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return MEMF.get(k); } },\n  async set(k,v){ MEMF.set(k,v); try{ const db=await this.open(); await new Promise((res,rej)=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); return true; }catch(e){ return false; } },\n  async del(k){ MEMF.delete(k); try{ const db=await this.open(); await new Promise((res,rej)=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').delete(k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} } };\nlet persistOK=true;\nasync function saveCoFiles(){ if(!curCo||curCo==='sample') return; const ok=await IDB.set(curCo,files.filter(f=>!f.sample).map(f=>({name:f.name,text:f.raw||''}))); persistOK=ok; renderSaveState(); }\nfunction renderSaveState(){ const el=$('saveState'); if(!el) return; el.textContent=curCo==='sample'?'サンプルは保存されません':persistOK?'このブラウザに自動保存':'この環境では保存できません（画面を閉じると消えます）'; el.className='savest '+(persistOK||curCo==='sample'?'':'ng'); }\n\n/* 画面の切り替え（#/ ＝ 会社一覧、#/c/ID ＝ 会社） */\nfunction route(){ const m=location.hash.match(/^#\\/c\\/([\\w-]+)/); if(m){ if(m[1]==='sample') ensureSample(); if(coGet(m[1])){ if(curCo!==m[1]) openCompany(m[1]); return; } } showHome(); }\nfunction go(h){ if(location.hash===h) route(); else location.hash=h; }\nfunction showHome(){ if(dw) dwClose(); curCo=null; files=[]; R=null; sel=null; document.body.classList.add('at-home'); document.body.classList.remove('at-co'); $('home').hidden=false; $('ws').hidden=true; renderHome(); window.scrollTo(0,0); document.title='消費税区分別チェッカー'; }\nasync function openCompany(id){\n  const c=coGet(id); if(!c){ showHome(); return; }\n  if(dw) dwClose(); curCo=id; judge=loadJudge(); sel=null; pressed=false; qtext=''; kfi=-1; onlyFlag=true; mxFilter='all';\n  document.body.classList.remove('at-home'); document.body.classList.add('at-co'); $('home').hidden=true; $('ws').hidden=false;\n  $('undo').hidden=true; document.title=c.name+'｜消費税区分別チェッカー';\n  if(id==='sample'){ files=sampleFiles(); isSample=true; }\n  else { isSample=false; const saved=await IDB.get(id); if(curCo!==id) return; files=(saved||[]).map(x=>Object.assign(parseFile(x.name,x.text),{raw:x.text})).filter(f=>f.lines.length||f.kubun.length); }\n  renderCoHead(); if(files.length) fillPeriod(); renderAll(); renderSaveState(); window.scrollTo(0,0);\n}\nfunction updateCoStats(){ const c=curCo&&coGet(curCo); if(!c) return;\n  const s={nFiles:files.length,hi:0,mid:0,cand:0,judged:0,fix:0,hold:0,learn:0,from:'',to:''};\n  if(R){ R.sus.forEach(x=>{ if(x.lv===3) s.hi++; else if(x.lv===2) s.mid++; }); const fl=R.tx.filter(t=>t.lv>0), jc=jcount(fl); s.cand=fl.length; s.judged=fl.length-jc.none; s.fix=jc.fix; s.hold=jc.hold; s.learn=R.learn?R.learn.nLearn:0; s.from=R.from; s.to=R.to; }\n  const before=JSON.stringify(c.stats); c.stats=s; if(before!==JSON.stringify(s)) c.updated=today(); saveCos(); renderCoHead(); }\nfunction savePeriod(){ const c=curCo&&coGet(curCo); if(!c) return; c.period={fy:$('fy').value,fm:$('fm').value,ty:$('ty').value,tm:$('tm').value}; saveCos(); }\n\n/* 会社の見出し（会社を開いているとき） */\nfunction renderCoHead(){ const c=curCo&&coGet(curCo); if(!c) return; const st=coStatus(c), s=c.stats||{};\n  $('coName').textContent=c.name;\n  $('coMeta').innerHTML=[c.fyEnd?`${c.fyEnd}月決算`:'決算月 未設定',c.staff?`担当 ${esc(c.staff)}`:'',s.from?`対象 ${s.from}〜${s.to}`:'',c.memo?esc(c.memo):''].filter(Boolean).map(x=>`<span>${x}<\/span>`).join('');\n  $('coStatus').className='stb '+st; $('coStatus').textContent=STN[st]+(c.done?`（${c.done}）`:'');\n  $('coDone').textContent=c.done?'完了を取り消す':'チェック完了にする';\n  $('coSwitch').innerHTML=cos.map(x=>`<option value=\"${esc(x.id)}\" ${x.id===c.id?'selected':''}>${esc(x.name)}${x.done?'（完了）':''}<\/option>`).join('');\n  document.body.classList.toggle('nofiles',!files.length);\n}\nfunction nextCompany(){ const list=sortedCos(cos.filter(c=>c.id!=='sample')); const i=list.findIndex(c=>c.id===curCo); const rest=[...list.slice(i+1),...list.slice(0,Math.max(0,i))].filter(c=>!c.done);\n  if(!rest.length){ toastBar('ほかに未完了の会社はありません'); return; } go('#/c/'+rest[0].id); }\n\n/* 会社一覧 */\nfunction sortedCos(a){ const by={updated:(x,y)=>(y.updated||'').localeCompare(x.updated||''),name:(x,y)=>x.name.localeCompare(y.name,'ja'),fy:(x,y)=>(x.fyEnd||99)-(y.fyEnd||99)||x.name.localeCompare(y.name,'ja'),hi:(x,y)=>((y.stats&&y.stats.hi)||0)-((x.stats&&x.stats.hi)||0)}; return a.slice().sort(by[coSort]||by.updated); }\nfunction renderHome(){\n  const real=cos.filter(c=>c.id!=='sample'); const cnt={todo:0,doing:0,judged:0,done:0}; real.forEach(c=>cnt[coStatus(c)]++);\n  const hiSum=real.reduce((s,c)=>s+((c.stats&&c.stats.hi)||0),0);\n  $('coKpi').innerHTML=`<div><span class=\"lbl\">担当の会社<\/span><span class=\"v\">${real.length}<\/span><span class=\"small faint\">社<\/span><\/div>\n    <div><span class=\"lbl\">未着手<\/span><span class=\"v\">${cnt.todo}<\/span><span class=\"small faint\">CSVまだ<\/span><\/div>\n    <div class=\"mid\"><span class=\"lbl\">確認中<\/span><span class=\"v\">${cnt.doing}<\/span><span class=\"small faint\">判断の途中<\/span><\/div>\n    <div class=\"lrn\"><span class=\"lbl\">判断済み<\/span><span class=\"v\">${cnt.judged}<\/span><span class=\"small faint\">完了待ち<\/span><\/div>\n    <div class=\"ok\"><span class=\"lbl\">完了<\/span><span class=\"v\">${cnt.done}<\/span><span class=\"small faint\">チェック済み<\/span><\/div>\n    <div class=\"hi\"><span class=\"lbl\">違和感 高（合計）<\/span><span class=\"v\">${hiSum}<\/span><span class=\"small faint\">組み合わせ<\/span><\/div>`;\n  const staffs=[...new Set(real.map(c=>c.staff).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));\n  $('coStaffF').innerHTML='<option value=\"\">担当：全員<\/option>'+staffs.map(s=>`<option ${s===coStaff?'selected':''}>${esc(s)}<\/option>`).join('');\n  $('coStaffF').hidden=!staffs.length;\n  const b=(v,l)=>`<button type=\"button\" data-v=\"${v}\" aria-pressed=\"${coF===v}\">${l}<span class=\"c\">${v==='all'?cos.length:cos.filter(c=>coStatus(c)===v).length}<\/span><\/button>`;\n  $('coFilter').innerHTML=b('all','すべて')+b('todo','未着手')+b('doing','確認中')+b('judged','判断済み')+b('done','完了');\n  const q=coQ.trim().toLowerCase();\n  const list=sortedCos(cos.filter(c=>(coF==='all'||coStatus(c)===coF)&&(!coStaff||c.staff===coStaff)&&(!q||(c.name+' '+c.staff+' '+c.memo).toLowerCase().includes(q))));\n  if(c0()){ $('coList').innerHTML=`<div class=\"coempty\"><div class=\"big\">まず、担当している会社を登録しましょう<\/div>\n      <p>Excelなどの会社一覧から「会社名・決算月・担当」の列をコピーして「まとめて貼り付け」に貼るのがいちばん早い方法です。1社ずつ「会社を追加」でも登録できます。<\/p>\n      <div class=\"btns\" style=\"justify-content:center\"><button class=\"btn\" type=\"button\" data-act=\"paste\">まとめて貼り付け<\/button><button class=\"btn line\" type=\"button\" data-act=\"add\">会社を追加<\/button><button class=\"btn line\" type=\"button\" data-act=\"sample\">サンプル会社で試す<\/button><\/div><\/div>`; }\n  else if(!list.length) $('coList').innerHTML='<div class=\"empty\">条件に合う会社はありません。<\/div>';\n  else $('coList').innerHTML=list.map(c=>{ const st=coStatus(c), s=c.stats||{}; const pct=s.cand?Math.round(s.judged/s.cand*100):0;\n    return `<div class=\"co\" data-id=\"${esc(c.id)}\">\n      <button class=\"coopen\" type=\"button\" data-open=\"${esc(c.id)}\" aria-label=\"${esc(c.name)}を開く\">\n        <span class=\"nm\">${esc(c.name)}<\/span>\n        <span class=\"mt\">${c.fyEnd?`<span>${c.fyEnd}月決算<\/span>`:''}${c.staff?`<span>担当 ${esc(c.staff)}<\/span>`:''}${s.from?`<span>対象 ${s.from}〜${s.to}<\/span>`:''}${c.memo?`<span>${esc(c.memo)}<\/span>`:''}<\/span>\n      <\/button>\n      <div class=\"pg\">${s.nFiles?`<span class=\"small muted\">判断 ${s.judged}/${s.cand}${s.fix?`・修正 ${s.fix}`:''}${s.hold?`・保留 ${s.hold}`:''}<\/span><div class=\"bar\"><i style=\"width:${pct}%\"><\/i><\/div>`:'<span class=\"small faint\">CSV未取込<\/span>'}<\/div>\n      <div class=\"fl\">${s.nFiles?`<span class=\"lv l3\" title=\"違和感 高\">高 ${s.hi}<\/span><span class=\"lv l2\" title=\"違和感 中\">中 ${s.mid}<\/span>${s.learn?`<span class=\"fx lrn\">学習 ${s.learn}<\/span>`:''}`:''}<\/div>\n      <span class=\"stb ${st}\">${STN[st]}<\/span>\n      <div class=\"ac\"><button class=\"btn sm\" type=\"button\" data-open=\"${esc(c.id)}\">開く<\/button><button class=\"pill\" type=\"button\" data-edit=\"${esc(c.id)}\">編集<\/button><\/div>\n    <\/div>`; }).join('');\n  renderCoForm();\n}\nconst c0=()=>!cos.length;\nfunction renderCoForm(){ const f=$('coForm'); if(!f) return; const c=coEditId&&coGet(coEditId);\n  $('coFormTitle').textContent=c?'会社の情報を編集':'会社を追加';\n  $('cfName').value=c?c.name:''; $('cfFy').value=c&&c.fyEnd?String(c.fyEnd):''; $('cfStaff').value=c?c.staff:''; $('cfMemo').value=c?c.memo:'';\n  $('cfSave').textContent=c?'保存する':'追加して開く'; $('cfDel').hidden=!c; $('cfDel').textContent='この会社を削除'; $('cfDel').dataset.arm='';\n}\nfunction openCoForm(id){ coEditId=id||null; $('coForm').hidden=false; $('coPaste').hidden=true; renderCoForm(); $('coForm').scrollIntoView({block:'nearest',behavior:'smooth'}); setTimeout(()=>$('cfName').focus(),50); }\nfunction parseMonth(v){ const m=String(v||'').match(/(\\d{1,2})/); const n=m?+m[1]:0; return n>=1&&n<=12?n:null; }\nfunction parseCoList(text){\n  const rows=text.split(/\\r?\\n/).map(r=>r.split(/\\t|,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(s=>s.trim().replace(/^\"|\"$/g,''))).filter(r=>r.some(Boolean));\n  if(!rows.length) return [];\n  let idx={name:0,fy:1,staff:2,memo:3}, start=0; const h=rows[0];\n  if(h.some(c=>/会社|事業所|名称|顧客|お客様|法人/.test(c))&&!h.some(c=>/株式会社|有限会社|合同会社/.test(c))){ const f=re=>h.findIndex(c=>re.test(c)); idx={name:f(/会社|事業所|名称|顧客|お客様|法人/),fy:f(/決算/),staff:f(/担当/),memo:f(/メモ|備考/)}; start=1; }\n  else if(rows[0].length>=2&&!parseMonth(rows[0][1])&&rows[0][1]) idx={name:0,fy:-1,staff:1,memo:2};\n  return rows.slice(start).map(r=>({name:(r[idx.name]||'').trim(),fyEnd:idx.fy>=0?parseMonth(r[idx.fy]):null,staff:idx.staff>=0?(r[idx.staff]||''):'',memo:idx.memo>=0?(r[idx.memo]||''):''})).filter(x=>x.name);\n}\nfunction previewPaste(){ const rows=parseCoList($('cpText').value); const ex=new Set(cos.map(c=>c.name));\n  $('cpPrev').innerHTML=rows.length?`<div class=\"small muted\">${rows.length}社を読み取りました${rows.some(r=>ex.has(r.name))?`（うち${rows.filter(r=>ex.has(r.name)).length}社は登録済みなので追加しません）`:''}<\/div><table class=\"cpt\"><thead><tr><th>会社名<\/th><th>決算月<\/th><th>担当<\/th><th>メモ<\/th><\/tr><\/thead><tbody>${rows.slice(0,8).map(r=>`<tr class=\"${ex.has(r.name)?'dup':''}\"><td>${esc(r.name)}<\/td><td>${r.fyEnd?r.fyEnd+'月':'<span class=\"faint\">―<\/span>'}<\/td><td>${esc(r.staff)}<\/td><td>${esc(r.memo)}<\/td><\/tr>`).join('')}<\/tbody><\/table>${rows.length>8?`<div class=\"small faint\">ほか${rows.length-8}社<\/div>`:''}`:'<div class=\"small faint\">ここに貼ると、読み取り結果が出ます。<\/div>';\n  $('cpAdd').disabled=!rows.filter(r=>!ex.has(r.name)).length; }\nfunction coListTSV(){ return ['会社名\\t決算月\\t担当\\tメモ\\t状態\\t違和感高\\t判断済み/候補\\t最終更新',...sortedCos(cos.filter(c=>c.id!=='sample')).map(c=>{ const s=c.stats||{}; return [c.name,c.fyEnd?c.fyEnd+'月':'',c.staff,c.memo,STN[coStatus(c)],s.nFiles?s.hi:'',s.nFiles?`${s.judged}/${s.cand}`:'',c.updated].join('\\t'); })].join('\\n'); }\nfunction backupText(){ const j={}; cos.forEach(c=>{ try{ const v=localStorage.getItem(JSTORE+':'+c.id); if(v) j[c.id]=JSON.parse(v); }catch(e){} }); return JSON.stringify({app:'kubun-kenin',v:1,at:today(),companies:cos,judge:j,memo,cfg,partners:preg}); }\nfunction restoreBackup(t){ const b=JSON.parse(t); if(!b||b.app!=='kubun-kenin'||!Array.isArray(b.companies)) throw 0; let n=0;\n  b.companies.forEach(c=>{ const cur=coGet(c.id); if(cur) Object.assign(cur,c); else { cos.push(c); n++; } });\n  Object.entries(b.judge||{}).forEach(([id,v])=>{ try{ const cur=JSON.parse(localStorage.getItem(JSTORE+':'+id)||'{}'); localStorage.setItem(JSTORE+':'+id,JSON.stringify(Object.assign(cur,v))); }catch(e){} });\n  if(b.memo&&b.memo.rules){ Object.entries(b.memo.rules).forEach(([id,r])=>{ if(!memo.rules[id]) memo.rules[id]=r; }); saveMemo(); }\n  if(b.partners&&typeof b.partners==='object'){ Object.entries(b.partners).forEach(([k,v])=>{ if(!preg[k]) preg[k]=v; }); savePreg(); }\n  saveCos(); return n; }\nfunction setupHome(){\n  $('coSearch').addEventListener('input',e=>{ coQ=e.target.value; renderHome(); $('coSearch').focus(); });\n  $('coSortSel').addEventListener('change',e=>{ coSort=e.target.value; renderHome(); });\n  $('coStaffF').addEventListener('change',e=>{ coStaff=e.target.value; renderHome(); });\n  $('coFilter').addEventListener('click',e=>{ const b=e.target.closest('button[data-v]'); if(!b) return; coF=b.dataset.v; renderHome(); });\n  const act=a=>{ if(a==='add') openCoForm(null); else if(a==='paste'){ $('coPaste').hidden=false; $('coForm').hidden=true; previewPaste(); $('coPaste').scrollIntoView({block:'nearest',behavior:'smooth'}); setTimeout(()=>$('cpText').focus(),50); } else if(a==='sample'){ ensureSample(); go('#/c/sample'); } };\n  $('home').addEventListener('click',e=>{ const o=e.target.closest('[data-open]'); if(o){ go('#/c/'+o.dataset.open); return; } const ed=e.target.closest('[data-edit]'); if(ed){ openCoForm(ed.dataset.edit); return; } const a=e.target.closest('[data-act]'); if(a) act(a.dataset.act); });\n  $('cfCancel').addEventListener('click',()=>{ $('coForm').hidden=true; coEditId=null; });\n  $('coForm').addEventListener('submit',e=>{ e.preventDefault(); const name=$('cfName').value.trim(); if(!name){ $('cfName').focus(); return; }\n    const v={name,fyEnd:parseMonth($('cfFy').value),staff:$('cfStaff').value,memo:$('cfMemo').value};\n    if(coEditId){ const c=coGet(coEditId); Object.assign(c,{name:v.name,fyEnd:v.fyEnd,staff:v.staff.trim(),memo:v.memo.trim()}); if(c.period&&v.fyEnd!==c.fyEnd) {} saveCos(); $('coForm').hidden=true; coEditId=null; renderHome(); toastBar('保存しました'); }\n    else { if(cos.some(c=>c.name===name)){ toastBar('同じ名前の会社がすでにあります'); return; } const c=coAdd(v); $('coForm').hidden=true; go('#/c/'+c.id); } });\n  $('cfDel').addEventListener('click',async()=>{ const b=$('cfDel'); if(b.dataset.arm!=='1'){ b.dataset.arm='1'; b.textContent='本当に削除？もう一度押す'; setTimeout(()=>{ b.dataset.arm=''; b.textContent='この会社を削除'; },3000); return; }\n    const c=coGet(coEditId); if(!c) return; const saved=await IDB.get(c.id); let jd=null; try{ jd=localStorage.getItem(JSTORE+':'+c.id); }catch(e){}\n    cos=cos.filter(x=>x.id!==c.id); saveCos(); IDB.del(c.id); try{ localStorage.removeItem(JSTORE+':'+c.id); }catch(e){}\n    coDelUndo={c,saved,jd}; $('coForm').hidden=true; coEditId=null; renderHome();\n    const u=$('coUndo'); u.hidden=false; u.innerHTML=`<span>「${esc(c.name)}」を削除しました。<\/span><button class=\"btn line sm\" type=\"button\" id=\"coUndoBtn\">元に戻す<\/button>`;\n    $('coUndoBtn').addEventListener('click',async()=>{ const d=coDelUndo; if(!d) return; cos.push(d.c); saveCos(); if(d.saved) await IDB.set(d.c.id,d.saved); try{ if(d.jd) localStorage.setItem(JSTORE+':'+d.c.id,d.jd); }catch(e){} coDelUndo=null; u.hidden=true; renderHome(); });\n    clearTimeout(u._h); u._h=setTimeout(()=>{ u.hidden=true; coDelUndo=null; },15000); });\n  $('cpText').addEventListener('input',previewPaste);\n  $('cpCancel').addEventListener('click',()=>{ $('coPaste').hidden=true; });\n  $('cpAdd').addEventListener('click',()=>{ const ex=new Set(cos.map(c=>c.name)); const rows=parseCoList($('cpText').value).filter(r=>!ex.has(r.name)); rows.forEach(r=>{ coAdd(r); ex.add(r.name); }); $('cpText').value=''; $('coPaste').hidden=true; renderHome(); toastBar(`${rows.length}社を追加しました`); });\n  $('coCopy').addEventListener('click',()=>{ $('bkText').value=coListTSV(); copy('bkText','toastB'); $('bkBox').open=true; });\n  $('bkExport').addEventListener('click',()=>{ $('bkText').value=backupText(); copy('bkText','toastB'); });\n  $('bkImport').addEventListener('click',()=>{ try{ const n=restoreBackup($('bkText').value); renderHome(); toast('toastB',`読み込みました（新しい会社 ${n}社）`); }catch(e){ toast('toastB','読み込めませんでした。「バックアップを書き出す」の文字列をそのまま貼ってください'); } });\n  // 会社を開いているとき\n  $('coBack').addEventListener('click',()=>go('#/'));\n  $('coSwitch').addEventListener('change',e=>go('#/c/'+e.target.value));\n  $('coNext').addEventListener('click',nextCompany);\n  $('coDone').addEventListener('click',()=>{ const c=coGet(curCo); if(!c) return; c.done=c.done?null:today(); c.updated=today(); saveCos(); renderCoHead(); toastBar(c.done?'チェック完了にしました':'完了を取り消しました'); });\n  $('coEdit').addEventListener('click',()=>{ const id=curCo; go('#/'); setTimeout(()=>openCoForm(id),60); });\n  document.querySelector('.brand').addEventListener('click',e=>{ e.preventDefault(); go('#/'); });\n  window.addEventListener('hashchange',route);\n}\n\n/* ---------- インボイス（取引先の登録・少額特例・経過措置・簡易課税） ---------- */\nconst PSTORE='kubun-kenin-partners-v1';\nlet preg=loadPreg(), invF='need', invQ='', invLimit=150;\nfunction loadPreg(){ try{ const o=JSON.parse(localStorage.getItem(PSTORE)||'{}'); return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } }\nfunction savePreg(){ try{ localStorage.setItem(PSTORE,JSON.stringify(preg)); }catch(e){} }\nconst pkey=s=>String(s||'').normalize('NFKC').replace(/[\\s　]/g,'').replace(/\\(株\\)|㈱/g,'株式会社').replace(/\\(有\\)|㈲/g,'有限会社').replace(/\\(同\\)/g,'合同会社').toLowerCase();\nconst pStatus=name=>{ const k=pkey(name); return k?(preg[k]||null):null; };\nfunction pSet(name,st,tno,src){ const k=pkey(name); if(!k) return; if(!st){ delete preg[k]; } else preg[k]={name,st,tno:tno||((preg[k]||{}).tno)||'',src:src||'user',at:today()}; savePreg(); }\nconst RE_CORP=/株式会社|有限会社|合同会社|合資会社|合名会社|一般社団|一般財団|公益社団|公益財団|社会福祉法人|医療法人|学校法人|独立行政法人|協同組合|ＮＰＯ|NPO法人|特定非営利|生活協同|農業協同|\\(株\\)|㈱|㈲|Inc\\.?$|Co\\.,?\\s?Ltd|Corporation|K\\.K\\./i;\nconst isCorp=n=>RE_CORP.test(String(n||'').normalize('NFKC'));\nconst RE_KIND=/課売上[一二三四五六]|第[一二三四五六]種|[一二三四五六]種/;\nconst toStd=t=>String(t).replace(/[（(]\\s*控\\s*[3-8]0\\s*[）)]/,'');\n/* 経過措置の控除割合（令和8年度改正後）：2023/10〜2026/9＝80%、2026/10〜2028/9＝70%、2028/10〜2030/9＝50%、2030/10〜2031/9＝30% */\nconst keikaFor=d=>!d||d<'2023-10-01'?'':d<'2026-10-01'?'80':d<'2028-10-01'?'70':d<'2030-10-01'?'50':d<'2031-10-01'?'30':'';\nconst keikaSpan=r=>({'80':'2023年10月1日〜2026年9月30日','70':'2026年10月1日〜2028年9月30日','50':'2028年10月1日〜2030年9月30日','30':'2030年10月1日〜2031年9月30日'}[r]||'');\nconst toKeika=(t,d)=>{ const r=keikaFor(d)||'80'; const s=toStd(t); return s.replace(/^課対仕入/,`課対仕入（控${r}）`); };\nconst keikaRate=t=>{ const m=String(t).match(/控\\s*([3-8]0)/); return m?m[1]:''; };\nconst SMALL_FROM='2023-10-01', SMALL_TO='2029-09-30';\nconst METHODN={honsoku:'本則課税',simple:'簡易課税',niwari:'2割特例',menzei:'免税事業者',unknown:'未設定'};\nconst SMALLN={yes:'使える',no:'使えない',unknown:'未設定'};\nfunction invContext(cur,cells){\n  const co=curCo&&coGet(curCo)||{};\n  const detected=[...cells.values()].some(c=>RE_KIND.test(c.tax))?'simple':null;\n  const method=co.method&&co.method!=='unknown'?co.method:(detected||'unknown');\n  const small=co.small||'unknown';\n  // 1回の取引の金額（税込）：同じ仕訳（仕訳ID）の課税仕入をまとめる。仕訳IDがなければその行の金額\n  const g=new Map(); cur.forEach(l=>{ if(taxClass(l.tax)!=='課税仕入'||!(l.dr>0)||!l.ref) return; const k=l.ref+'|'+l.date; g.set(k,(g.get(k)||0)+l.dr); });\n  const gamt=l=>l.ref&&g.has(l.ref+'|'+l.date)?g.get(l.ref+'|'+l.date):(l.dr||l.cr);\n  return {method,methodSrc:co.method&&co.method!=='unknown'?'設定':detected?'データから推定':'',small,gamt,purchaseLight:method==='simple'||method==='niwari'||method==='menzei'};\n}\nfunction invRule(l,INV,up){\n  if(taxClass(l.tax)!=='課税仕入'||!(l.dr>0)) return null;\n  const st=pStatus(l.partner), amt=INV.gamt(l), small=amt<10000&&l.date>=SMALL_FROM&&l.date<=SMALL_TO;\n  const smallYes=small&&INV.small==='yes', smallUnk=small&&INV.small==='unknown';\n  const k=isKeika(l.tax), expR=keikaFor(l.date); let out=null;\n  if(k){\n    if(st&&st.st==='reg'){ up(3,`取引先は登録事業者${st.tno?`（${st.tno}）`:''}なのに経過措置（控${keikaRate(l.tax)}）`);\n      out={kind:'change',to:toStd(l.tax),basis:'取引先のインボイス登録',note:'登録事業者からの仕入なので全額控除の課対仕入にする案。請求書・領収書に登録番号があるか確認。'}; }\n    else if(smallYes){ up(2,`税込1万円未満（${yen(amt)}円）は少額特例で全額控除できる`);\n      out={kind:'change',to:toStd(l.tax),basis:'少額特例',note:'少額特例（基準期間の課税売上高1億円以下など・2029年9月まで）では、税込1万円未満の仕入は相手の登録の有無に関係なく帳簿だけで全額控除できる。'}; }\n    else if(smallUnk){ up(1,`税込1万円未満（${yen(amt)}円）：少額特例が使える会社なら経過措置にしなくてよい`);\n      out={kind:'check',to:toStd(l.tax),basis:'少額特例',note:'この会社が少額特例を使えるか（基準期間の課税売上高1億円以下など）を「04 インボイス」で設定すると判定がはっきりする。'}; }\n    else if(!st&&isCorp(l.partner)){ up(2,'法人の取引先に経過措置。登録番号を確認');\n      out={kind:'check',to:toStd(l.tax),basis:'法人の取引先',note:'法人はほとんどが登録事業者。請求書・領収書に登録番号（T＋13桁）があれば全額控除の課対仕入。'}; }\n    if(expR&&keikaRate(l.tax)&&keikaRate(l.tax)!==expR&&!(st&&st.st==='reg')&&!smallYes){ up(3,`${keikaSpan(expR)}の経過措置は${expR}%（控${expR}）。この取引は控${keikaRate(l.tax)}`);\n      out={kind:'change',to:toKeika(l.tax,l.date),basis:'経過措置の割合',note:`${keikaSpan(expR)}の仕入は、登録のない事業者からでも控除できるのは${expR}%${expR==='80'?'':'（令和8年度改正）'}。自動登録ルールで税区分を固定していないかも確認。`}; }\n  } else if(st&&st.st==='unreg'&&!smallYes){\n    up(2,'登録のない取引先なのに全額控除の課対仕入');\n    out={kind:'change',to:toKeika(l.tax,l.date),basis:'取引先のインボイス登録',note:`登録のない事業者からの仕入は経過措置（2026年9月までは80%、2026年10月〜2028年9月は70%、2028年10月〜2030年9月は50%）。${small?'少額特例が使える会社で税込1万円未満なら、このままでよい。':''}`};\n  }\n  return out;\n}\nfunction invPartners(R){\n  const m=new Map();\n  for(const t of R.tx){ const l=t.l; if(taxClass(l.tax)!=='課税仕入'||!(l.dr>0)) continue; const k=pkey(l.partner)||'（取引先なし）';\n    const o=m.get(k)||{k,name:l.partner||'（取引先なし）',std:0,stdA:0,kei:0,keiA:0,small:0,flag:0,accs:new Set(),ts:[]};\n    if(isKeika(l.tax)){ o.kei++; o.keiA+=l.dr; } else { o.std++; o.stdA+=l.dr; }\n    if(R.inv&&R.inv.gamt(l)<10000) o.small++;\n    if(t.lv>0&&t.fix&&/インボイス|少額|経過措置|法人の取引先/.test(t.fix.basis)) o.flag++;\n    o.accs.add(l.account); o.ts.push(t); m.set(k,o); }\n  return [...m.values()];\n}\nfunction renderInv(){\n  const el=$('inv'); if(!el) return;\n  if(!R||!R.hasLines){ el.innerHTML='<div class=\"sheet lcard\"><div class=\"empty\">仕訳帳（または総勘定元帳）のCSVを入れると、取引先ごとのインボイスの状況が出ます。<\/div><\/div>'; return; }\n  const I=R.inv, ps=invPartners(R), need=ps.filter(p=>p.flag||(p.kei&&!pStatus(p.name))), noName=ps.find(p=>p.k==='（取引先なし）');\n  const cnt={reg:0,unreg:0,none:0}; ps.forEach(p=>{ const s=pStatus(p.name); cnt[s?s.st:'none']++; });\n  let list=invF==='need'?need:invF==='kei'?ps.filter(p=>p.kei):ps;\n  const q=invQ.trim().toLowerCase(); if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));\n  list=list.slice().sort((a,b)=>b.flag-a.flag||(b.keiA+b.stdA)-(a.keiA+a.stdA));\n  const sel2=(id,val,opts)=>`<select id=\"${id}\">${Object.entries(opts).map(([v,l])=>`<option value=\"${v}\" ${v===val?'selected':''}>${l}<\/option>`).join('')}<\/select>`;\n  const co=coGet(curCo)||{};\n  el.innerHTML=`<div class=\"sheet lcard invset\">\n      <div class=\"invrow\"><label>課税方式${sel2('invMethod',co.method||'unknown',{unknown:'未設定'+(I.methodSrc==='データから推定'?'（データでは簡易課税）':''),honsoku:'本則課税（原則）',simple:'簡易課税',niwari:'2割特例',menzei:'免税事業者'})}<\/label>\n        <label>少額特例${sel2('invSmall',co.small||'unknown',{unknown:'未設定',yes:'使える（基準期間の課税売上高1億円以下など）',no:'使えない'})}<\/label>\n        <span class=\"small muted\">判定に使う方式：<b>${METHODN[I.method]}<\/b>${I.methodSrc?`（${I.methodSrc}）`:''}<\/span><\/div>\n      <div class=\"small faint\">${I.purchaseLight?'簡易課税・2割特例・免税では、仕入側の税区分（控80か課対仕入か等）は納税額に影響しないため、仕入側の指摘は「参考」に下げています。簡易課税では売上側の事業区分（第一〜六種）が大事です。':'本則課税では、仕入の税区分（全額控除か経過措置か）がそのまま納税額に響きます。'} 少額特例は、税込1万円未満の仕入なら相手の登録の有無に関係なく全額控除できる特例です（2023年10月〜2029年9月）。経過措置は2026年9月までは80%、2026年10月〜2028年9月は70%（令和8年度改正）、その後は50%・30%です。<\/div>\n    <\/div>\n    <div class=\"sheet lcard\">\n      <div class=\"lsum\"><spa
