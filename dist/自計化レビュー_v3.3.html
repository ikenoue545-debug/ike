){ let t=$('kbtoast'); if(!t){ t=document.createElement('div'); t.id='kbtoast'; t.setAttribute('role','status'); t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--head);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow-lg);transition:opacity .3s'; document.body.appendChild(t); }\n  t.textContent=msg; t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',2200); }\nfunction refreshProgress(){\n  const pr=drillProg(); if($('dProgT')){ $('dProgT').textContent=`判断 ${pr.done}/${pr.f.length}`; $('dProgB').style.width=(pr.f.length?Math.round(pr.done/pr.f.length*100):0)+'%'; }\n  renderTally(); renderTop(); renderSuspects(); renderLearn(); refreshOutputs(); updateCoStats();\n}\nfunction scrollTo3(){ $('s3').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); }\nfunction select(k,scroll){ if(sel!==k){ qtext=''; kfi=-1; } sel=k; renderMatrix(); renderSuspects(); renderDrill(); renderTop(); if(scroll) scrollTo3(); }\nfunction selectAcc(a,scroll){ const susK=new Set(R.sus.map(s=>s.k));\n  const cs=[...R.cells.values()].filter(x=>x.account===a).sort((x,y)=>{ const kx=x.tax+'\\u241E'+x.account, ky=y.tax+'\\u241E'+y.account; const sx=R.sus.find(s=>s.k===kx), sy=R.sus.find(s=>s.k===ky);\n    return ((sy?sy.lv:0)-(sx?sx.lv:0))||Math.max(y.dr,y.cr)-Math.max(x.dr,x.cr); });\n  if(cs[0]) select(cs[0].tax+'\\u241E'+cs[0].account,scroll); }\n\n/* ---------- outputs ---------- */\nfunction txLinesFor(s){ return (R.txByCell.get(s.k)||[]); }\nfunction fixLine(t){ const f=t.fix; if(!f) return ''; return `${FXN[f.kind]}${f.to?'：'+t.l.tax+'→'+f.to:''}（${f.note.replace(/\\s+/g,' ')}）`; }\nfunction fixGroups(ts){ const g=new Map(); for(const t of ts){ if(!t.fix) continue; const k=t.fix.kind+'|'+(t.fix.to||'')+'|'+t.fix.basis; if(!g.has(k)) g.set(k,{kind:t.fix.kind,to:t.fix.to,from:t.l.tax,n:0,amt:0,note:t.fix.note,basis:t.fix.basis,label:t.fix.label}); const o=g.get(k); o.n++; o.amt+=(t.l.dr||t.l.cr); }\n  return [...g.values()].sort((a,b)=>({change:0,check:1,keep:2,unknown:3}[a.kind]-{change:0,check:1,keep:2,unknown:3}[b.kind])||b.amt-a.amt); }\nfunction buildFix(){\n  const low=$('fLow').checked, L=[]; const all=R.tx.filter(t=>t.fix&&t.lv>=(low?1:2));\n  L.push('【仮修正案の一覧（AIの案・未確認）】');\n  L.push(`対象期間：${jpYM(R.from)}～${jpYM(R.to)}`);\n  L.push('※勘定科目と摘要からの機械的な案です。修正仕訳は未作成。実際に直すか、直し方・日付は資料確認と先輩の確認のあとで決めます。「本人判断」は03で付けた判断です。');\n  L.push('');\n  if(!R.hasLines){ L.push('取引の明細がありません。仕訳帳CSVを入れると、取引ごとの仮修正案が出ます。'); return L.join('\\n'); }\n  const ch=all.filter(t=>t.fix.to&&t.fix.j);\n  const pairs=new Map(); ch.forEach(t=>{ const k=`${t.l.account}｜${t.l.tax} → ${t.fix.to}`; const o=pairs.get(k)||{n:0,amt:0}; o.n++; o.amt+=(t.l.dr||t.l.cr); pairs.set(k,o); });\n  L.push('■ 変更の案（税区分の動き）');\n  if(!pairs.size) L.push('税区分を変える案はありません。'); else [...pairs].sort((a,b)=>b[1].amt-a[1].amt).forEach(([k,o])=>L.push(`- ${k}：${o.n}件／${yen(o.amt)}円`));\n  L.push('');\n  L.push('■ 取引ごとの仮の修正仕訳（同じ科目の中で税区分だけ付け替える形）');\n  L.push(['確度','本人判断','取引日','摘要','借方勘定科目','借方税区分','借方金額','貸方勘定科目','貸方税区分','貸方金額','根拠','注意'].join('\\t'));\n  ch.slice().sort((a,b)=>({change:0,check:1}[a.fix.kind]-{change:0,check:1}[b.fix.kind])||a.l.date.localeCompare(b.l.date)).forEach(t=>{ const f=t.fix,j=f.j;\n    L.push([FXN[f.kind],(JN[jget(t)]||'未判断')+(jget(t)==='fix'&&jto(t)?'→'+jto(t):''),t.l.date,(t.l.memo||t.l.cmemo).replace(/\\t/g,' '),j.dr[0],j.dr[1],yen(j.dr[2]),j.cr[0],j.cr[1],yen(j.cr[2]),f.basis,f.note.replace(/\\s+/g,' ')].join('\\t')); });\n  if(!ch.length) L.push('（該当なし）');\n  L.push('');\n  const keep=all.filter(t=>!t.fix.j);\n  L.push('■ 変更なし見込み／判断できないもの／案が出せないもの（資料確認のみ）');\n  if(!keep.length) L.push('（該当なし）'); else keep.slice().sort((a,b)=>a.l.date.localeCompare(b.l.date)).forEach(t=>L.push(`- ${t.l.date}｜${t.l.account}（${t.l.tax}）｜${yen(t.l.dr||t.l.cr)}円｜${t.l.memo||t.l.cmemo}｜${FXN[t.fix.kind]}${t.fix.label?'（'+t.fix.label+'）':''}｜本人判断：${JN[jget(t)]||'未判断'}`));\n  return L.join('\\n');\n}\nfunction buildClaude(){\n  const low=$('cLow').checked, L=[], list=R.sus.filter(s=>low||s.lv>=2);\n  L.push('自計化チェック（消費税区分）の続きです。消費税区分別チェッカーで、区分別表から違和感のある組み合わせを選び、その取引を抜き出しました。');\n  L.push(`対象期間：${R.from}〜${R.to}${R.hasLines?`（前期 ${R.pFrom}〜${R.pTo} と比較）`:''}`);\n  if(R.inv) L.push(`課税方式：${METHODN[R.inv.method]}${R.inv.methodSrc?`（${R.inv.methodSrc}）`:''}／少額特例：${SMALLN[R.inv.small]}（経過措置は2026年9月まで80%・2026年10月〜2028年9月は70%）`);\n  L.push('');\n  if(R.notes.length){ L.push('【全体の注意点】'); R.notes.forEach(n=>L.push(`- ${n.t}。${n.b}`)); L.push(''); }\n  L.push('【お願い】');\n  L.push('1. 組み合わせごとに、違和感の理由が妥当か、どの取引を確認すべきかを判断してください。PLだけでなくBS科目（固定資産・仮勘定・敷金など）も含みます。');\n  L.push('2. 取引ごとに、現在の税区分／違和感を持った理由／想定される適切な処理／追加で確認したい資料を出してください。表の「AIの仮修正案」は消費税区分別チェッカーの機械的な案、「本人判断」は担当者の判断（先輩確認前）です。妥当か、別の直し方がないかも判断してください。');\n  L.push('勘定科目や摘要だけで誤りと断定せず、資料が足りない場合は「要確認」としてください。');\n  L.push('3. 最後に、自計化アプリのメモ欄に1つにまとめて貼る文章を作ってください（対象期間・確認資料・該当取引・勘定科目・現在の税区分・気になる理由・確認結果・確認事項・対応状況「メモ記録のみ。修正仕訳未作成。」。指摘のない組み合わせは「確認した範囲では指摘事項なし」）。');\n  L.push('');\n  if(R.hasLines&&(R.learn.evPrev.length||R.learn.evCur.length)){\n    L.push('【消費税区分修正の仕訳から消費税区分別チェッカーが推定した内容（推定・要確認）】');\n    [...R.learn.evPrev,...R.learn.evCur].forEach(e=>{ L.push(`- ${e.period} ${e.date} ${e.account} ${yen(e.amt)}円：${e.from}→${e.to||'（別の税区分）'}／${CONFN[e.conf]}／${e.method}`); (e.lines||[]).slice(0,6).forEach(l=>L.push(`    ・${l.date} ${l.partner||''} ${(l.memo||l.cmemo)} ${yen(amtOf(l))}円`)); });\n    L.push('この推定が妥当か、今期にも同じ修正が必要な取引がないかも見てください。'); L.push(''); }\n  L.push(`【区分別表（当期／前期同期間 ${R.sFrom||''}〜${R.sTo||''}）】`); L.push(['区分','税区分','勘定科目','借方','貸方','前期借方','前期貸方'].join('\\t'));\n  [...R.cells.values()].sort((a,b)=>taxRank(a.tax)-taxRank(b.tax)||a.account.localeCompare(b.account,'ja')).forEach(c=>{ const p=R.pcells.get(c.tax+'\\u241E'+c.account)||{dr:0,cr:0}; L.push([isBS(c.account)?'BS':'PL',c.tax,c.account,yen(c.dr),yen(c.cr),yen(p.dr),yen(p.cr)].join('\\t')); });\n  L.push('');\n  list.forEach((s,i)=>{\n    L.push(`【${i+1}. ${s.cell.tax} × ${s.cell.account}（${isBS(s.cell.account)?'BS':'PL'}）】違和感 ${LV[s.lv]}／借方 ${yen(s.cell.dr)}／貸方 ${yen(s.cell.cr)}`);\n    L.push('理由：'+s.reasons.join('／'));\n    const ts=txLinesFor(s);\n    if(!ts.length){ L.push('（取引明細なし。元帳での確認が必要）'); L.push(''); return; }\n    L.push(['優先','取引日','取引先','摘要','相手科目','借方','貸方','前期の同じ摘要','抽出理由','AIの仮修正案','本人判断'].join('\\t'));\n    const fl=ts.filter(t=>t.lv>0), rest=ts.filter(t=>t.lv===0);\n    const show=ts.length<=80?ts:fl;\n    show.slice().sort((a,b)=>a.l.date.localeCompare(b.l.date)).forEach(t=>L.push([t.lv?LV[t.lv]:'-',t.l.date,t.l.partner,(t.l.memo||t.l.cmemo).replace(/\\t/g,' '),t.l.counter,t.l.dr?yen(t.l.dr):'',t.l.cr?yen(t.l.cr):'',t.prevTaxes,t.reasons.join('／'),fixLine(t),t.lv?((JN[jget(t)]||'未判断')+(jget(t)==='fix'&&jto(t)?'→'+jto(t):'')):''].join('\\t')));\n    if(ts.length>80&&rest.length){ const g=new Map(); rest.forEach(t=>{ const o=g.get(t.key)||{n:0,dr:0,cr:0}; o.n++; o.dr+=t.l.dr; o.cr+=t.l.cr; g.set(t.key,o); });\n      L.push('（候補以外の取引は摘要ごとの集計）'); [...g].forEach(([k,o])=>L.push(`- ${k}：${o.n}件／借方 ${yen(o.dr)}／貸方 ${yen(o.cr)}`)); }\n    L.push('');\n  });\n  return L.join('\\n');\n}\nfunction buildMemo(){\n  const low=$('mLow').checked, out=[], list=R.sus.filter(s=>low||s.lv>=2);\n  out.push(`対象期間：${jpYM(R.from)}～${jpYM(R.to)}`);\n  out.push(`確認資料：消費税区分別表${R.hasLines?'、仕訳帳（違和感のある科目の取引）':''}`);\n  if(R.inv) out.push(`課税方式：${METHODN[R.inv.method]}${R.inv.methodSrc==='データから推定'?'（税区分から推定）':''}／少額特例：${SMALLN[R.inv.small]}`);\n  out.push('');\n  list.forEach(s=>{\n    out.push(`勘定科目：${s.cell.account}（${isBS(s.cell.account)?'BS':'PL'}）／現在の税区分：${s.cell.tax}／借方${yen(s.cell.dr)}円・貸方${yen(s.cell.cr)}円`);\n    const all=txLinesFor(s).filter(t=>t.lv>0), ft=all.filter(t=>t.lv>=2).sort((a,b)=>b.lv-a.lv||Math.max(b.l.dr,b.l.cr)-Math.max(a.l.dr,a.l.cr));\n    ft.slice(0,5).forEach(t=>out.push(`該当取引：${mdJP(t.l.date)}／${t.l.partner||'取引先なし'}／${yen(t.l.cr||t.l.dr)}円／${t.l.memo||t.l.cmemo}`));\n    if(ft.length>5) out.push(`（ほか${ft.length-5}件）`);\n    out.push(`気になる理由：${s.reasons.join('。')}`);\n    const fg=fixGroups(ft); fg.slice(0,5).forEach(g=>out.push(`仮修正案（AI案・未確認）【${g.basis||'その他'}】：${g.kind==='keep'?'変更なし見込み':g.kind==='unknown'?'判断できません':g.to?`${g.from}→${g.to}（${FXN[g.kind]}）`:(g.label||'案なし（資料で確認）')}／${g.n}件・${yen(g.amt)}円／${g.note.replace(/\\s+/g,' ')}`));\n    const nl=all.filter(t=>t.learned).length; if(nl) out.push(`学習（推定）：前期の修正仕訳やこれまでの判断と同じパターンの取引が${nl}件`);\n    const jc=jcount(all);\n    if(!all.length||jc.none===all.length) out.push('確認結果：要確認');\n    else { const parts=[]; if(jc.fix) parts.push(`修正が必要 ${jc.fix}件`); if(jc.hold) parts.push(`保留 ${jc.hold}件`); if(jc.ok) parts.push(`問題なし ${jc.ok}件`); if(jc.none) parts.push(`未判断 ${jc.none}件`);\n      out.push(`確認結果（本人判断・先輩未確認）：${parts.join('・')}`);\n      all.filter(t=>jget(t)==='fix').slice(0,8).forEach(t=>out.push(`　修正：${mdJP(t.l.date)}／${yen(t.l.dr||t.l.cr)}円／${t.l.memo||t.l.cmemo}${jto(t)?`／${t.l.tax}→${jto(t)}`:''}`));\n      all.filter(t=>jget(t)==='hold').slice(0,8).forEach(t=>out.push(`　保留：${mdJP(t.l.date)}／${yen(t.l.dr||t.l.cr)}円／${t.l.memo||t.l.cmemo}`)); }\n    const cats=[...new Set(ft.map(t=>t.cat))]; out.push(`確認事項：${cats.length?cats.map(c=>ASK[c]).join('。'):'元帳と資料で取引内容を確認'}`);\n    out.push('対応状況：メモ記録のみ。修正仕訳未作成。'); out.push('');\n  });\n  if(!list.length) out.push('指摘事項：なし');\n  const susK=new Set(R.sus.map(s=>s.k)); const clean=[...R.cells.values()].filter(c=>!susK.has(c.tax+'\\u241E'+c.account)&&(c.dr||c.cr)).map(c=>`${c.tax}×${c.account}`);\n  if(clean.length) out.push(`確認した範囲では指摘事項なし：${clean.join('、')}`);\n  return out.join('\\n');\n}\nfunction refreshOutputs(){ if(!R) return; $('outC').value=buildClaude(); $('outM').value=buildMemo(); $('outF').value=buildFix(); }\n\nfunction renderAll(){\n  renderFiles();\n  if(!files.length){ R=null; sel=null; ['tally','mx','mxf','notices'].forEach(id=>$(id).innerHTML=''); $('suspects').innerHTML='<h3>違和感のある組み合わせ<\/h3><div class=\"empty\">CSVを入れると、ここに並びます。<\/div>'; renderDrill(); renderLearn(); $('outC').value=''; $('outM').value=''; $('outF').value=''; renderTop(); updateCoStats(); return; }\n  R=analyze(); if(!R) return;\n  if(sel&&!R.cells.has(sel)) sel=null; if(!sel&&R.sus.length) sel=R.sus[0].k;\n  renderNotes(); renderTally(); renderFilter(); renderMatrix(); renderSuspects(); renderDrill(); renderTop(); renderInv(); renderLearn(); refreshOutputs(); updateCoStats();\n}\nfunction watchNav(){\n  if(!('IntersectionObserver' in window)) return;\n  const links=[...document.querySelectorAll('.nav a')]; const vis=new Map();\n  const io=new IntersectionObserver(es=>{ es.forEach(e=>vis.set(e.target.id,e.isIntersecting?e.intersectionRatio:0));\n    let best=null,bv=0; for(const [id,v] of vis) if(v>bv){bv=v;best=id;} links.forEach(a=>{ const on=a.dataset.s===best; if(on&&!a.classList.contains('on')){ const nv=$('nav'); nv.scrollTo({left:Math.max(0,a.offsetLeft-nv.offsetLeft-40),behavior:'smooth'}); } a.classList.toggle('on',on); }); },{rootMargin:'-70px 0px -45% 0px',threshold:[0,.1,.3,.6]});\n  ['s1','s2','s3','sI','s4','s5'].forEach(id=>io.observe($(id)));\n}\n\n/* ---------- 04 学習 ---------- */\nconst CONFN={high:'確度 高',mid:'確度 中',low:'確度 低',none:'特定できず'};\nfunction evHTML(e){\n  const mv=`${esc(e.from)} → ${e.to?esc(e.to):'（別の税区分・推定）'}`;\n  const ls=(e.lines||[]);\n  const body=ls.length?`<div class=\"why2\">推定のしかた：${esc(e.method)}${e.side?`／元の取引は${e.side==='cr'?'貸方':'借方'}`:''}<\/div><ul>${ls.slice(0,8).map(l=>`<li>${l.date}｜${esc(l.partner||'取引先なし')}｜${esc(l.memo||l.cmemo)}｜<span class=\"num\">${yen(amtOf(l))}<\/span>円<\/li>`).join('')}${ls.length>8?`<li>ほか${ls.length-8}件<\/li>`:''}<\/ul>`\n    :`<div class=\"why2\">${esc(e.method)}<\/div>`;\n  return `<details class=\"ev\"><summary><span class=\"kind ${e.period==='前期'?'prev':''}\">${e.period}<\/span><span class=\"num\">${e.date}<\/span><span>${esc(e.account)}<\/span><span class=\"amt\">${yen(e.amt)}円<\/span><span class=\"mv\">${mv}<\/span><span class=\"conf ${e.conf}\">${CONFN[e.conf]}<\/span><\/summary>${body}<\/details>`;\n}\nfunction patHits(p,isKey){ return R.tx.filter(t=>!t.done&&t.l.account===p.account&&t.l.tax===p.from&&sideOf(t.l)===p.side&&(isKey?normKey(t.l.memo||t.l.cmemo)===p.label:CATN[t.cat]===p.label)); }\nfunction renderLearn(){\n  const el=$('learn'); if(!el) return;\n  if(!R||!R.hasLines){ el.innerHTML='<div class=\"sheet lcard\"><div class=\"empty\">仕訳帳（または総勘定元帳）のCSVを当期・前期まとめて入れると、前期の「消費税区分修正」の仕訳から学習します。<\/div><\/div>'+rulesCard(); wireLearn(); return; }\n  const L=R.learn, ev=[...L.evPrev,...L.evCur], m=ev.filter(e=>e.status==='matched'), cc={high:0,mid:0,low:0}; m.forEach(e=>cc[e.conf]++);\n  const pats=[...[...L.pats.key.values()].map(p=>({p,isKey:true})),...[...L.pats.cat.values()].map(p=>({p,isKey:false}))];\n  const patHTML=pats.length?pats.map(({p,isKey},i)=>{ const h=patHits(p,isKey); return `<div class=\"pat\"><span class=\"k\">${isKey?'摘要「':'種類「'}${esc(p.label)}」<span class=\"faint\">（${esc(p.account)}）<\/span><\/span>\n      <button class=\"btn line sm\" type=\"button\" data-pat=\"${i}\" ${h.length?'':'disabled'}>今期 ${h.length}件を見る<\/button>\n      <span class=\"d\">${esc(p.from)} → ${p.to?esc(p.to):'別の税区分（推定）'}／前期に${p.n}件直していた／${CONFN[p.conf]}<\/span><\/div>`; }).join('')\n    :'<div class=\"faint small\">当てはめられるパターンはまだありません。<\/div>';\n  el.innerHTML=`<div class=\"sheet lcard\"><h3><span class=\"ic\" aria-hidden=\"true\">✦<\/span>修正仕訳から学んだこと<\/h3>\n    <div class=\"lsum\"><span>修正仕訳 <b>${ev.length}<\/b>件（前期 ${L.evPrev.length}・当期 ${L.evCur.length}）<\/span><span>元の取引を推定 <b>${m.length}<\/b>件（高 ${cc.high}・中 ${cc.mid}・低 ${cc.low}）<\/span><span>特定できず <b>${ev.length-m.length}<\/b>件<\/span>${L.fixed?`<span>当期に直し済み <b>${L.fixed}<\/b>件<\/span>`:''}<\/div>\n    <div class=\"small faint\">修正仕訳の金額と同じになる取引（同じ金額・同じ取引先や摘要の合計・金額の組み合わせ）を探して、「元はどの取引だったか」を推定しています。確度「低」は今期への当てはめに使いません。<\/div>\n    ${ev.length?ev.map(evHTML).join(''):'<div class=\"faint small\">「消費税区分修正」などの修正仕訳は見つかりませんでした。<\/div>'}\n    <h3 style=\"margin-top:6px\"><span class=\"ic\" aria-hidden=\"true\">↻<\/span>今期に当てはめたパターン<\/h3>${patHTML}<\/div>`+rulesCard();\n  el._pats=pats; wireLearn();\n}\nfunction rulesCard(){\n  const rs=coRules().sort((a,b)=>(b[1].last||'').localeCompare(a[1].last||''));\n  return `<div class=\"sheet lcard\"><h3><span class=\"ic\" aria-hidden=\"true\">✎<\/span>あなたの判断から学んだこと<\/h3>\n    <div class=\"small faint\">03で「修正」「OK」を付けると、科目・税区分・摘要の組み合わせを覚えます。次に同じ組み合わせが出たら、修正なら【学習】の印、OKなら優先度を1段下げます。「学習を反映」を押すか、CSVを入れ直すと判定に入ります。<\/div>\n    <div>${rs.length?rs.slice(0,60).map(([id,r])=>`<div class=\"rule\"><span class=\"fx ${r.act==='fix'?'change':'keep'}\">${r.act==='fix'?'修正':'OK'}<\/span><span>${esc(r.account)}・${esc(r.tax)}｜${esc(r.key)}${r.act==='fix'&&r.to?` → <b>${esc(r.to)}<\/b>`:''}<\/span><button class=\"x\" type=\"button\" data-del=\"${esc(id)}\">削除<\/button><span class=\"d\">${r.tx.length}件・${esc(r.last||'')}<\/span><\/div>`).join(''):'<div class=\"faint small\">まだ覚えた判断はありません。<\/div>'}${rs.length>60?`<div class=\"faint small\">ほか${rs.length-60}件<\/div>`:''}<\/div>\n    <div class=\"btns\"><button class=\"btn sm\" type=\"button\" id=\"lApply\">学習を反映<\/button><button class=\"btn line sm\" type=\"button\" id=\"lExport\">書き出す<\/button><button class=\"btn line sm\" type=\"button\" id=\"lImport\">読み込む<\/button><button class=\"btn line sm\" type=\"button\" id=\"lClear\">すべて消す<\/button><span class=\"toast\" id=\"toastL\" aria-live=\"polite\"><\/span><\/div>\n    <div class=\"lio\"><textarea id=\"lText\" placeholder=\"「書き出す」で学習データの文字列がここに出ます。同僚の文字列を貼って「読み込む」と、学習を共有できます。\" aria-label=\"学習データ\"><\/textarea><\/div><\/div>`;\n}\nfunction wireLearn(){\n  const el=$('learn');\n  el.querySelectorAll('[data-pat]').forEach(b=>b.addEventListener('click',()=>{ const {p,isKey}=el._pats[+b.dataset.pat]; const k=p.from+'\\u241E'+p.account; if(!R.cells.has(k)) return; onlyFlag=false; select(k,true); qtext=isKey?p.label:''; renderDrill(); }));\n  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ delete memo.rules[b.dataset.del]; saveMemo(); renderLearn(); toast('toastL','削除しました（「学習を反映」で判定に反映）'); }));\n  $('lApply').addEventListener('click',()=>{ const keep=sel; renderAll(); if(keep&&R&&R.cells.has(keep)) select(keep); toast('toastL','学習を判定に反映しました'); });\n  $('lExport').addEventListener('click',()=>{ $('lText').value=JSON.stringify(memo); copy('lText','toastL'); });\n  $('lImport').addEventListener('click',()=>{ try{ const m=JSON.parse($('lText').value); if(!m||!m.rules) throw 0; let n=0; for(const [id,r] of Object.entries(m.rules)){ if(!r||!r.rk||!Array.isArray(r.tx)) continue; const cur=memo.rules[id]; memo.rules[id]=cur?Object.assign(cur,{tx:[...new Set([...cur.tx,...r.tx])],last:r.last>cur.last?r.last:cur.last}):r; n++; } saveMemo(); renderLearn(); toast('toastL',`${n}件読み込みました（「学習を反映」で判定に反映）`); }catch(e){ toast('toastL','読み込めませんでした。書き出した文字列をそのまま貼ってください'); } });\n  $('lClear').addEventListener('click',()=>{ if($('lClear').dataset.arm!=='1'){ $('lClear').dataset.arm='1'; $('lClear').textContent='本当に消す？もう一度押す'; setTimeout(()=>{ if($('lClear')){ $('lClear').dataset.arm=''; $('lClear').textContent='すべて消す'; } },3000); return; }\n    memo={v:1,rules:{}}; saveMemo(); renderLearn(); toast('toastL','覚えた判断を消しました'); });\n}\n\n/* ---------- 詳細パネル（マスや税区分の列を押すと、その場で取引が見られる） ---------- */\nlet dw=null, dwBack=null;\nconst CATN2=Object.assign({},CATN,{none:'その他'});\nfunction dwOpen(state,trigger){ dw=Object.assign({cat:null,key:null,q:'',sort:'date',limit:200},state); dwBack=trigger||document.activeElement; $('drawer').hidden=false; document.body.classList.add('dw-on'); renderDrawer(); requestAnimationFrame(()=>{ $('drawer').classList.add('on'); $('dwClose').focus(); }); }\nfunction dwClose(){ if(!dw) return; dw=null; $('drawer').classList.remove('on'); document.body.classList.remove('dw-on'); setTimeout(()=>{ if(!dw) $('drawer').hidden=true; },220); if(dwBack&&dwBack.focus&&document.contains(dwBack)) dwBack.focus(); }\nfunction dwTxs(){ if(!R) return []; if(dw.mode==='cell') return (R.txByCell.get(dw.k)||[]); if(dw.mode==='partner'){ const a=R.tx.filter(t=>(pkey(t.l.partner)||'（取引先なし）')===dw.p); const pl=a.filter(t=>!isBS(t.l.account)); return pl.length?pl:a; } return R.tx.filter(t=>t.l.tax===dw.tax&&filterPass(t.l.account)); }\nfunction sumBy(ts,fn){ const m=new Map(); ts.forEach(t=>{ const k=fn(t); const o=m.get(k)||{k,n:0,dr:0,cr:0,lv:0,t}; o.n++; o.dr+=t.l.dr; o.cr+=t.l.cr; o.lv=Math.max(o.lv,t.lv); m.set(k,o); }); return [...m.values()]; }\nfunction renderDrawer(){\n  if(!dw||!R) return; const el=$('dwBody');\n  let title='', sub='', head='';\n  if(dw.mode==='cell'){ const c=R.cells.get(dw.k); if(!c){ dwClose(); return; } const s=R.sus.find(x=>x.k===dw.k), p=R.pcells.get(dw.k);\n    title=`${c.account}<span class=\"chip\">${esc(c.tax)}<\/span>`; sub=`<span class=\"tag ${isBS(c.account)?'bs':''}\">${isBS(c.account)?'BS':'PL'}<\/span><span class=\"num\">借 ${yen(c.dr)}<\/span><span class=\"num\">貸 ${yen(c.cr)}<\/span>${p?`<span class=\"num faint\">前期同期間 借 ${yen(p.dr)}／貸 ${yen(p.cr)}<\/span>`:''}${s?`<span class=\"lv l${s.lv}\">違和感 ${LV[s.lv]}<\/span>`:'<span class=\"faint\">違和感なし<\/span>'}`;\n    if(s) head=`<ul class=\"dwwhy\">${s.reasons.map(r=>`<li>${esc(r)}<\/li>`).join('')}<\/ul>`; }\n  else if(dw.mode==='partner'){ const ts=dwTxs(); const nm=(ts[0]&&ts[0].l.partner)||'（取引先なし）', st=pStatus(nm); const dr=ts.reduce((a,t)=>a+t.l.dr,0), cr=ts.reduce((a,t)=>a+t.l.cr,0);\n    title=`${esc(nm)}<span class=\"chip\">取引先<\/span>`; sub=`<span>${st?(st.st==='reg'?'インボイス登録あり':'登録なし'):'登録 未確認'}${st&&st.tno?' '+esc(st.tno):''}<\/span>${isCorp(nm)?'<span>法人<\/span>':''}<span class=\"num\">借 ${yen(dr)}<\/span><span class=\"num\">貸 ${yen(cr)}<\/span>`;\n    const bt=sumBy(ts,t=>t.l.account+'｜'+t.l.tax).sort((a,b)=>Math.max(b.dr,b.cr)-Math.max(a.dr,a.cr));\n    head=`<h4>科目・税区分ごと<\/h4><div class=\"dwtbl\"><table><thead><tr><th>勘定科目｜税区分<\/th><th class=\"r\">件数<\/th><th class=\"r\">借方<\/th><th class=\"r\">貸方<\/th><\/tr><\/thead><tbody>${bt.map(o=>`<tr><td>${esc(o.k)}<\/td><td class=\"r num\">${o.n}<\/td><td class=\"r num\">${o.dr?yen(o.dr):''}<\/td><td class=\"r num\">${o.cr?yen(o.cr):''}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`; }\n  else { const cs=[...R.cells.values()].filter(c=>c.tax===dw.tax&&filterPass(c.account)); const dr=cs.reduce((a,c)=>a+c.dr,0), cr=cs.reduce((a,c)=>a+c.cr,0);\n    title=`税区分「${esc(dw.tax)}」の全科目`; sub=`<span>${cs.length}科目${mxFilter==='pl'?'（PLだけ）':mxFilter==='bs'?'（BSだけ）':''}<\/span><span class=\"num\">借 ${yen(dr)}<\/span><span class=\"num\">貸 ${yen(cr)}<\/span>`;\n    const susK=new Map(R.sus.map(s=>[s.k,s]));\n    head=`<h4>科目ごと<\/h4><div class=\"dwtbl\"><table><thead><tr><th>勘定科目<\/th><th class=\"r\">件数<\/th><th class=\"r\">借方<\/th><th class=\"r\">貸方<\/th><th><\/th><\/tr><\/thead><tbody>${cs.sort((a,b)=>Math.max(b.dr,b.cr)-Math.max(a.dr,a.cr)).map(c=>{ const k=c.tax+'\\u241E'+c.account, s=susK.get(k), n=(R.txByCell.get(k)||[]).length; return `<tr class=\"clk\" data-cell=\"${esc(k)}\" tabindex=\"0\"><td><span class=\"tag ${isBS(c.account)?'bs':''}\">${isBS(c.account)?'BS':'PL'}<\/span> ${esc(c.account)}<\/td><td class=\"r num\">${R.hasLines?n:'―'}<\/td><td class=\"r num\">${c.dr?yen(c.dr):''}<\/td><td class=\"r num\">${c.cr?yen(c.cr):''}<\/td><td>${s?`<span class=\"lv l${s.lv}\">${LV[s.lv]}<\/span>`:''}<\/td><\/tr>`; }).join('')}<\/tbody><\/table><\/div>`; }\n  $('dwTitle').innerHTML=title; $('dwSub').innerHTML=sub;\n  if(!R.hasLines){ el.innerHTML=head+`<div class=\"dwnone\"><b>取引の明細がまだありません<\/b><p>いま入っているのは集計（区分別表）だけなので、合計金額しか分かりません。取引を1件ずつ見るには、freeeで<b>仕訳帳のCSV<\/b>を出して「01 取込」に入れてください（この科目だけ見たいなら、この科目の<b>総勘定元帳のCSV<\/b>でも大丈夫です）。<\/p><\/div>`; wireDrawer(); return; }\n  const all=dwTxs();\n  const cats=sumBy(all,t=>t.cat).sort((a,b)=>Math.max(b.dr,b.cr)-Math.max(a.dr,a.cr)); const tot=Math.max(1,...cats.map(o=>Math.max(o.dr,o.cr)));\n  const keys=sumBy(all,t=>(dw.mode!=='cell'?t.l.account+'｜':'')+t.key).sort((a,b)=>b.n-a.n||Math.max(b.dr,b.cr)-Math.max(a.dr,a.cr));\n  let ts=all.filter(t=>(!dw.cat||t.cat===dw.cat)&&(!dw.key||((dw.mode!=='cell'?t.l.account+'｜':'')+t.key)===dw.key));\n  const q=dw.q.trim().toLowerCase(); if(q) ts=ts.filter(t=>((t.l.memo||t.l.cmemo)+' '+t.l.partner+' '+t.l.counter+' '+t.l.account).toLowerCase().includes(q));\n  const srt={date:(a,b)=>a.l.date.localeCompare(b.l.date),amt:(a,b)=>Math.max(b.l.dr,b.l.cr)-Math.max(a.l.dr,a.l.cr),lv:(a,b)=>b.lv-a.lv||a.l.date.localeCompare(b.l.date)}[dw.sort];\n  ts=ts.slice().sort(srt); const sdr=ts.reduce((a,t)=>a+t.l.dr,0), scr=ts.reduce((a,t)=>a+t.l.cr,0);\n  el.innerHTML=head+`\n    <h4>摘要の種類ごと <span class=\"faint small\">押すと下の一覧を絞り込み<\/span><\/h4>\n    <div class=\"dwcats\">${cats.map(o=>`<button type=\"button\" class=\"dwcat ${dw.cat===o.k?'on':''}\" data-cat=\"${o.k}\"><span class=\"nm\">${esc(CATN2[o.k])}<\/span><span class=\"num\">${o.n}件<\/span><span class=\"num\">${o.dr?'借 '+yen(o.dr):''}${o.dr&&o.cr?'／':''}${o.cr?'貸 '+yen(o.cr):''}<\/span><span class=\"bar\"><i style=\"width:${Math.round(Math.max(o.dr,o.cr)/tot*100)}%\"><\/i><\/span><\/button>`).join('')}<\/div>\n    <h4>よく出る摘要 <span class=\"faint small\">上位${Math.min(12,keys.length)}件<\/span><\/h4>\n    <div class=\"dwtbl\"><table><thead><tr><th>摘要（数字などを除いてまとめたもの）<\/th><th class=\"r\">件数<\/th><th class=\"r\">借方<\/th><th class=\"r\">貸方<\/th><th>前期の同じ摘要<\/th><\/tr><\/thead><tbody>${keys.slice(0,12).map(o=>`<tr class=\"clk ${dw.key===o.k?'on':''}\" data-key=\"${esc(o.k)}\" tabindex=\"0\"><td>${o.lv?`<span class=\"lv l${o.lv}\">${LV[o.lv]}<\/span> `:''}${esc(o.k)}<\/td><td class=\"r num\">${o.n}<\/td><td class=\"r num\">${o.dr?yen(o.dr):''}<\/td><td class=\"r num\">${o.cr?yen(o.cr):''}<\/td><td class=\"small faint\">${esc(o.t.prevTaxes||'―')}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>\n    <h4>取引の一覧<\/h4>\n    <div class=\"dwtools\"><input type=\"search\" id=\"dwQ\" placeholder=\"摘要・取引先で絞り込み\" value=\"${esc(dw.q)}\" aria-label=\"取引を絞り込み\">\n      <select id=\"dwSort\" aria-label=\"並び順\"><option value=\"date\" ${dw.sort==='date'?'selected':''}>日付順<\/option><option value=\"amt\" ${dw.sort==='amt'?'selected':''}>金額の大きい順<\/option><option value=\"lv\" ${dw.sort==='lv'?'selected':''}>違和感の高い順<\/option><\/select>\n      ${dw.cat||dw.key?`<button class=\"pill\" type=\"button\" id=\"dwClr\">絞り込みを外す（${esc(dw.cat?CATN2[dw.cat]:dw.key)}）<\/button>`:''}\n      <span class=\"small muted\">${ts.length}件　借 ${yen(sdr)}／貸 ${yen(scr)}<\/span><\/div>\n    <div class=\"dwtbl\"><table class=\"dwtx\"><thead><tr><th><\/th><th>取引日<\/th>${dw.mode!=='cell'?'<th>勘定科目<\/th>':''}<th>取引先<\/th><th>摘要<\/th><th>相手科目<\/th><th class=\"r\">借方<\/th><th class=\"r\">貸方<\/th><th>仮修正の案<\/th><\/tr><\/thead><tbody>${ts.slice(0,dw.limit).map(t=>`<tr class=\"f${t.lv} ${t.done?'done':''}\"><td>${t.lv?`<span class=\"lv l${t.lv}\">${LV[t.lv]}<\/span>`:''}<\/td><td class=\"num\">${t.l.date}<\/td>${dw.mode!=='cell'?`<td>${esc(t.l.account)}<div class=\"small faint\">${esc(t.l.tax)}<\/div><\/td>`:''}<td>${esc(t.l.partner)}<\/td><td>${esc(t.l.memo||t.l.cmemo)}${t.done?'<div class=\"small faint\">直し済み（推定）<\/div>':''}<\/td><td>${esc(t.l.counter)}<\/td><td class=\"r num\">${t.l.dr?yen(t.l.dr):''}<\/td><td class=\"r num\">${t.l.cr?yen(t.l.cr):''}<\/td><td class=\"small\">${t.fix?`<span class=\"fx ${t.fix.kind}\">${FXN[t.fix.kind]}<\/span>${t.fix.to?esc('→ '+t.fix.to):''}`:''}${jget(t)?` <span class=\"small faint\">判断：${JN[jget(t)]}<\/span>`:''}<\/td><\/tr>`).join('')||`<tr><td colspan=\"9\" class=\"empty\">該当する取引はありません<\/td><\/tr>`}<\/tbody><\/table><\/div>\n    ${ts.length>dw.limit?`<div class=\"btns\" style=\"justify-content:center\"><button class=\"btn line sm\" type=\"button\" id=\"dwMore\">さらに表示（残り${ts.length-dw.limit}件）<\/button><\/div>`:''}`;\n  wireDrawer();\n}\nfunction wireDrawer(){ const el=$('dwBody');\n  el.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{ dw.cat=dw.cat===b.dataset.cat?null:b.dataset.cat; dw.key=null; dw.limit=200; renderDrawer(); }));\n  el.querySelectorAll('tr[data-key]').forEach(r=>{ const f=()=>{ dw.key=dw.key===r.dataset.key?null:r.dataset.key; dw.cat=null; dw.limit=200; renderDrawer(); }; r.addEventListener('click',f); r.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); f(); } }); });\n  el.querySelectorAll('tr[data-cell]').forEach(r=>{ const f=()=>{ select(r.dataset.cell); dwOpen({mode:'cell',k:r.dataset.cell},dwBack); }; r.addEventListener('click',f); r.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); f(); } }); });\n  if($('dwQ')) $('dwQ').addEventListener('input',e=>{ dw.q=e.target.value; const pos=e.target.selectionStart; renderDrawer(); const n=$('dwQ'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} });\n  if($('dwSort')) $('dwSort').addEventListener('change',e=>{ dw.sort=e.target.value; renderDrawer(); });\n  if($('dwClr')) $('dwClr').addEventListener('click',()=>{ dw.cat=null; dw.key=null; renderDrawer(); });\n  if($('dwMore')) $('dwMore').addEventListener('click',()=>{ dw.limit+=300; renderDrawer(); });\n  $('dwTo3').hidden=dw.mode!=='cell';\n}\nfunction setupDrawer(){\n  document.body.appendChild($('drawer'));\n  $('dwClose').addEventListener('click',dwClose); $('dwBg').addEventListener('click',dwClose);\n  $('dwTo3').addEventListener('click',()=>{ const k=dw&&dw.k; dwClose(); if(k){ select(k,true); } });\n  document.addEventListener('keydown',e=>{ if(dw&&e.key==='Escape'){ e.preventDefault(); dwClose(); } });\n}\n/* ---------- sample (fictional) ---------- */\nfunction sampleCSV(rows){\n  const H=['取引日','伝票番号','決算整理仕訳','借方勘定科目','借方税区分','借方取引先','借方金額','借方備考','貸方勘定科目','貸方税区分','貸方取引先','貸方金額','貸方備考','摘要'];\n  return [H.map(v=>`\"${v}\"`).join(','),...rows.map((r,i)=>{ const [d,da,dt,ca,ct,p,a,m]=r; return [d,i+1,'0',da,dt,p,a,'',ca,ct,p,a,'',m].map(v=>`\"${v}\"`).join(','); })].join('\\n');\n}\nfunction sampleFiles(){\n  const P=[],C=[]; const mm=n=>String(n).padStart(2,'0');\n forEach(m=>C.push([`2026-${mm(m)}-15`,'販売促進費','課対仕入10%','普通預金','対象外','紹介者サンプル（個人）',55000,'紹介料']));\n  C.push(['2026-03-15','支払手数料','対象外','現金','対象外','',300,'住民票取得手数料']);\n  C.push(['2026-04-12','租税公課','対象外','現金','対象外','',2000,'収入印紙']);\n  C.push(['2026-05-20','寄付金','対象外','事業主貸','対象外','',10000,'寄付']);\n  C.push(['2026-04-01','敷金','課対仕入10%','普通預金','対象外','見本不動産（個人）',110000,'倉庫賃貸 礼金']);\n  return [Object.assign(parseFile('サンプル_仕訳帳_前期（架空の事務所）.csv',sampleCSV(P)),{sample:true}),Object.assign(parseFile('サンプル_仕訳帳_当期（架空の事務所）.csv',sampleCSV(C)),{sample:true})];\n}\nfunction loadSample(){ ensureSample(); go('#/c/sample'); }\n\n/* ---------- events ---------- */\nasync function addFiles(list){\n  const add=[];\n  for(const f of list){ const txt=decode(await f.arrayBuffer()); const p=Object.assign(parseFile(f.name,txt),{raw:txt});\n    if(p.lines.length||p.kubun.length) add.push(p);\n    else $('notices').insertAdjacentHTML('afterbegin',`<div class=\"note hi\"><i>注<\/i><div><b>「${esc(f.name)}」を読み取れませんでした<\/b>freeeの仕訳帳・総勘定元帳・消費税区分別表のCSVを選んでください。<\/div><\/div>`); }\n  if(!add.length) return;\n  if(isSample&&curCo!=='sample'){ files=[]; isSample=false; sel=null; }\n  for(const p of add){ files=files.filter(f=>f.name!==p.name); files.push(p); }\n  const first=!R; pressed=false; if(first){ const c=coGet(curCo); if(c) delete c.period; } fillPeriod(); savePeriod(); renderAll(); saveCoFiles(); toastBar(`${add.length}件のCSVを取り込みました`);\n}\nfunction fillCfgUI(){ $('cfg-master').value=cfg.master; ['discount','shipping','service','passthru'].forEach(c=>$('cfg-'+c).value=cfg.kw[c].join('\\n'));\n  $('cfg-qualified').value=cfg.qualified.join('\\n'); $('cfg-individual').value=cfg.individual.join('\\n'); $('thr').value=cfg.threshold; }\nconst lines=v=>v.split('\\n').map(s=>s.trim()).filter(Boolean);\nfunction toast(id,msg){ $(id).textContent=msg; setTimeout(()=>$(id).textContent='',2600); }\nfunction copy(ta,t){ const v=$(ta).value; const fb=()=>{ $(ta).focus(); $(ta).select(); toast(t,'選択しました。Ctrl+C（⌘+C）でコピーしてください'); };\n  try{ navigator.clipboard.writeText(v).then(()=>toast(t,'コピーしました'),fb); }catch(e){ fb(); } }\nfunction setup(){\n  const drop=$('drop');\n  $('file').addEventListener('change',e=>{ addFiles([...e.target.files]); e.target.value=''; });\n  drop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('file').click(); } });\n  ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.add('over'); }));\n  ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.remove('over'); }));\n  drop.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));\n  document.addEventListener('dragover',e=>e.preventDefault()); document.addEventListener('drop',e=>e.preventDefault());\n  $('clear').addEventListener('click',()=>{ if(!files.length) return; const keep=files.slice(), smp=isSample; files=[]; isSample=false; sel=null; renderAll(); saveCoFiles(); const u=$('undo'); u.hidden=false; u.innerHTML='<span>すべてのファイルを取り消しました。<\/span><button class=\"btn line sm\" type=\"button\" id=\"undoAll\">元に戻す<\/button>'; $('undoAll').addEventListener('click',()=>{ files=keep; isSample=smp; u.hidden=true; pressed=false; keepPeriod(); renderAll(); saveCoFiles(); }); clearTimeout(u._h); u._h=setTimeout(()=>u.hidden=true,12000); });\n  ['fy','fm','ty','tm'].forEach(id=>$(id).addEventListener('change',()=>{ savePeriod(); renderAll(); }));\n  $('thr').addEventListener('change',()=>{ cfg.threshold=Math.max(0,Number($('thr').value)||0); saveCfg(); renderAll(); });\n  $('cLow').addEventListener('change',()=>R&&($('outC').value=buildClaude()));\n  $('mLow').addEventListener('change',()=>R&&($('outM').value=buildMemo()));\n  $('fLow').addEventListener('change',()=>R&&($('outF').value=buildFix()));\n  $('copyF').addEventListener('click',()=>copy('outF','toastF'));\n  $('selpill').addEventListener('click',scrollTo3);\n  document.addEventListener('keydown',onKey);\n  $('r <script>(function(root){
'use strict';
// KubunHost: 消費税区分別チェッカーを、この画面の中で同じ会社・同じテーマで動かす。
// チェッカー本体は単体版と同じコードを、画面内の独立した枠（iframe）で動かすため、判定・保存の仕組みは変わらない。

 f.srcdoc=root.__KUBUN_SRC||'<p>消費税区分チェックを読み込めませんでした。</p>';
 box.append(f);doc.body.append(box);H.box=box;H.frame=f;
 return H.ready;
};

H.whenReady=(ms=5000)=>{if(H.bridge)return Promise.resolve(H.bridge);return Promise.race([H.ensure(),new Promise((_,rej)=>setTimeout(()=>{H.failed=true;rej(new Error('消費税区分チェックを準備できませんでした'));},ms))]);};

 const bar=doc.getElementById('kubunBar'),bh=bar?bar.getBoundingClientRect().height+12:0;
 const want=Math.max(520,Math.round(root.innerHeight-nh-bh-22));if(Math.abs(s.offsetHeight-want)>2)s.style.height=want+'px';
 const r=s.getBoundingClientRect(),st=H.box.style;

 if(st.top!==top)st.top=top;if(st.left!==left)st.left=left;if(st.width!==w)st.width=w;if(st.height!==h)st.height=h;

 <main class="main"><header class="topbar"><div class="breadcrumb"><span class="workspacebadge">作業スペース</span>${company&&view!=='companies'?`<button data-view="companies" class="crumbback">会社一覧</button><span class="crumbslash">/</span><strong class="activecompany">${esc(company.name)}</strong><span class="crumbslash">/</span>`:''}<strong>${esc(navs.find(x=>x[0]===view)?.[1]||'会社一覧')}</strong></div><div class="flex"><span id="saveStatus" class="small saveindicator" data-save-state="${saveState}" aria-live="polite">${saveLabel()}</span><span class="localpill">LOCAL · API料金 0円</span></div></header>

function heading(eyebrow,title,subtitle,buttons=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${buttons}</div></div>`;}
function detailsHelp(){return `<section class="panel monthly-panel"><div class="panelhead"><h2>2.6：品目・メモを含めて確認する</h2><button class="btn small" data-view="context">取引の情報へ</button></div><div class="panelbody"><ol class="steps"><li>「当期の仕訳帳」から、品目・部門・メモ等を含めたCSVを置き換え読込。プレビューで各列の対応と件数を確認。</li><li>「取引の情報」で借方・貸方を分けて表示。品目・メモ・管理番号で検索し、各行の元CSV全列を開けます。</li><li>確認候補では「この指摘に使った記載」と元の列名を参照。科目・金額に加え、用途・負担者・契約の記載と過去処理を照合します。</li><li>タグや承認状態だけで正誤を確定せず、確認した事実をメモ。外部送信・有料API・自動修正はありません。</li></ol><p class="small" style="margin-top:14px">旧版で読込済みのCSVは、一部の項目の原文が保存されていません。新しい版で元CSVを置き換え読込すると全列を保持できます。更新時は確認済みの項目を再確認に戻し、記入したメモを保持します。空欄やCSVに出ていない証憑の内容は推測で補いません。</p></div></section>`;}
function monthlyHelp(){return `<section class="panel monthly-panel"><div class="panelhead"><h2>2.5：月次PL・BSから確認する</h2><button class="btn small" data-view="monthly">月次画面へ</button></div><div class="panelbody"><ol class="steps"><li>会社を選び、月次PL・BS画面で対象期間を設定。</li><li>freeeの仕訳帳を、借方・貸方の取引先・品目・部門の列を含めて全件読込。単月PLと月末BS（円単位・年付き年月・内訳を閉じたCSV）も読み込むと、帳票の金額と照合しながら分析できます。BSが未読込でも、仕訳から各月の増減を表示します。</li><li>帳票形式の表は freee の月次推移と同じ階層です。科目名の▶を押すと「取引先別・品目別・部門別」が開き、さらに▶で「未選択」と各タグの月別金額が出ます。BSの内訳は「月末残高」（期首残高の内訳は別の行）と「当月の増減」を切り替えられます。</li><li>科目を開くと「変動の理由（仕訳から推測）」に、月ごとの前月差と主な内訳・推測が並びます。色付きの金額は前月から大きく動いた月です。</li><li>金額・内訳・理由の行・「大きく動いた科目と理由」のカードを押すと、右側にその月の分析が開きます。「取引から分かること」（前月→当月、主な取引先・品目、相手科目、最大の取引）と「理由の推測」（確からしさ 高・中・低）を分けて表示し、根拠の仕訳を金額の大きい順に確認できます。◀▶で前後の月へ移れます。</li><li>推測の例：個人名の取引先への送金による事業主貸の増加、カード利用と口座引落しの差、引落し・給与・家賃の計上月のずれ（2か月分）、隔月の取引、自動車税など例年の時期の税金、年払い、新規の取引先、入金の遅れ。「AIに相談する文章をコピー」で、根拠の仕訳付きの質問文も作れます。</li><li>売掛金の未決済一覧を追加し、実際に確認できた残額の基準日・全件の範囲を記録。銀行入金と請求書を照合し、メモに残します。</li></ol><p style="margin-top:16px">推測は仕訳の科目・取引先・品目・摘要・相手科目・前年同月から作った候補で、事実ではありません。証憑・通帳・お客様への確認で確かめてからメモに残してください。千円・累計PL・期首残高の不足では、正確な照合はできません。</p></div></section>`;}
function historyHelp(){return `<section class="panel" style="margin-top:20px"><div class="panelhead"><h2>1.1：過去履歴と先生デスク</h2></div><div class="panelbody"><p>「過去の仕訳帳」から同一顧客の複数年CSVを追加。標準は蓄積で、対象開始月より前を参照します。旧版の前期データと確認メモもバックアップから引き継げます。</p><p style="margin-top:12px">取引先＋摘要・用途メモの正規化／3文字列の類似度50%以上を照合。双方に品目・部門がある場合、相違があれば弱い一致にとどめます。仕訳番号があり、過去3仕訳以上・最多科目80%以上で、過去にない科目差を候補にします。索引ごとに直近300件が上限です。これは統計的な処理パターン集計で、AIモデルの再学習ではありません。</p><p style="margin-top:12px">「先生デスク」は過去の仕訳例・検証したルール・確認手順を使う案内型Q&A。外部AI・API料金はありません。自由な文脈理解、税務条件の自動判定、修正仕訳の自動作成は含みません。決算整理の指定・摘要・負の金額による除外にも見落としがあり、過去に一致してもチェックを自動完了にしません。</p></div></section>`;}
function settings(){const p=session.project;return `<form id="settings" class="panel settings"><div class="field grow"><label for="projectName">案件名</label><input id="projectName" name="name" value="${esc(p.name)}" maxlength="100"></div><div class="field"><label for="entityType">事業者</label><select id="entityType" name="type"><option value="individual" ${p.type==='individual'?'selected':''}>個人事業主</option><option value="corp" ${p.type==='corp'?'selected':''}>法人</option></select></div><div class="field"><label for="periodStart">対象開始月</label><input id="periodStart" name="start" type="month" value="${p.start}" required></div><div class="field"><label for="periodEnd">対象終了月</label><input id="periodEnd" name="end" type="month" value="${p.end}" required></div><button class="btn primary" type="submit">再チェック</button></form>`;}
function reviewPage(){
 const fs=result.findings,open=fs.filter(f=>decision(f.id).status==='open').length,manual=result.coverage.filter(c=>!c.disabled&&(c.state==='手動確認'||c.state==='資料未読込')).length,matched=result.coverage.filter(c=>!c.disabled&&!['手動確認','資料未読込'].includes(c.state)).length,total=result.coverage.filter(c=>!c.disabled).length;
 const rows=fs.filter(f=>(filter==='all'||filter==='open'&&decision(f.id).status==='open'||filter==='difference'&&f.level==='difference'||filter==='info'&&f.level==='info')&&(!search||`${f.title} ${f.reason} ${E.CHECKS.find(c=>c.key===f.check)?.title} ${(f.why?.tags||[]).join(' ')}`.includes(search)));
 return heading('REVIEW WORKSPACE','自計化レビュー','確認候補を見つけ、根拠を読んで、メモに残す。',`<button class="btn" data-action="backup">${icon('download')}バックアップ</button><button class="btn primary" data-view="data">${icon('plus')}資料を読み込む</button>`)+settings()+`<div class="stats"><div class="stat"><div class="statlabel">${icon('data')}対象の仕訳行</div><div class="statvalue">${result.current.length.toLocaleString()}<small>行</small></div><div class="statnote">${session.project.start} — ${session.project.end}</div></div><div class="stat gold"><div class="statlabel">${icon('review')}未確認の候補</div><div class="statvalue">${open}<small>件</small></div><div class="statnote">候補数 ≠ 誤りの数</div></div><div class="stat"><div class="statlabel">${icon('check')}抽出を実行した項目</div><div class="statvalue">${matched}<small>/ ${total}</small></div><div class="statnote">実施数 ≠ 正しさの保証</div></div><div class="stat"><div class="statlabel">${icon('book')}資料・手動確認が必要</div><div class="statvalue">${manual}<small>項目</small></div><div class="statnote">チェックシートで確認状況を記録</div></div></div>${!session.project.complete&&result.current.length?'<div class="notice">このCSVの網羅性は未指定です。貸借差額は読込内容の確認として表示し、欠落月の検出は停止中。 <button class="btn small" data-view="data">資料の設定を確認</button></div>':''}<div class="reviewgrid"><section class="panel"><div class="panelhead"><h2>確認キュー</h2><span class="small">${fs.length}件の候補</span></div><div class="filters">${[['all','すべて'],['open','未確認'],['difference','残高・金額差'],['info','ヒント・資料確認']].map(([k,t])=>`<button class="chip ${filter===k?'active':''}" data-filter="${k}">${t}</button>`).join('')}<input id="search" class="search" placeholder="科目・取引先で検索" aria-label="確認候補を検索" value="${esc(search)}"></div><div id="findingList">${!result.current.length&&!session.imports.length&&!fs.length?emptyReview():rows.length?rows.slice(0,200).map(findingRow).join(''):`<div class="empty"><div class="emptyicon">${icon('checkmark')}</div><h2>${fs.length?'条件に一致する候補がありません':'抽出条件に該当する候補はありません'}</h2><p>読み込んだ範囲と現在のルールでの結果です。資料未読込・手動確認の項目はチェックシートに残っています。</p><button class="btn" data-view="check">チェックシートを確認</button></div>`}</div><div class="review-footer">表示は最大200件。抽出・メモ出力は全候補が対象。税区分の全件判定は含みません。</div></section><aside id="teacherPanel" class="panel teacher">${teacherPanel()}</aside></div><section class="panel coverage"><div class="panelhead"><h2>チェックの見通し</h2><button class="btn small" data-view="check">全項目を確認</button></div><div class="tablewrap"><table class="datatable"><thead><tr><th>項目</th><th>実行状況</th><th>追加で必要な資料</th></tr></thead><tbody>${result.coverage.filter(c=>!c.disabled).slice(0,7).map(c=>`<tr><td><span class="checkcode">${c.code}</span><br>${c.title}</td><td><span class="badge ${c.count?'warn':''}">${c.state}</span></td><td>${c.needs}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function emptyReview(){return `<div class="empty"><div class="emptyicon">${icon('upload')}</div><h2>仕訳帳CSVから始めよう</h2><p>一度読み込むと、重複候補・高額支出・月次変動・私的支出の候補をまとめて確認できます。</p><div class="actions"><button class="btn primary" data-action="import" data-type="current">${icon('upload')}CSVを読み込む</button><button class="btn" data-action="demo">操作サンプルを試す</button></div><p class="tinyline">全処理は端末内。freeeへの接続・自動修正は行いません。</p></div>`;}
function findingRow(f){const c=E.CHECKS.find(c=>c.key===f.check),d=decision(f.id);return `<button class="finding ${selected===f.id?'selected':''}" data-finding="${f.id}"><span class="flag ${f.level==='difference'?'diff':f.level==='info'?'info':''}">${f.level==='difference'?'≠':f.level==='info'?(f.dataReview?'?':'+'):'!'}</span><span class="findingbody"><span class="findingtitle">${esc(f.title)}</span><span class="findingmeta"><span>${c?.code||''} · ${c?.title||''}</span><span class="badge ${d.status==='resolved'?'ok':d.status==='ask'?'warn':''}">${decisionNames[d.status]||'未確認'}</span>${(f.why?.tags||[]).filter(t=>t!=='高額').slice(0,3).map(t=>`<span class="ftag">${esc(t)}</span>`).join('')}</span>${rowDates(f)?`<span class="finddates">${icon('calendar')}<span>${esc(rowDates(f))}${mainRow(f)?`<span class="findmain">${esc(mainRow(f))}</span>`:''}</span></span>`:''}<span class="findingtext">${esc(f.reason)}</span></span><span class="findingamount">${f.dataReview?'判定保留':money(f.amount)}<br><span class="small">${f.rows.length}行</span></span></button>`;}
function teacherPanel(){const f=result.findings.find(x=>x.id===selected);const header=`<div class="teacherhead"><div class="teacheravatar">L</div><div><h2>レビュー・ガイド</h2><div class="small">チェック理由と次の一手</div></div></div>`;if(!f)return header+`<div class="teacherbody"><p>左の確認候補を選ぶと、なぜ気になるのか、何を確認すれば判断できるかを説明します。</p><div class="teachsection"><h3>この先生の仕組み</h3><p>チェックシートと公開資料に基づくルールの解説です。外部AIの自由回答ではありません。</p></div></div>`;const d=decision(f.id),sources=f.sources.map(id=>E.SOURCES.find(s=>s.id===id)).filter(Boolean);return header+`<div class="teacherbody"><div class="badge ${f.level==='difference'?'red':f.level==='info'?'':'warn'}">${f.level==='difference'?'数値の差額を検出':f.level==='info'?(f.dataReview?'読込内容の確認':'効率化のヒント'):'確認候補・誤り未確定'}</div><h2 class="detailtitle" style="margin-top:11px">${esc(f.title)}</h2>${balanceSummary(f)}${window.ReviewVariance?window.ReviewVariance.findingHTML(f,session,result):''}${INS?INS.panel(f):''}<div class="teachsection"><h3>${f.why?'判断するときの注意':'なぜ気になる？'}</h3><p>${esc(f.lesson)}</p></div><div class="teachsection"><h3>次に確認すること</h3><ol class="steps">${f.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>${topRows(f)}<div class="teachsection"><h3>検出した明細</h3><div class="evidence">${esc(evidenceText(f,8))}${f.rows.length>8?`\n…ほか ${f.rows.length-8}行（全行をメモ出力）`:''}</div></div>${D.panel(f)}<div class="teachsection"><h3>抽出の根拠</h3><p class="small">${esc(f.basis)}</p>${sources.map(s=>s.url?`<a href="${s.url}" target="_blank" rel="noopener noreferrer" class="small">${esc(s.name)}</a><br>`:`<span class="small">${s.name}</span><br>`).join('')}${INS?INS.glossaryHTML(f):''}</div><label class="small" for="decisionStatus">確認状況</label><select id="decisionStatus">${Object.entries(decisionNames).map(([k,t])=>`<option value="${k}" ${d.status===k?'selected':''}>${t}</option>`).join('')}</select><label class="small" for="decisionNote" style="display:block;margin-top:10px">確認した事実・質問</label><textarea id="decisionNote" placeholder="例：3月分は4月に登録。契約書の月額と一致。">${esc(d.note)}</textarea><button class="btn primary" data-action="saveDecision">${icon('checkmark')}確認記録を保存</button><button class="btn" data-action="copyFinding">${icon('copy')}この候補のメモをコピー</button></div>`;}
function evidenceText(f,limit=Infinity){return f.rows.slice(0,limit).map(r=>{if(r.statement)return `${r.date}｜${r.statement} ${r.account}\n${r.amount===null?'未読込':money(r.amount)}｜${r.source||''} ${r.line}行`;if(r.balance!==undefined)return `${r.date}｜${r.account} ${r.party||''}\n帳簿 ${money(r.balance)}${r.expected!==null?`／資料 ${money(r.expected)}`:''}｜元CSV ${r.line}行`;if(r.due)return `${r.date||'発生日なし'}｜${r.account} ${r.party||''}\n期日 ${r.due}｜未決済 ${money(r.amount)}｜基準日 ${r.asOf||session.financial.agingAsOf||'未確認'}｜元CSV ${r.line}行`;if(r.debit!==undefined)return `${r.date}｜仕訳 ${r.id}｜${r.party||r.debitParty||r.creditParty||'取引先なし'}\n${r.debit} ${money(r.debitAmount)} ／ ${r.credit} ${money(r.creditAmount)}\n${r.description||'摘要なし'}｜${r.source||''} ${r.line}行${D.evidenceText(r,r.side)?'\n'+D.evidenceText(r,r.side):''}`;return `${r.date}｜${r.description||r.party||'内容なし'}｜${money(r.amount)}｜元CSV ${r.line}行`;}).join('\n\n');}
function dataPage(){const p=session.project;return heading('SOURCE MATERIAL','資料の読込','CSVの列を確認してから取り込む。データはこのブラウザに保存。',`<button class="btn" data-action="restore">${icon('refresh')}バックアップ復元</button><button class="btn" data-action="backup">${icon('download')}バックアップ</button><button class="btn danger" data-action="new">新規案件</button>`)+`<div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="CSVファイルを選択"><div>${icon('upload')}</div><h2>仕訳帳CSVをここにドロップ</h2><p>freee汎用CSV（新／旧）・UTF-8・Shift_JIS<br>PDF・画像・Excelファイルはこの版では解析できません。</p><button class="btn primary" data-action="import">ファイルを選ぶ</button></div><div class="panel panelbody"><label class="checklabel"><input type="checkbox" id="completeData" ${p.complete?'checked':''}><span><strong>当期の仕訳帳は、対象期間の全取引・全口座を含む</strong><br><span class="small">仕訳の全行・全科目を含むと確認した場合に、貸借差額と「計上のない月」を抽出します。読取エラーや番号不明は判定を保留します。未登録取引の影響は別途確認してください。</span></span></label><div class="tinyline">期間外の行はレビュー対象に含めません。現在：${p.start}〜${p.end}。読み込んだ行数と対象行数を照合してください。</div></div><div class="datasetcards">${Object.entries(E.TYPES).map(([key,t])=>datasetCard(key,t)).join('')}</div><section class="panel" style="margin-top:20px"><div class="panelhead"><h2>元資料との残高照合</h2><span class="small">1件ずつ追加できる</span></div><form id="balanceForm" class="panelbody"><div class="balanceform"><div class="field"><label for="balanceAccount">科目・口座</label><input id="balanceAccount" name="account" placeholder="例：普通預金" required></div><div class="field"><label for="balanceMonth">基準月</label><input id="balanceMonth" name="month" type="month" value="${p.end}" required></div><div class="field"><label for="balanceParty">口座・契約名</label><input id="balanceParty" name="party" placeholder="例：A信金 事業口座"></div><div class="field"><label for="balanceBook">freeeの月末残高</label><input id="balanceBook" name="balance" inputmode="decimal" placeholder="1,000,000" required></div><div class="field"><label for="balanceActual">通帳・返済表の残高</label><input id="balanceActual" name="expected" inputmode="decimal" placeholder="未確認なら空欄"></div><div><button class="btn primary full" type="submit">照合を追加</button></div></div></form></section><div class="notice" style="margin-top:20px">残高CSVは「月・勘定科目・取引先・帳簿残高・資料残高」の縦形式。月次PL・BSのCSVは専用の資料読込を利用してください。PDFの残高照合には、上の入力欄か残高テンプレートを使います。残高は科目の通常方向を正として入力します。</div>${session.imports.length?`<section class="panel"><div class="panelhead"><h2>読込履歴</h2></div><div class="tablewrap"><table class="datatable"><thead><tr><th>資料</th><th>ファイル</th><th>行数</th><th>読込日時</th></tr></thead><tbody>${session.imports.map(i=>`<tr><td>${E.TYPES[i.type]?.name||esc(i.type)}</td><td>${esc(i.name)}</td><td>${Number(i.count).toLocaleString()}</td><td>${esc(i.at?.slice(0,16).replace('T',' '))}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;}
function datasetCard(key,t){const count=session.datasets[key].length;const meta=session.imports.filter(i=>i.type===key).at(-1);const dates=session.datasets[key].map(r=>r.date).filter(Boolean).sort();return `<section class="panel dataset"><div class="datasetrow"><h3>${t.name}</h3><span class="badge ${count?'ok':''}">${count?count.toLocaleString()+'行':'未読込'}</span></div><p>${t.desc}</p><div class="rowactions"><button class="btn small" data-action="import" data-type="${key}">${icon('upload')}CSV読込</button><button class="btn small" data-action="template" data-type="${key}">テンプレート</button>${count?`<button class="btn small danger" data-action="removeDataset" data-type="${key}">削除</button>`:''}</div><div class="datasetstatus">${dates.length?`${dates[0]}〜${dates.at(-1)}`:'資料を読み込むと件数・期間を表示'}${meta?`<br>${esc(meta.name)}`:''}</div></section>`;}
function checkPage(){const completed=Object.values(session.manual).filter(x=>x.status==='done'||x.status==='na').length;return heading('REVIEW CHECKLIST','チェックシート','自動抽出と、資料を見て判断する項目を区別して記録。',`<button class="btn" data-action="backup">${icon('download')}記録を保存</button><button class="btn primary" data-view="memo">引継ぎメモを見る</button>`)+`<div class="notice">このシートには <strong>${E.CHECKS.length}項目</strong>。消費税チェックは手動記録として含めています。「抽出条件に該当なし」は確認完了ではありません。</div><div class="checkgrid">${result.coverage.map(c=>{const m=session.manual[c.key]||{status:'todo',note:''};return `<section class="panel checkcard"><header><span class="checkcode">${c.code}</span><span class="badge ${c.disabled?'':c.count?'warn':''}">${c.state}</span></header><h3>${c.title}</h3><p>${c.method}</p><div class="tinyline"><strong>必要な資料</strong>　${c.needs}</div>${c.key==='vat'&&KH?kubunCheckBox():''}${c.count?`<button class="btn small" style="margin-top:9px" data-action="showCheck" data-check="${c.key}">${c.count}件の候補を確認</button>`:''}<label for="manual_${c.key}" class="small" style="display:block;margin-top:12px">確認状況（人の判断）</label><select id="manual_${c.key}" data-manual-status="${c.key}"><option value="todo" ${m.status==='todo'?'selected':''}>未確認</option><option value="done" ${m.status==='done'?'selected':''}>確認済み</option><option value="ask" ${m.status==='ask'?'selected':''}>上司・お客様へ確認</option><option value="na" ${m.status==='na'?'selected':''}>該当なし（確認済み）</option><option value="defer" ${m.status==='defer'?'selected':''}>今回深追いせず</option></select><textarea aria-label="${c.title}の確認メモ" data-manual-note="${c.key}" placeholder="確認した資料・根拠・質問を記録">${esc(m.note)}</textarea></section>`;}).join('')}</div>`;}
function memoFor(f){const d=decision(f.id),c=E.CHECKS.find(c=>c.key===f.check),h=E.History.contextFor(result.history,f);return `【${c?.code} ${c?.title}】\n確認状況：${decisionNames[d.status]||'未確認'}\n候補：${f.title}\n気になる理由：${f.reason}\n${window.ReviewVariance?window.ReviewVariance.findingText(f,session,result):''}${INS?INS.memo(f):''}確認の観点：${f.lesson}\n${f.decisionEvidence?.length?'指摘に使った記載：'+f.decisionEvidence.join('／')+'\n':''}${f.contextNotes?.length?'取引情報を踏まえた確認：'+f.contextNotes.join('／')+'\n':''}明細：\n${evidenceText(f)}\n${h?.matches.length?'過去照合（候補の先頭仕訳）：\n'+E.History.contextText(h)+'\n':''}${d.note?'確認した事実・質問：'+d.note:'次の確認：'+f.steps.join(' → ')}\n対応：メモ記録のみ。修正仕訳未作成。`;}
function allMemo(){
 const p=session.project;
 const imports=session.imports.map(i=>`${E.TYPES[i.type]?.name||i.type} ${i.count}行${i.errors?'（読取エラー '+i.errors+'行を利用者指定で除外）':''}`).join('／')||'未読込';
 let txt=`${session.demo?'【操作サンプル・架空データ】\n':''}【自計化チェック 引継ぎメモ】\n案件：${p.name}\n対象期間：${p.start}〜${p.end}\n事業者：${p.type==='corp'?'法人':'個人事業主'}\n読込資料：${imports}\n対象仕訳：${result.current.length}行\nデータ範囲：${p.complete?'対象期間の全取引を含むと利用者指定':'網羅性未指定・欠落月抽出なし'}\n判定範囲：ルールによる確認候補の抽出。証憑の確認・税務判断は別途。\n修正仕訳：未作成\n\n`;
 const manualStatuses={todo:'未確認',done:'確認済み',ask:'確認依頼',na:'該当なし（確認済み）',defer:'今回深追いせず'};
 if(result.history)txt+=`過去履歴：蓄積 ${result.history.stats.uploaded}行／参照 ${result.history.stats.journals}仕訳（${session.project.start}より前）。過去の処理は正解の保証ではありません。\n\n`;
 txt+=result.findings.length?result.findings.map(memoFor).join('\n\n────────────\n\n'):'現在の抽出条件では候補なし。未読込・手動確認の項目は下記参照。';
 const currentIds=new Set(result.findings.map(f=>f.id)),oldNotes=Object.entries(session.decisions).filter(([id,d])=>!currentIds.has(id)&&typeof d?.note==='string'&&d.note.trim());
 if(oldNotes.length)txt+='\n\n【資料更新前などの確認メモ：現在の候補には未適用】\n'+oldNotes.map(([id,d])=>`${d.reviewLabel||'旧候補 '+id}${d.reviewPeriod?'／'+d.reviewPeriod:''}\n当時の記録：${decisionNames[d.status]||'未確認'}\n${d.note}`).join('\n\n');
 txt+='\n\n【チェックシート・確認範囲】\n'+result.coverage.map(c=>{const m=session.manual[c.key]||{status:'todo',note:''};return `${c.code} ${c.title}：${c.state}／人の確認：${manualStatuses[m.status]||'未確認'}${m.note?'\n  メモ：'+m.note:''}`;}).join('\n');
 txt+=kubunMemo();
 if(session.teacher.turns.length)txt+='\n\n【先生デスクの回答記録】\n'+teacherText();
 return txt;
}
function memoPage(){return heading('HANDOVER NOTES','引継ぎメモ','自計化アプリへ貼り付ける記録。読込範囲と未確認事項も残す。',`<button class="btn" data-action="downloadMemo">${icon('download')}テキスト保存</button><button class="btn primary" data-action="copyAll">${icon('copy')}メモをコピー</button>`)+`<section class="panel"><div class="notesummary">${session.project.start}〜${session.project.end}　·　${result.findings.length}件の確認候補　·　修正仕訳未作成</div><textarea id="memoText" class="memoarea" aria-label="引継ぎメモ（編集可能）"></textarea></section><p class="tinyline">この欄の直接編集は保存されません。各候補・チェックシートのメモ欄で記録するとバックアップにも残ります。</p>`;}
function helpPage(){return heading('REFERENCE LIBRARY','根拠と使い方','2026年10月2日確認。内部手順と税務の要件を分けて実装。')+`<div class="helpgrid"><section class="panel"><div class="panelhead"><h2>最初の3ステップ</h2></div><div class="panelbody"><ol class="steps"><li>レビュー画面で案件名・事業者・対象期間を設定。</li><li>freeeの仕訳帳を汎用CSVで出力し、資料の読込で列を確認。</li><li>確認キューの候補を選び、解説・元資料を確認してメモを保存。</li></ol><p style="margin-top:15px">試算表・通帳・返済表の残高は「元資料との残高照合」に入力。未登録明細と期日一覧はテンプレートで追加できます。</p><button class="btn" style="margin-top:17px" data-action="demo">操作サンプルを試す</button></div></section><section class="panel"><div class="panelhead"><h2>消費税区分（同じアプリ内）</h2></div><div class="panelbody"><ul><li>左のメニュー「消費税区分」で、消費税区分別チェッカーをそのまま使えます。判定の仕組み・画面・保存は単体版と同じです。</li><li>会社の選択とテーマは自計化レビューと共通。区分チェックの中で別の会社を開くと、こちらもその会社に切り替わります。</li><li>資料の読込で仕訳帳を入れるとき「消費税区分チェックにも同じCSVを入れる」を選ぶと、両方が同じ仕訳帳で動きます。読込済みの仕訳帳は「消費税区分」画面のボタンから後で入れることもできます。</li><li>全社バックアップ・会社のバックアップには、区分チェックの判断・学習ルール・取引先の登録状況・取り込んだCSVも含まれます（判定ルールの設定は含みません）。復元では今の記録を優先し、足りない分だけを補います。</li><li>区分チェックに入れた仕訳帳は「【当期】」「【過去】」の印付きの名前で保存します。資料の読込で「置き換える」を選ぶと、区分チェック側の同じ印のファイルも入れ替わります。</li><li>インボイスのない仕入の控除割合は、2026年10月1日〜2028年9月30日は7割（控70）として判定します（令和8年度改正）。</li></ul></div></section><section class="panel"><div class="panelhead"><h2>料金・データ・保存</h2></div><div class="panelbody"><ul><li>ネットワーク接続、外部AI API、決済処理、広告はありません。ローカル版の利用料は0円です。</li><li>CSVはブラウザの中で解析。読み込んだデータを外部へ送信しません。</li><li>データはこのブラウザのIndexedDBに自動保存。ブラウザデータ削除・別端末・ファイル移動で読めなくなる場合があります。</li><li>節目にJSONバックアップをダウンロード。復元で続きから再開できます。</li><li>「新規案件」は現在のデータを消します。保存したバックアップから復元できます。</li></ul></div></section><section class="panel"><div class="panelhead"><h2>できること・確認が必要なこと</h2></div><div class="panelbody"><p>重複候補、借貸差額、高額消耗品・修繕費、月次変動、私的支出らしい摘要、期日超過、残高差、自動登録ルールの候補を抽出します。</p><p style="margin-top:12px">請求書の内容、税務の特例、取引先の法人／個人、源泉徴収の義務、適格請求書の有効性、実際の入金・支払は自動確定できません。</p><p style="margin-top:12px">PDF・画像・Excelの解析、freeeの画面読取、修正、自由なAI相談はこの版の対象外。解説は検証したルールに対応する文章です。</p></div></section><section class="panel"><div class="panelhead"><h2>確認候補の抽出設定</h2></div><form id="thresholdForm" class="panelbody"><div class="field"><label for="largeThreshold">高額・変動差額の目安（円）</label><input id="largeThreshold" name="large" type="number" min="1" max="1000000000" step="1" value="${session.project.large}" required></div><div class="field" style="margin-top:12px"><label for="varianceThreshold">月次変動の目安（％）</label><input id="varianceThreshold" name="variance" type="number" min="1" max="1000" step="1" value="${Math.round(session.project.variance*100)}" required></div><p class="small" style="margin:15px 0">高額の金額は事務所の確定基準ではありません。初期値は10万円、月次変動50%。消耗品10万円・修繕費20万円はチェックシートの固定抽出条件です。</p><button class="btn primary" type="submit">設定を保存・再チェック</button></form></section></div><section class="panel" style="margin-top:20px"><div class="panelhead"><h2>ファクトチェックと参照元</h2><span class="small">確認日：2026-10-02</span></div><div class="panelbody"><div class="factcheck">高額修繕＝資産計上、預り金残高＝未納、法定福利費＝給与の一定割合、同額仕訳＝重複、といった断定は組み込んでいません。抽出した事実と、追加確認が必要な判断を分けています。</div>${E.SOURCES.map(s=>`<div class="sourceitem">${s.url?`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name}</a>`:`<strong>${s.name}</strong>`}<p>${s.note}</p></div>`).join('')}</div></section>`;}
function bindSettings(){
 const form=$('#settings');form.addEventListener('submit',e=>{
   e.preventDefault();const d=new FormData(form),start=d.get('start'),end=d.get('end'),months=E.monthRange(start,end);
   if(!months.length||months.at(-1)!==end)return toast('対象期間は開始〜終了の順で、36か月以内にしてください');
   const conditionsChanged=session.project.type!==d.get('type')||session.project.start!==start||session.project.end!==end;
   if(!['individual','corp'].includes(d.get('type')))return toast('個人事業主か法人かを選択してください');
   const company=W.current(workspace);try{W.update(workspace,company.id,{...company,name:d.get('name')||company.name,entityType:d.get('type')});}catch(err){return toast(err.message);}
   if(conditionsChanged){invalidateChecks();monthlyFocus=null;session.financial.agingComplete=false;}
   session.project={...session.project,type:d.get('type'),start,end};
   recompute();save();render();toast('対象期間で再チェックしました');
 });
}
function bindReview(){
 bindSettings();
 $('#search').addEventListener('input',e=>{search=e.target.value;const fs=result.findings.filter(f=>(filter==='all'||filter==='open'&&decision(f.id).status==='open'||filter==='difference'&&f.level==='difference'||filter==='info'&&f.level==='info')&&(!search||`${f.title} ${f.reason} ${E.CHECKS.find(c=>c.key===f.check)?.title} ${(f.why?.tags||[]).join(' ')}`.includes(search)));$('#findingList').innerHTML=fs.slice(0,200).map(findingRow).join('')||'<div class="empty">条件に一致する候補がありません</div>';});
}
function bindDropzone(){const z=$('#dropzone');z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag');});z.addEventListener('dragleave',()=>z.classList.remove('drag'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');forceType=null;queueFiles([...e.dataTransfer.files]);});z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseFiles(null);}});}
function chooseFiles(type){const c=W.current(workspace);if(!c)return toast('会社一覧で対象の会社を選んでください');if(!c.entityType){showCompanyDialog(c.id);return toast('読込前に個人／法人の区分を設定してください');}forceType=type||null;importCompanyId=c.id;$('#fileInput').value='';$('#fileInput').click();}
async function queueFiles(list){const c=W.current(workspace);if(!c)return toast('会社を選んでから資料を読み込んでください');if(!c.entityType)return toast('先に個人／法人の区分を設定してください');importCompanyId=c.id;files=list.filter(f=>/\.(csv|tsv|txt)$/i.test(f.name));if(!files.length)return toast('CSV・TSV・テキスト形式を選んでください');if(files.length>10)return toast('一度に選ぶファイルは10個以内にしてください');await nextFile();}
async function nextFile(){
 if(!files.length){pending=null;return;}const file=files.shift();if(file.size>12*1024*1024){toast('12MB以内のCSVにしてください');return nextFile();}
 const end=M.busy('CSVを読み込み中…');try{
 const target=importCompanyId,bytes=await file.arrayBuffer();if(target!==workspace.activeId){files=[];return toast('会社が切り替わったため読込を停止しました');}let encoding='utf-8',text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch{encoding='shift_jis';text=new TextDecoder('shift_jis').decode(bytes);}
 let rows;try{rows=E.parseCSV(text);}catch(err){toast(err.message);return nextFile();}
 let type=forceType;if(!type){const rh=F.headerRow(rows,'monthlyPL',session.project),wide=F.monthColumns(rows[rh],session.project).length>0,reportName=file.name+' '+rows.slice(0,rh).flat().join(' ');if(wide)type=/BS|貸借対照表/i.test(reportName)?'monthlyBS':'monthlyPL';else{const scores=Object.keys(E.TYPES).filter(k=>!['prior','monthlyPL','monthlyBS'].includes(k)).map(k=>{const i=E.headerRow(rows,k);return [k,E.TYPES[k].required.filter(f=>E.guessMapping(rows[i],k)[f]>=0).length/E.TYPES[k].required.length];}).sort((a,b)=>b[1]-a[1]);type=scores[0][0];}}
 const h=E.headerRow(rows,type,session.project);pending={file,bytes,rows,encoding,type,companyId:target,headerIndex:h,mapping:E.guessMapping(rows[h],type,session.project),unit:F.detectUnit(rows,h),basis:F.detectBasis(rows,h),fingerprint:E.hash(text),mode:type==='prior'?'append':'replace',skip:false,scopeAcknowledged:false,historyStatus:'reference'};
 showImport();decorateHistoryImport();
 }catch(err){toast('CSVを読み込めません：'+err.message);return nextFile();}finally{end();}
}
function decorateHistoryImport(){
 const p=pending;if(!p)return;const dlg=$('#importDialog');let html=dlg.innerHTML.replace(/<section id="historyImportOptions"[^>]*>[\s\S]*?<\/section>/g,'').replace(/<p id="importCompanyScope"[^>]*>[\s\S]*?<\/p>/g,'');
 html=html.replace('<p class="importname">',`<p id="importCompanyScope" class="notice">読込先：<strong>${esc(W.current(workspace)?.name||'')}</strong>。この会社の資料か確認してください。</p><p class="importname">`);
 if(p.type==='prior'){
   const extra=`<section id="historyImportOptions" class="panelbody"><div class="notice amber">案件：${esc(session.project.name)}。同じ顧客の資料だけを蓄積します。標準は既存履歴に追加。過去の処理を正解とは自動認定しません。</div><label class="checklabel"><input type="checkbox" id="historySameClient" ${p.scopeAcknowledged?'checked':''}>このCSVは、現在の案件と同じ顧客の過去仕訳帳です</label><div class="field" style="margin-top:12px"><label for="historyImportStatus">資料の確認状態</label><select id="historyImportStatus">${Object.entries(E.History.statusNames).map(([k,t])=>`<option value="${k}" ${p.historyStatus===k?'selected':''}>${t}</option>`).join('')}</select></div></section>`;
   html=html.replace('<div class="dialogfoot">',extra+'<div class="dialogfoot">');
 }
 const t=E.TYPES[p.type],valid=t.required.every(k=>p.mapping[k]>=0)&&p.preview.items.length&&(!p.preview.errors.length||p.skip)&&(p.type!=='prior'||p.scopeAcknowledged);
 dlg.innerHTML=html.replace(/<button class="btn primary" data-action="commitImport"[^>]*>/,`<button class="btn primary" data-action="commitImport" ${valid?'':'disabled'}>`);
}
function showImport(){const p=pending,t=E.TYPES[p.type];const preview=E.normalizeRows(p.rows,p.type,p.mapping,p.headerIndex,{project:session.project,unit:p.unit,basis:p.basis});p.preview=preview;const mapped=t.required.every(k=>p.mapping[k]>=0),valid=mapped&&preview.items.length&&(!preview.errors.length||p.skip);const dates=preview.items.map(r=>r.date).filter(Boolean).sort();$('#importDialog').innerHTML=`<div class="dialoghead"><div><div class="eyebrow">IMPORT PREVIEW</div><h2 id="importTitle">列の対応を確認</h2></div><button class="close" data-action="closeImport" aria-label="閉じる">×</button></div><div class="dialogbody"><p class="importname"><strong>${esc(p.file.name)}</strong></p><div class="mapping"><div class="field"><label for="importType">資料の種類</label><select id="importType">${Object.entries(E.TYPES).map(([k,x])=>`<option value="${k}" ${k===p.type?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label for="encoding">文字コード</label><select id="encoding"><option value="utf-8" ${p.encoding==='utf-8'?'selected':''}>UTF-8</option><option value="shift_jis" ${p.encoding==='shift_jis'?'selected':''}>Shift_JIS</option></select></div><div class="field"><label for="headerIndex">見出し行</label><select id="headerIndex">${p.rows.slice(0,Math.min(25,p.rows.length-1)).map((r,i)=>`<option value="${i}" ${i===p.headerIndex?'selected':''}>${i+1}行目：${esc(r.slice(0,3).join(' / ').slice(0,60))}</option>`).join('')}</select></div><div class="field"><label for="importMode">既存データへの反映</label><select id="importMode"><option value="replace" ${p.mode==='replace'?'selected':''}>同じ種類の資料を置き換える</option><option value="append" ${p.mode==='append'?'selected':''}>既存資料に追加する</option></select></div></div><details ${mapped?'':'open'}><summary>列の対応 ${mapped?'（必須列を検出）':'（必須列の指定が必要）'}</summary><div class="mapping">${Object.keys(t.fields).map(k=>`<div class="field"><label for="map_${k}">${E.LABELS[k]} ${t.required.includes(k)?'＊':''}</label><select id="map_${k}" data-map="${k}"><option value="-1">指定なし</option>${p.rows[p.headerIndex].map((h,i)=>`<option value="${i}" ${p.mapping[k]===i?'selected':''}>${i+1}列：${esc(D.headerLabel(p.rows[p.headerIndex],i))}</option>`).join('')}</select></div>`).join('')}</div></details><p class="previewrange">有効 ${preview.items.length.toLocaleString()}行 ／ 読取エラー ${preview.errors.length}行${dates.length?`　期間 ${dates[0]}〜${dates.at(-1)}`:''}</p>${preview.errors.length?`<div class="notice error" style="margin-top:12px">読取エラー：${preview.errors.slice(0,6).map(e=>`${e.line}行目 ${esc(e.fields.join('・'))}`).join('／')}${preview.errors.length>6?' ほか':''}<br>日付は年付き、金額は数字が必要です。列の対応と原CSVを確認してください。<label class="checklabel checkbox-row"><input id="skipErrors" type="checkbox" ${p.skip?'checked':''}>エラー行を除外して取り込む（除外件数を記録）</label></div>`:''}${financialImportOptions(p,preview)}${KH&&['current','prior'].includes(p.type)?`<label class="checklabel checkbox-row kubunshare"><input id="shareKubun" type="checkbox" ${p.shareKubun!==false?'checked':''}><span>消費税区分チェックにも同じCSVを入れる<br><span class="small">同じ会社の「消費税区分」画面で、科目×税区分の違和感チェックに使います。freeeの仕訳帳・総勘定元帳の形式だけ読み取ります。</span></span></label>`:''}${reportTotalsPreview(preview)}${journalImportSummary(preview)}${D.importSummary(preview)}<div class="previewtable" style="margin-top:15px"><table class="datatable"><thead><tr>${p.rows[p.headerIndex].slice(0,8).map((h,i)=>`<th>${esc(D.headerLabel(p.rows[p.headerIndex],i))}</th>`).join('')}</tr></thead><tbody>${p.rows.slice(p.headerIndex+1,p.headerIndex+5).map(r=>`<tr>${r.slice(0,8).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:12px">月次PL・BSは横形式にも対応。月・科目・金額のプレビューと、列の対応を確認してから取り込んでください。</p></div><div class="dialogfoot"><button class="btn" data-action="closeImport">キャンセル</button><button class="btn primary" data-action="commitImport" ${!valid?'disabled':''}>${preview.items.length}行を読み込む</button></div>`;if(!$('#importDialog').open)$('#importDialog').showModal();}
function financialImportOptions(p,preview){
 if(!['monthlyPL','monthlyBS'].includes(p.type))return '';
 return `<section class="panelbody"><div class="mapping"><div class="field"><label for="financialImportUnit">帳票の金額単位</label><select id="financialImportUnit"><option value="1" ${p.unit!==1000?'selected':''}>円（正確な照合用）</option><option value="1000" ${p.unit===1000?'selected':''}>千円（概数・照合保留）</option></select></div>${p.type==='monthlyPL'?`<div class="field"><label for="financialImportBasis">PLの表示方法</label><select id="financialImportBasis"><option value="monthly" ${p.basis!=='cumulative'?'selected':''}>単月の金額</option><option value="cumulative" ${p.basis==='cumulative'?'selected':''}>累計（取込不可・単月で再出力）</option></select></div>`:'<div class="field"><label>BSの表示方法</label><p>各月末残高。合算しません。</p></div>'}</div><div class="notice">${preview.reportStats?`${preview.reportStats.accounts}科目・表示行 ／ ${preview.reportStats.months.join('・')} ／ ${p.unit===1000?'千円から円に換算':'円単位'}${preview.reportStats.openingMonth?'<br>期首残高は '+preview.reportStats.openingMonth+' 末の残高として保持し、最初の月の増減照合に使います。':''}`:'科目と年月の列を確認してください。'}<br>合計・利益行はそのまま表示し、科目合計に重ねません。対象期間外の列は保持しますが、レビュー対象に含めません。</div>${(preview.warnings||[]).map(w=>`<div class="notice amber" style="margin-top:10px">${esc(w)}</div>`).join('')}</section>`;
}
function reportTotalsPreview(preview){
 const rows=preview.reportStats?.reportedTotals||[];if(!rows.length)return '';
 const value=n=>Number.isFinite(n)?money(n):'未読込';
 return `<details class="panelbody"><summary>CSVの期間累計を確認（${rows.length}科目・表示行）</summary><p class="small" style="margin:12px 0">期間累計はCSVに含まれる月全体の合計として保存します。レビューの対象期間合計は、選択した月の金額から別に計算します。</p><div class="tablewrap"><table class="datatable"><thead><tr><th>科目</th><th>CSVの期間累計</th><th>CSVの月別合計</th><th>差額</th></tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr><td>${esc(r.account)}</td><td>${value(r.reported)}</td><td>${value(r.calculated)}</td><td>${value(r.difference)}</td></tr>`).join('')}</tbody></table></div>${rows.length>100?'<p class="small">先頭100行を表示。全件の期間累計は保存データに保持します。</p>':''}</details>`;
}
function journalImportSummary(preview){
 const s=preview.journalStats;if(!s)return '';
 return `<div class="notice" style="margin-top:12px"><strong>複合仕訳は全行をまとめて確認</strong><br>CSV内のまとまり ${s.groups}件 ／ 読込行の貸借一致 ${s.balanced}件${s.inherited?` ／ 日付・番号を引き継いだ行 ${s.inherited}行`:''}${s.ambiguous?`<br>番号の対応が不明なまとまり ${s.ambiguous}件。仕訳番号とNo.の列を確認してください。`:''}<br><span class="small">元CSVに含まれない行は補えません。科目で絞り込んだCSVでは、貸借判定を保留します。</span></div>`;
}
function balanceSummary(f){
 if(!f.balanceTotals)return '';
 return `<div class="teachsection"><h3>今回の集計範囲</h3><p>読込 ${f.rows.length}行<br>借方合計：${money(f.balanceTotals.debit)}<br>貸方合計：${money(f.balanceTotals.credit)}<br>${f.dataReview?'仕訳全体の貸借判定は保留しています。':'全行指定済みの資料内で差額を確認しています。'}</p></div>`;
}
async function commitImport(){
 const p=pending;if(!p)return;const t=E.TYPES[p.type];
 if(p.companyId!==workspace.activeId)return toast('会社が切り替わりました。対象会社で資料を選び直してください');
 if(p.type==='prior'&&!p.scopeAcknowledged)return toast('同じ顧客の資料であることを確認してください');
 if(!t.required.every(k=>p.mapping[k]>=0)||!p.preview.items.length||p.preview.errors.length&&!p.skip)return;
 const duplicate=session.imports.some(i=>i.type===p.type&&i.fingerprint===p.fingerprint);
 if(duplicate&&p.mode==='append')return toast('同じファイルは読込済みです。重複追加を止めました');
 if(p.preview.items.length+(p.mode==='append'?session.datasets[p.type].length:0)>100000)return toast('資料1種類につき10万行以内にしてください');
 if(p.mode==='append'&&!session.demo&&(p.type==='current'||p.type==='prior')){
   const ids=new Set(session.datasets[p.type].filter(r=>r.hasId).map(r=>r.date+'|'+r.id));
   if(p.preview.items.some(r=>r.hasId&&ids.has(r.date+'|'+r.id)))return toast('同じ日付・仕訳番号の資料が重なっています。「置き換える」か、重ならない期間のCSVを選んでください');
 }

 confirmAction('バックアップを追加して復元',`${incoming.companies.length}社分を追加します。同名や同じ識別情報で内容が違う会社は、別の会社として復元し、現在の資料・メモを保持します。`,()=>{try{syncActive();const merged=W.merge(workspace,incoming),first=merged.added.find(c=>!c.archived);if(first)openCompany(first.id);else{save();view='companies';render();}const msg=merged.added.length+'社を復元／同じ内容 '+merged.skipped+'社は追加なし';if(kubunData&&KH){toast(msg+'。消費税区分の記録を確認中…');KH.importAll(kubunData,merged.idMap).then(n=>toast(msg+'。消費税区分は今の記録を残し、足りない分を補いました（新しい会社 '+n+'社）')).catch(()=>toast(msg+'。消費税区分の記録は復元できませんでした'));}else toast(msg);}catch(err){toast(err.message);}});
});
$('#companyCSVInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1024*1024)return toast('会社一覧CSVは1MB以内にしてください');const end=M.busy('会社一覧を読み込み中…');try{const bytes=await f.arrayBuffer();let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch{text=new TextDecoder('shift_jis').decode(bytes);}$('#bulkText').value=text;previewCompanies();}catch(err){toast(err.message);}finally{end();}});
$('#importDialog').addEventListener('cancel',()=>{files=[];pending=null;});

if(document.modelContext?.registerTool){for(const tool of [{name:'read_review_summary',title:'レビューの確認状況',description:'選択中の会社の対象期間、抽出件数、未確認件数を読む。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({companyId:workspace.activeId,name:W.current(workspace)?.name||null,start:session.project.start,end:session.project.end,rows:result.current.length,findings:result.findings.length,unresolved:result.findings.filter(f=>decision(f.id).status==='open').length})},{name:'navigate_review_section',title:'レビュー画面を開く',description:'会社一覧、レビュー、月次PL・BS、消費税区分、資料、取引の情報、過去履歴、先生、チェックシート、メモ、根拠の画面へ移動する。資料と記録は変更しない。',inputSchema:{type:'object',properties:{section:{type:'string',enum:['companies','review','monthly','kubun','data','context','history','teacher','check','memo','book']}},required:['section'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{navigate(input?.section);return {section:view};}}])try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{});}catch{}}
window.LedgerApp={getSession:()=>session,getResult:()=>result,getWorkspace:()=>workspace,openCompany,loadDemo:loadDemoCompany,setSession:x=>{monthlyFocus=null;session=E.validateSession(x);let c=W.current(workspace);if(!c){c=W.add(workspace,{name:session.project.name,entityType:session.project.type},session);workspace.activeId=c.id;session=c.session;}else{c.session=session;c.name=session.project.name;c.entityType=session.project.type;}recompute();syncActive();view='review';render();}};
render();initDB().then(()=>{if(KH)setTimeout(()=>KH.ensure(),400);});
